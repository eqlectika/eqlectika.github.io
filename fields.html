<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="manifest-fields.json" />
    <title>Fields</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

html,
body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #1e1e1e;
}

.panels {
    display: flex;
    width: 100vw;
    height: 100%;
    height: 100dvh;
    background: #1e1e1e;
    overflow: hidden;
}

        .panel {
            flex: 1 1 0;
            min-width: 80px;
            width: 0;
            background: white;
            position: relative;
            overflow: hidden;
    height: 100%;
    height: 100dvh;
        }

        .panel iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .resizer {
            width: 6px;
            min-width: 6px;
            flex: 0 0 6px;
            background: #1e1e1e;
            position: relative;
            z-index: 100;
            cursor: ns-resize;
            touch-action: none;
        }

        .resizer::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: -20px;
            right: -20px;
            z-index: 0;
        }

        .resizer-handle {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -50%);
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
            z-index: 2;
        }

        .resizer.active {
            background: #3b82f6;
        }

        body.is-resizing {
            user-select: none;
        }

        body.is-resizing iframe {
            pointer-events: none;
        }

        .handle-menu {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            gap: 5px;
            padding: 6px;
            background: rgba(20, 20, 20, 0.96);
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
            z-index: 1000;
            touch-action: manipulation;
        }

        .handle-menu.open {
            display: flex;
        }

        .menu-row {
            display: flex;
            gap: 5px;
        }

        .handle-menu button {
            width: 38px;
            height: 34px;
            border: none;
            border-radius: 7px;
            background: #00f;
            color: white;
            font-size: 19px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .handle-menu button:active {
            transform: scale(0.92);
            background: #555;
        }

        .menu-label {
            color: #aaa;
            font-family: sans-serif;
            font-size: 9px;
            text-align: center;
            padding-bottom: 2px;
        }

        .panel-controllers {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 10px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
        }

        .panel-controllers button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #00f;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .panel-controllers button:active {
            transform: scale(0.9);
        }}

        .dots {
            display: none;
        }

@media (max-width: 1024px) {
    .panels, .panel-controllers, .dots, .resizer {
        display: none !important;
    }
    
    body::before {
        content: "This interface is only available on Desktop";
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #fff;
        background: #1e1e1e;
        font-family: sans-serif;
        text-align: center;
        padding: 20px;
    }
}

    </style>
</head>
<body>

    <div class="panels" id="panels"></div>
    <div class="dots" id="dots"></div>
    <div class="panel-controllers" id="panelControllers">
        <button id="mobileRemoveBtn">−</button>
        <button id="mobileAddBtn">+</button>
    </div>

    <script>

const isMobile = window.innerWidth <= 1024 || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

if (isMobile) {

    document.addEventListener('DOMContentLoaded', () => {
        document.body.innerHTML = `
            <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #1e1e1e; color: white; font-family: sans-serif; text-align: center; padding: 20px;">
                <div>
                    <h2>Только для десктопов</h2>
                    <p style="margin-top: 10px; color: #aaa;">Этот интерфейс предназначен только для работы на компьютерах.</p>
                </div>
            </div>
        `;
    });
    throw new Error('Desktop-only application'); // Прерываем выполнение остального скрипта
}

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker
                .register('/sw.js')
                .then(registration => {
                    console.log('✅ Service Worker зарегистрирован:', registration);
                })
                .catch(error => {
                    console.log('❌ Ошибка регистрации SW:', error);
                });
        }

        const pages = [
            'paramount.html',
            'match.html',
            'capital.html',
            'flash.html',
            'cross.html'
        ];

        const panelsContainer = document.getElementById('panels');
        const dotsContainer = document.getElementById('dots');
        const panelControllers = document.getElementById('panelControllers');
        const mobileAddBtn = document.getElementById('mobileAddBtn');
        const mobileRemoveBtn = document.getElementById('mobileRemoveBtn');

        const isMobile = window.innerWidth <= 768;
        let panels = [];

        function createPanel(page) {
            const panel = document.createElement('div');
            panel.className = 'panel';

            const iframe = document.createElement('iframe');
            iframe.src = page;
            iframe.loading = 'lazy';
            iframe.setAttribute('allow', 'fullscreen');

            iframe.addEventListener('load', function() {
                try {
                    const currentUrl = this.contentWindow.location.href;
                    if (this.src !== currentUrl) {
                        this.src = currentUrl;
                        savePanelsState();
                    }
                } catch (e) {}
            });

            panel.appendChild(iframe);
            return panel;
        }

        function updatePanelsList() {
            panels = Array.from(document.querySelectorAll('.panel'));
            updateMobileControllersVisibility();
        }

        function updateMobileControllersVisibility() {
            if (!isMobile) return;
            if (panels.length > 1) {
                panelControllers.style.display = 'flex';
                dotsContainer.style.display = 'none';
            } else {
                panelControllers.style.display = 'none';
                dotsContainer.style.display = 'none';
            }
        }

        function savePanelsState() {
            updatePanelsList();
            const panelUrls = panels.map(panel => {
                const iframe = panel.querySelector('iframe');
                return iframe ? iframe.src : null;
            }).filter(src => src !== null);
            localStorage.setItem('panelsState', JSON.stringify(panelUrls));
        }

        function restorePanelsState() {
            const saved = localStorage.getItem('panelsState');
            if (!saved) return false;
            
            try {
                const panelUrls = JSON.parse(saved);
                if (!panelUrls || panelUrls.length === 0) return false;
                
                panelsContainer.innerHTML = '';
                
                panelUrls.forEach(url => {
                    const page = url.split('/').pop() || url;
                    panelsContainer.appendChild(createPanel(page));
                });
                
                updatePanelsList();
                
                if (!isMobile) {
                    rebuildResizers();
                    initializePanelWidths();
                } else {
                    rebuildDots();
                }
                
                return true;
            } catch (e) {
                return false;
            }
        }

window.addEventListener('message', function(event) {
    if (!event.data) return;

    // Обработка запроса на полноэкранный режим из iframe
    if (event.data.type === 'TOGGLE_FULLSCREEN') {
        const iframes = document.querySelectorAll('iframe');
        iframes.forEach(iframe => {
            if (iframe.contentWindow === event.source) {
                const panel = iframe.closest('.panel');
                if (panel) {
                    if (!document.fullscreenElement) {
                        panel.requestFullscreen().catch(err => {
                            console.error("Error attempting to enable fullscreen:", err);
                        });
                    } else {
                        document.exitFullscreen();
                    }
                }
            }
        });
    }

    // Ваш существующий обработчик URL_CHANGED
    if (event.data.type === 'URL_CHANGED') {
        const iframes = document.querySelectorAll('iframe');
        iframes.forEach(iframe => {
            try {
                if (iframe.contentWindow === event.source) {
                    iframe.src = event.data.url;
                    savePanelsState();
                }
            } catch (e) {}
        });
    }
});

        if (!isMobile) {
            function createResizer() {
                const resizer = document.createElement('div');
                resizer.className = 'resizer';

                const handle = document.createElement('img');
                handle.className = 'resizer-handle';
                handle.src = 'paw.png';
                handle.alt = '';
                resizer.appendChild(handle);

                const menu = document.createElement('div');
                menu.className = 'handle-menu';

                const label = document.createElement('div');
                label.className = 'menu-label';
                label.textContent = 'FIELD';
                menu.appendChild(label);

                const row1 = document.createElement('div');
                row1.className = 'menu-row';
                const addLeft = document.createElement('button');
                addLeft.textContent = '+';
                const addRight = document.createElement('button');
                addRight.textContent = '+';
                row1.appendChild(addLeft);
                row1.appendChild(addRight);

                const row2 = document.createElement('div');
                row2.className = 'menu-row';
                const removeLeft = document.createElement('button');
                removeLeft.textContent = '−';
                const removeRight = document.createElement('button');
                removeRight.textContent = '−';
                row2.appendChild(removeLeft);
                row2.appendChild(removeRight);

                menu.appendChild(row1);
                menu.appendChild(row2);
                resizer.appendChild(menu);

                addLeft.addEventListener('pointerdown', e => {
                    e.stopPropagation();
                    e.preventDefault();
                    addPanelLeft(resizer);
                });

                addRight.addEventListener('pointerdown', e => {
                    e.stopPropagation();
                    e.preventDefault();
                    addPanelRight(resizer);
                });

                removeLeft.addEventListener('pointerdown', e => {
                    e.stopPropagation();
                    e.preventDefault();
                    removePanelLeft(resizer);
                });

                removeRight.addEventListener('pointerdown', e => {
                    e.stopPropagation();
                    e.preventDefault();
                    removePanelRight(resizer);
                });

                return resizer;
            }

            function rebuildResizers() {
                document.querySelectorAll('.resizer').forEach(resizer => {
                    resizer.remove();
                });

                updatePanelsList();

                panels.forEach((panel, index) => {
                    if (index >= panels.length - 1) {
                        return;
                    }
                    const resizer = createResizer();
                    panelsContainer.insertBefore(resizer, panel.nextSibling);
                });

                setupResizers();
            }

            function initializePanelWidths() {
                updatePanelsList();
                const resizers = Array.from(document.querySelectorAll('.resizer'));
                const availableWidth = panelsContainer.clientWidth - resizers.length * 6;
                const width = availableWidth / panels.length;

                panels.forEach(panel => {
                    panel.style.flex = '0 0 auto';
                    panel.style.width = `${width}px`;
                });

                resizers.forEach(resizer => {
                    const handle = resizer.querySelector('.resizer-handle');
                    if (handle) {
                        handle.style.top = '50%';
                    }
                });
            }

            function addPanelLeft(resizer) {
                updatePanelsList();
                const allResizers = Array.from(document.querySelectorAll('.resizer'));
                const index = allResizers.indexOf(resizer);
                if (index === -1) return;
                
                const leftPanel = panels[index];
                if (!leftPanel) return;
                
const url = prompt('Enter the URL for the new panel:', 'match.html');
if (!url) return;
                
                const newPanel = createPanel(url);
                panelsContainer.insertBefore(newPanel, resizer);
                
                updatePanelsList();
                rebuildResizers();
                initializePanelWidths();
                savePanelsState();
            }

            function addPanelRight(resizer) {
                updatePanelsList();
                const allResizers = Array.from(document.querySelectorAll('.resizer'));
                const index = allResizers.indexOf(resizer);
                if (index === -1) return;
                
                const rightPanel = panels[index + 1];
                if (!rightPanel) return;
                
const url = prompt('Enter the URL for the new panel:', 'match.html');
if (!url) return
                
                const newPanel = createPanel(url);
                panelsContainer.insertBefore(newPanel, rightPanel);
                
                updatePanelsList();
                rebuildResizers();
                initializePanelWidths();
                savePanelsState();
            }

            function removePanelLeft(resizer) {
                updatePanelsList();
                if (panels.length <= 1) return;

                const allResizers = Array.from(document.querySelectorAll('.resizer'));
                const index = allResizers.indexOf(resizer);
                if (index < 0 || !panels[index]) return;

                panels[index].remove();
                rebuildResizers();
                initializePanelWidths();
                savePanelsState();
            }

            function removePanelRight(resizer) {
                updatePanelsList();
                if (panels.length <= 1) return;

                const allResizers = Array.from(document.querySelectorAll('.resizer'));
                const index = allResizers.indexOf(resizer);
                if (index < 0 || !panels[index + 1]) return;

                panels[index + 1].remove();
                rebuildResizers();
                initializePanelWidths();
                savePanelsState();
            }

            function closeAllMenus(except = null) {
                document.querySelectorAll('.handle-menu').forEach(menu => {
                    if (menu !== except) {
                        menu.classList.remove('open');
                    }
                });
            }

            function setupResizers() {
                const resizers = Array.from(document.querySelectorAll('.resizer'));

                resizers.forEach((resizer, index) => {
                    const prevPanel = panels[index];
                    const nextPanel = panels[index + 1];

                    if (!prevPanel || !nextPanel) return;

                    let active = false;
                    let moved = false;
                    let startX = 0;
                    let startY = 0;
                    let animationFrame = null;
                    let pendingY = null;

                    function setPosition(clientY) {
                        const rect = resizer.getBoundingClientRect();
                        let y = clientY - rect.top;
                        const handleSize = 24;
                        const halfHandle = handleSize / 2;

                        y = Math.max(halfHandle, Math.min(rect.height - halfHandle, y));

                        const percent = (y / rect.height) * 100;
                        const handle = resizer.querySelector('.resizer-handle');
                        handle.style.top = `${percent}%`;

                        const totalWidth = prevPanel.getBoundingClientRect().width + nextPanel.getBoundingClientRect().width;
                        const minWidth = 80;
                        let ratio = 1 - y / rect.height;
                        let newPrevWidth = totalWidth * ratio;

                        newPrevWidth = Math.max(minWidth, Math.min(totalWidth - minWidth, newPrevWidth));
                        const newNextWidth = totalWidth - newPrevWidth;

                        prevPanel.style.width = `${newPrevWidth}px`;
                        nextPanel.style.width = `${newNextWidth}px`;
                    }

                    function pointerDown(e) {
                        if (e.target.closest('.handle-menu')) return;
                        e.preventDefault();
                        active = true;
                        moved = false;
                        startX = e.clientX;
                        startY = e.clientY;
                        pendingY = e.clientY;

                        resizer.classList.add('active');
                        document.body.classList.add('is-resizing');
                        resizer.setPointerCapture?.(e.pointerId);
                    }

                    function pointerMove(e) {
                        if (!active) return;
                        const deltaX = Math.abs(e.clientX - startX);
                        const deltaY = Math.abs(e.clientY - startY);

                        if (deltaX > 6 || deltaY > 6) {
                            moved = true;
                            closeAllMenus();
                        }

                        if (!moved) return;
                        pendingY = e.clientY;

                        if (animationFrame !== null) return;

                        animationFrame = requestAnimationFrame(() => {
                            animationFrame = null;
                            if (!active || pendingY === null) return;
                            setPosition(pendingY);
                        });
                    }

                    function pointerUp(e) {
                        if (!active) return;
                        active = false;
                        pendingY = null;

                        if (animationFrame !== null) {
                            cancelAnimationFrame(animationFrame);
                            animationFrame = null;
                        }

                        resizer.classList.remove('active');
                        document.body.classList.remove('is-resizing');

                        try {
                            resizer.releasePointerCapture?.(e.pointerId);
                        } catch (_) {}

                        if (!moved) {
                            const menu = resizer.querySelector('.handle-menu');
                            const isOpen = menu.classList.contains('open');
                            closeAllMenus(isOpen ? null : menu);
                            menu.classList.toggle('open', !isOpen);
                        }
                    }

                    resizer.addEventListener('pointerdown', pointerDown);
                    resizer.addEventListener('pointermove', pointerMove);
                    resizer.addEventListener('pointerup', pointerUp);
                    resizer.addEventListener('pointercancel', pointerUp);
                    resizer.addEventListener('lostpointercapture', pointerUp);
                });
            }

            rebuildResizers();
            initializePanelWidths();

            document.addEventListener('pointerdown', e => {
                if (!e.target.closest('.resizer')) {
                    closeAllMenus();
                }
            });

            let resizeTimer = null;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (!document.body.classList.contains('is-resizing')) {
                        initializePanelWidths();
                    }
                }, 100);
            });
        }

        if (isMobile) {
            function rebuildDots() {
                dotsContainer.innerHTML = '';
                updatePanelsList();

                if (panels.length <= 1) {
                    dotsContainer.style.display = 'none';
                    return;
                }

                dotsContainer.style.display = 'flex';

                panels.forEach((_, index) => {
                    const dot = document.createElement('button');
                    dot.dataset.index = index;

                    if (index === 0) {
                        dot.classList.add('active');
                    }

                    dot.addEventListener('click', () => {
                        updatePanelsList();
                        const panel = panels[index];
                        if (!panel) return;

                        panel.scrollIntoView({
                            behavior: 'smooth',
                            block: 'nearest',
                            inline: 'start'
                        });
                    });

                    dotsContainer.appendChild(dot);
                });

                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (!entry.isIntersecting) return;
                        updatePanelsList();
                        const index = panels.indexOf(entry.target);
                        if (index === -1) return;

                        document.querySelectorAll('.dots button').forEach((dot, i) => {
                            dot.classList.toggle('active', i === index);
                        });
                    });
                }, {
                    root: panelsContainer,
                    threshold: 0.6
                });

                panels.forEach(panel => {
                    observer.observe(panel);
                });
            }

            mobileAddBtn.addEventListener('click', () => {
const url = prompt('Enter the URL for the new panel:', 'match.html');
if (!url) return

                const newPanel = createPanel(url);
                panelsContainer.appendChild(newPanel);
                updatePanelsList();
                rebuildDots();
                savePanelsState();

                newPanel.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest',
                    inline: 'start'
                });
            });

            mobileRemoveBtn.addEventListener('click', () => {
                updatePanelsList();
                if (panels.length <= 1) return;

                let scrollLeft = panelsContainer.scrollLeft;
                let panelWidth = panelsContainer.clientWidth;
                let currentIndex = Math.round(scrollLeft / panelWidth);

                if (currentIndex >= panels.length) {
                    currentIndex = panels.length - 1;
                }

                panels[currentIndex].remove();
                updatePanelsList();
                rebuildDots();
                savePanelsState();

                let newTargetIndex = Math.max(0, currentIndex - 1);
                if (panels[newTargetIndex]) {
                    panels[newTargetIndex].scrollIntoView({
                        behavior: 'smooth',
                        block: 'nearest',
                        inline: 'start'
                    });
                }
            });
        }

        if (!restorePanelsState()) {
            if (isMobile) {
                panelsContainer.appendChild(createPanel(pages[0]));
            } else {
                pages.forEach(page => {
                    panelsContainer.appendChild(createPanel(page));
                });
            }
            updatePanelsList();
            if (!isMobile) {
                rebuildResizers();
                initializePanelWidths();
            } else {
                rebuildDots();
            }
            savePanelsState();
        } else {
            if (isMobile) {
                rebuildDots();
            }
        }
    </script>
</body>
</html>
