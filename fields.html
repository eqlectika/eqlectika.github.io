<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="manifest-fields.json" />
    <title>Fields</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
        }

        .panels {
            display: flex;
            width: 100vw;
            height: 100vh;
            background: #1e1e1e;
            overflow: hidden;
        }

        .panel {
            flex: 1 1 0;
            min-width: 80px;
            width: 0;
            background: white;
            position: relative;
            overflow: hidden;
        }

        .panel iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* =========================
           VERTICAL CONTROL AXIS
           ========================= */

        .resizer {
            width: 6px;
            min-width: 6px;
            flex: 0 0 6px;
            background: #1e1e1e;
            position: relative;
            z-index: 10;
            cursor: ns-resize;
            touch-action: none;
        }

        /*
         * Увеличенная зона попадания.
         * Клик/тап по ней тоже считается.
         */
        .resizer::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: -20px;
            right: -20px;
            z-index: 0;
        }

        /*
         * Сам handle.
         */
        .resizer-handle {
            position: absolute;
            left: 50%;
            top: 50%;

            width: 24px;
            height: 24px;

            transform: translate(-50%, -50%);

            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;

            pointer-events: none;
            z-index: 2;
        }

        .resizer.active {
            background: #3b82f6;
        }

        body.is-resizing {
            user-select: none;
        }

        body.is-resizing iframe {
            pointer-events: none;
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 768px) {

            .panels {
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                scroll-snap-type: x mandatory;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }

            .panels::-webkit-scrollbar {
                display: none;
            }

            .panel {
                flex: 0 0 100vw;
                width: 100vw;
                min-width: 100vw;
                height: 100vh;
                scroll-snap-align: start;
                background: white;
            }

            .resizer {
                display: none;
            }

            .dots {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 8px;
                z-index: 100;
                background: rgba(0, 0, 0, 0.6);
                padding: 8px 14px;
                border-radius: 30px;
                backdrop-filter: blur(8px);
            }

            .dots button {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                border: none;
                background: rgba(255, 255, 255, 0.3);
                cursor: pointer;
                padding: 0;
                transition:
                    background 0.2s ease,
                    transform 0.2s ease;
                flex-shrink: 0;
            }

            .dots button.active {
                background: white;
                transform: scale(1.3);
            }

            .dots button:hover {
                background: rgba(255, 255, 255, 0.6);
            }
        }

        .dots {
            display: none;
        }

        @media (min-width: 769px) {
            .dots {
                display: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="panels" id="panels"></div>

    <div class="dots" id="dots"></div>

    <script>

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('✅ Service Worker зарегистрирован:', registration);
                })
                .catch(error => {
                    console.log('❌ Ошибка регистрации SW:', error);
                });
        }


        const pages = [
            'match.html',
            'index.html',
            'capital.html',
            'flash.html',
            'cross.html'
        ];


        const panelsContainer =
            document.getElementById('panels');

        const dotsContainer =
            document.getElementById('dots');


        pages.forEach(page => {

            const panel =
                document.createElement('div');

            panel.className = 'panel';


            const iframe =
                document.createElement('iframe');

            iframe.src = page;
            iframe.loading = 'lazy';


            panel.appendChild(iframe);
            panelsContainer.appendChild(panel);
        });


        const panels =
            Array.from(
                document.querySelectorAll('.panel')
            );


        const isMobile =
            window.innerWidth <= 768;


        /* =====================================================
           DESKTOP
           ===================================================== */

        if (!isMobile) {

            /*
             * Создаём оси между полями.
             */
            panels.forEach((panel, index) => {

                if (index >= panels.length - 1) {
                    return;
                }


                const resizer =
                    document.createElement('div');

                resizer.className = 'resizer';


                const handle =
                    document.createElement('img');

                handle.className = 'resizer-handle';
                handle.src = 'handle.png';
                handle.alt = '';


                resizer.appendChild(handle);


                panelsContainer.insertBefore(
                    resizer,
                    panel.nextSibling
                );
            });


            const resizers =
                Array.from(
                    document.querySelectorAll('.resizer')
                );


            /*
             * Начальные равные ширины.
             */
            function initializePanelWidths() {

                const availableWidth =
                    panelsContainer.clientWidth -
                    resizers.length * 6;


                const width =
                    availableWidth / panels.length;


                panels.forEach(panel => {

                    panel.style.flex = '0 0 auto';
                    panel.style.width =
                        `${width}px`;
                });


                /*
                 * После изменения окна
                 * handle снова в центре.
                 */
                resizers.forEach(resizer => {

                    const handle =
                        resizer.querySelector(
                            '.resizer-handle'
                        );

                    handle.style.top = '50%';
                });
            }


            initializePanelWidths();


            /* =================================================
               CONTROL FOR EACH AXIS
               ================================================= */

            resizers.forEach(
                (resizer, index) => {

                    const prevPanel =
                        panels[index];

                    const nextPanel =
                        panels[index + 1];


                    if (!prevPanel || !nextPanel) {
                        return;
                    }


                    let active = false;
                    let animationFrame = null;
                    let pendingY = null;


                    /*
                     * Одна функция управляет всем:
                     *
                     * Y координата указателя
                     *      ↓
                     * положение handle
                     *      ↓
                     * ширина двух полей
                     */
                    function setPosition(clientY) {

                        const rect =
                            resizer.getBoundingClientRect();


                        /*
                         * Координата внутри оси:
                         * 0 = верх
                         * height = низ
                         */
                        let y =
                            clientY - rect.top;


                        /*
                         * Учитываем половину handle,
                         * чтобы он не выходил за ось.
                         */
                        const handleSize = 24;
                        const halfHandle =
                            handleSize / 2;


                        y =
                            Math.max(
                                halfHandle,
                                Math.min(
                                    rect.height -
                                    halfHandle,
                                    y
                                )
                            );


                        /*
                         * Положение handle
                         * непосредственно под указателем.
                         */
                        const percent =
                            (y / rect.height) * 100;


                        const handle =
                            resizer.querySelector(
                                '.resizer-handle'
                            );


                        handle.style.top =
                            `${percent}%`;


                        /*
                         * Теперь эта же координата
                         * определяет ширину полей.
                         */
                        const totalWidth =
                            prevPanel.getBoundingClientRect().width +
                            nextPanel.getBoundingClientRect().width;


                        const minWidth = 80;


                        /*
                         * Верх оси:
                         * левое поле максимально широкое.
                         *
                         * Низ оси:
                         * правое поле максимально широкое.
                         */
                        let ratio =
                            1 -
                            y / rect.height;


                        let newPrevWidth =
                            totalWidth * ratio;


                        newPrevWidth =
                            Math.max(
                                minWidth,
                                Math.min(
                                    totalWidth -
                                    minWidth,
                                    newPrevWidth
                                )
                            );


                        const newNextWidth =
                            totalWidth -
                            newPrevWidth;


                        prevPanel.style.width =
                            `${newPrevWidth}px`;

                        nextPanel.style.width =
                            `${newNextWidth}px`;
                    }


                    /*
                     * Нажатие/касание.
                     *
                     * ВАЖНО:
                     * handle сразу прыгает в точку
                     * нажатия.
                     */
                    function pointerDown(e) {

                        e.preventDefault();
                        e.stopPropagation();


                        active = true;

                        pendingY = e.clientY;


                        resizer.classList.add(
                            'active'
                        );

                        document.body.classList.add(
                            'is-resizing'
                        );


                        setPosition(e.clientY);


                        resizer.setPointerCapture?.(
                            e.pointerId
                        );
                    }


                    /*
                     * Пока палец или мышь движется —
                     * handle следует за ними.
                     */
                    function pointerMove(e) {

                        if (!active) {
                            return;
                        }


                        pendingY = e.clientY;


                        if (animationFrame !== null) {
                            return;
                        }


                        animationFrame =
                            requestAnimationFrame(() => {

                                animationFrame = null;


                                if (
                                    !active ||
                                    pendingY === null
                                ) {
                                    return;
                                }


                                setPosition(
                                    pendingY
                                );
                            });
                    }


                    /*
                     * Отпускание.
                     */
                    function pointerUp(e) {

                        if (!active) {
                            return;
                        }


                        active = false;
                        pendingY = null;


                        if (
                            animationFrame !== null
                        ) {
                            cancelAnimationFrame(
                                animationFrame
                            );

                            animationFrame = null;
                        }


                        resizer.classList.remove(
                            'active'
                        );

                        document.body.classList.remove(
                            'is-resizing'
                        );


                        try {

                            resizer.releasePointerCapture?.(
                                e.pointerId
                            );

                        } catch (_) {}
                    }


                    resizer.addEventListener(
                        'pointerdown',
                        pointerDown
                    );

                    resizer.addEventListener(
                        'pointermove',
                        pointerMove
                    );

                    resizer.addEventListener(
                        'pointerup',
                        pointerUp
                    );

                    resizer.addEventListener(
                        'pointercancel',
                        pointerUp
                    );

                    resizer.addEventListener(
                        'lostpointercapture',
                        pointerUp
                    );
                }
            );


            /*
             * Resize окна.
             */
            let resizeTimer = null;


            window.addEventListener(
                'resize',
                () => {

                    clearTimeout(resizeTimer);


                    resizeTimer =
                        setTimeout(() => {

                            if (
                                !document.body
                                    .classList
                                    .contains(
                                        'is-resizing'
                                    )
                            ) {
                                initializePanelWidths();
                            }

                        }, 100);
                }
            );
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        if (isMobile) {

            dotsContainer.style.display = 'flex';


            pages.forEach((_, index) => {

                const dot =
                    document.createElement('button');

                dot.dataset.index = index;


                if (index === 0) {
                    dot.classList.add('active');
                }


                dot.addEventListener(
                    'click',
                    () => {

                        const panel =
                            panels[index];


                        panel.scrollIntoView({
                            behavior: 'smooth',
                            block: 'nearest',
                            inline: 'start'
                        });
                    }
                );


                dotsContainer.appendChild(dot);
            });


            const observer =
                new IntersectionObserver(
                    entries => {

                        entries.forEach(entry => {

                            if (!entry.isIntersecting) {
                                return;
                            }


                            const index =
                                panels.indexOf(
                                    entry.target
                                );


                            if (index === -1) {
                                return;
                            }


                            document
                                .querySelectorAll(
                                    '.dots button'
                                )
                                .forEach(
                                    (dot, i) => {

                                        dot.classList.toggle(
                                            'active',
                                            i === index
                                        );
                                    }
                                );
                        });
                    },
                    {
                        root: panelsContainer,
                        threshold: 0.6
                    }
                );


            panels.forEach(panel => {
                observer.observe(panel);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
    if (window.location.pathname.includes('fields.html')) {
        document.querySelector('#frameToHide')?.remove();
    }
});

    </script>

</body>
</html>
