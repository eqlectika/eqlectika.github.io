<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="manifest-fields.json" />
    <title>Fields</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #1e1e1e;
        }

        .panels {
            display: flex;
            width: 100vw;
            height: 100%;
            height: 100dvh;
            background: #1e1e1e;
            overflow: hidden;
        }

        .panel {
            flex: 1 1 0;
            width: 0;
            background: white;
            position: relative;
            overflow: hidden;
            height: 100%;
            height: 100dvh;
            min-width: 50px;
        }

        .panel iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .resizer {
            width: 6px;
            min-width: 6px;
            flex: 0 0 6px;
            background: #1e1e1e;
            position: relative;
            z-index: 100;
            cursor: col-resize;
            touch-action: none;
        }

        .resizer::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: -20px;
            right: -20px;
            z-index: 0;
        }

        .resizer-handle {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -50%);
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
            z-index: 2;
        }

        .resizer.active {
            background: #3b82f6;
        }

        body.is-resizing {
            user-select: none;
        }

        body.is-resizing iframe {
            pointer-events: none;
        }

        .handle-menu {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            gap: 5px;
            padding: 6px;
            background: rgba(20, 20, 20, 0.96);
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
            z-index: 1000;
            touch-action: manipulation;
        }

        .handle-menu.open {
            display: flex;
        }

        .menu-row {
            display: flex;
            gap: 5px;
        }

        .handle-menu button {
            width: 38px;
            height: 34px;
            border: none;
            border-radius: 7px;
            background: #3b82f6;
            color: white;
            font-size: 19px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .handle-menu button:active {
            transform: scale(0.92);
            background: #555;
        }

        .menu-label {
            color: #aaa;
            font-family: sans-serif;
            font-size: 9px;
            text-align: center;
            padding-bottom: 2px;
        }

        .panel-controllers {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
        }

        .panel-controllers button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #3b82f6;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .panel-controllers button:active {
            transform: scale(0.9);
        }

        .dots {
            display: none;
        }

        /* ============================================
           МЕДИА-ЗАПРОСЫ
           ============================================ */

        /* ТЕЛЕФОНЫ - карусель */
        @media (max-width: 768px) {
            .panels {
                overflow-x: auto !important;
                overflow-y: hidden !important;
                scroll-snap-type: x mandatory !important;
                -webkit-overflow-scrolling: touch;
            }
            
            .panel {
                flex: 0 0 100% !important;
                scroll-snap-align: start !important;
                min-width: 100% !important;
                width: 100% !important;
            }
            
            .resizer {
                display: none !important;
            }
            
            .panel-controllers {
                display: flex !important;
            }
            
            .dots {
                display: flex !important;
                justify-content: center;
                gap: 8px;
                padding: 10px 0;
                position: fixed;
                bottom: 80px;
                left: 0;
                right: 0;
                z-index: 50;
                background: rgba(0, 0, 0, 0.3);
                backdrop-filter: blur(4px);
            }
            
            .dots button {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                border: 1px solid rgba(255,255,255,0.3);
                background: rgba(255,255,255,0.2);
                cursor: pointer;
                padding: 0;
                transition: all 0.3s;
            }
            
            .dots button.active {
                background: #3b82f6;
                border-color: #3b82f6;
                width: 16px;
                border-radius: 4px;
            }
        }

        /* ПЛАНШЕТЫ И ДЕСКТОП */
        @media (min-width: 769px) {
            .panels {
                overflow: hidden !important;
            }
            
            .panel {
                flex: 1 1 0 !important;
                min-width: 80px !important;
            }
            
            .resizer {
                display: flex !important;
            }
            
            .panel-controllers {
                display: flex !important;
            }
            
            .dots {
                display: none !important;
            }
        }

        /* МАЛЕНЬКИЕ ТЕЛЕФОНЫ */
        @media (max-width: 480px) {
            .panel-controllers {
                bottom: 16px;
                padding: 6px 12px;
                gap: 8px;
            }
            
            .panel-controllers button {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }
            
            .dots {
                bottom: 70px;
                gap: 6px;
            }
            
            .dots button {
                width: 8px;
                height: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="panels" id="panels"></div>
    <div class="dots" id="dots"></div>
    <div class="panel-controllers" id="panelControllers">
        <button id="mobileRemoveBtn">−</button>
        <button id="mobileAddBtn">+</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        const panelsContainer = document.getElementById('panels');
        const dotsContainer = document.getElementById('dots');
        const addBtn = document.getElementById('mobileAddBtn');
        const removeBtn = document.getElementById('mobileRemoveBtn');

        // ============================================
        // ФУНКЦИИ СОЗДАНИЯ
        // ============================================

        function createPanel(url) {
            const panel = document.createElement('div');
            panel.className = 'panel';
            
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.loading = 'lazy';
            iframe.setAttribute('allow', 'fullscreen');
            
            iframe.addEventListener('load', function() {
                try {
                    const currentUrl = this.contentWindow.location.href;
                    if (this.src !== currentUrl) {
                        this.src = currentUrl;
                        saveState();
                    }
                } catch (e) {}
            });
            
            panel.appendChild(iframe);
            return panel;
        }

        function createResizer() {
            const resizer = document.createElement('div');
            resizer.className = 'resizer';

            const handle = document.createElement('img');
            handle.className = 'resizer-handle';
            handle.src = 'paw.png';
            handle.alt = '';
            resizer.appendChild(handle);

            const menu = document.createElement('div');
            menu.className = 'handle-menu';

            const label = document.createElement('div');
            label.className = 'menu-label';
            label.textContent = 'FIELD';
            menu.appendChild(label);

            const row1 = document.createElement('div');
            row1.className = 'menu-row';
            const addLeft = document.createElement('button');
            addLeft.textContent = '+';
            const addRight = document.createElement('button');
            addRight.textContent = '+';
            row1.appendChild(addLeft);
            row1.appendChild(addRight);

            const row2 = document.createElement('div');
            row2.className = 'menu-row';
            const removeLeft = document.createElement('button');
            removeLeft.textContent = '−';
            const removeRight = document.createElement('button');
            removeRight.textContent = '−';
            row2.appendChild(removeLeft);
            row2.appendChild(removeRight);

            menu.appendChild(row1);
            menu.appendChild(row2);
            resizer.appendChild(menu);

            // Обработчики
            addLeft.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                e.preventDefault();
                addPanelLeft(resizer);
            });

            addRight.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                e.preventDefault();
                addPanelRight(resizer);
            });

            removeLeft.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                e.preventDefault();
                removePanelLeft(resizer);
            });

            removeRight.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                e.preventDefault();
                removePanelRight(resizer);
            });

            return resizer;
        }

        function createDot(index, isActive = false) {
            const dot = document.createElement('button');
            dot.dataset.index = index;
            if (isActive) dot.classList.add('active');
            
            dot.addEventListener('click', () => {
                const panels = document.querySelectorAll('.panel');
                const panel = panels[index];
                if (!panel) return;
                
                panel.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest',
                    inline: 'start'
                });
            });
            
            return dot;
        }

        // ============================================
        // ДОБАВЛЕНИЕ/УДАЛЕНИЕ
        // ============================================

        function addPanelLeft(resizer) {
            const allResizers = Array.from(document.querySelectorAll('.resizer'));
            const index = allResizers.indexOf(resizer);
            const panels = document.querySelectorAll('.panel');
            
            if (index === -1 || !panels[index]) return;
            
            const url = prompt('Enter URL for new panel:', 'index.html');
            if (!url) return;
            
            const newPanel = createPanel(url);
            panelsContainer.insertBefore(newPanel, resizer);
            
            const newResizer = createResizer();
            panelsContainer.insertBefore(newResizer, newPanel);
            
            updateUI();
            saveState();
        }

        function addPanelRight(resizer) {
            const allResizers = Array.from(document.querySelectorAll('.resizer'));
            const index = allResizers.indexOf(resizer);
            const panels = document.querySelectorAll('.panel');
            
            if (index === -1 || !panels[index + 1]) return;
            
            const url = prompt('Enter URL for new panel:', 'index.html');
            if (!url) return;
            
            const newPanel = createPanel(url);
            panelsContainer.insertBefore(newPanel, panels[index + 1]);
            
            const newResizer = createResizer();
            panelsContainer.insertBefore(newResizer, newPanel);
            
            updateUI();
            saveState();
        }

        function removePanelLeft(resizer) {
            const allResizers = Array.from(document.querySelectorAll('.resizer'));
            const index = allResizers.indexOf(resizer);
            const panels = document.querySelectorAll('.panel');
            
            if (index === -1 || !panels[index] || panels.length <= 1) return;
            
            panels[index].remove();
            
            if (index > 0 && allResizers[index - 1]) {
                allResizers[index - 1].remove();
            }
            
            updateUI();
            saveState();
        }

        function removePanelRight(resizer) {
            const allResizers = Array.from(document.querySelectorAll('.resizer'));
            const index = allResizers.indexOf(resizer);
            const panels = document.querySelectorAll('.panel');
            
            if (index === -1 || !panels[index + 1] || panels.length <= 1) return;
            
            panels[index + 1].remove();
            resizer.remove();
            
            updateUI();
            saveState();
        }

        // ============================================
        // ОБНОВЛЕНИЕ UI
        // ============================================

        function updateUI() {
            updateDots();
            setupResizers();
        }

        function updateDots() {
            const panels = document.querySelectorAll('.panel');
            dotsContainer.innerHTML = '';
            
            if (panels.length <= 1) {
                dotsContainer.style.display = 'none';
                return;
            }
            
            dotsContainer.style.display = 'flex';
            
            panels.forEach((panel, index) => {
                const isActive = index === 0;
                const dot = createDot(index, isActive);
                dotsContainer.appendChild(dot);
            });
            
            // Наблюдатель за скроллом
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const panels = document.querySelectorAll('.panel');
                    const index = Array.from(panels).indexOf(entry.target);
                    if (index === -1) return;
                    
                    document.querySelectorAll('.dots button').forEach((dot, i) => {
                        dot.classList.toggle('active', i === index);
                    });
                });
            }, {
                root: panelsContainer,
                threshold: 0.6
            });
            
            panels.forEach(panel => observer.observe(panel));
        }

        function setupResizers() {
            const resizers = document.querySelectorAll('.resizer');
            
            resizers.forEach((resizer) => {
                // Клонируем для удаления старых обработчиков
                const newResizer = resizer.cloneNode(true);
                resizer.parentNode.replaceChild(newResizer, resizer);
                
                let active = false;
                let moved = false;
                let startX = 0;
                let startY = 0;
                let animationFrame = null;
                let pendingX = null;
                
                const panels = document.querySelectorAll('.panel');
                const allResizers = Array.from(document.querySelectorAll('.resizer'));
                const index = allResizers.indexOf(newResizer);
                
                if (index === -1 || !panels[index] || !panels[index + 1]) return;
                
                const prevPanel = panels[index];
                const nextPanel = panels[index + 1];
                
                function setPosition(clientX) {
                    const rect = newResizer.getBoundingClientRect();
                    let x = clientX - rect.left;
                    const handleSize = 24;
                    const halfHandle = handleSize / 2;
                    
                    x = Math.max(halfHandle, Math.min(rect.width - halfHandle, x));
                    
                    const percent = (x / rect.width) * 100;
                    const handle = newResizer.querySelector('.resizer-handle');
                    handle.style.left = `${percent}%`;
                    
                    const totalWidth = prevPanel.getBoundingClientRect().width + nextPanel.getBoundingClientRect().width;
                    const minWidth = 80;
                    let ratio = x / rect.width;
                    let newPrevWidth = totalWidth * ratio;
                    
                    newPrevWidth = Math.max(minWidth, Math.min(totalWidth - minWidth, newPrevWidth));
                    const newNextWidth = totalWidth - newPrevWidth;
                    
                    prevPanel.style.flex = '0 0 auto';
                    prevPanel.style.width = `${newPrevWidth}px`;
                    nextPanel.style.flex = '0 0 auto';
                    nextPanel.style.width = `${newNextWidth}px`;
                }
                
                function pointerDown(e) {
                    if (e.target.closest('.handle-menu')) return;
                    e.preventDefault();
                    active = true;
                    moved = false;
                    startX = e.clientX;
                    startY = e.clientY;
                    pendingX = e.clientX;
                    
                    newResizer.classList.add('active');
                    document.body.classList.add('is-resizing');
                    newResizer.setPointerCapture?.(e.pointerId);
                }
                
                function pointerMove(e) {
                    if (!active) return;
                    const deltaX = Math.abs(e.clientX - startX);
                    const deltaY = Math.abs(e.clientY - startY);
                    
                    if (deltaX > 6 || deltaY > 6) {
                        moved = true;
                        closeAllMenus();
                    }
                    
                    if (!moved) return;
                    pendingX = e.clientX;
                    
                    if (animationFrame !== null) return;
                    
                    animationFrame = requestAnimationFrame(() => {
                        animationFrame = null;
                        if (!active || pendingX === null) return;
                        setPosition(pendingX);
                    });
                }
                
                function pointerUp(e) {
                    if (!active) return;
                    active = false;
                    pendingX = null;
                    
                    if (animationFrame !== null) {
                        cancelAnimationFrame(animationFrame);
                        animationFrame = null;
                    }
                    
                    newResizer.classList.remove('active');
                    document.body.classList.remove('is-resizing');
                    
                    try {
                        newResizer.releasePointerCapture?.(e.pointerId);
                    } catch (_) {}
                    
                    if (!moved) {
                        const menu = newResizer.querySelector('.handle-menu');
                        const isOpen = menu.classList.contains('open');
                        closeAllMenus(isOpen ? null : menu);
                        menu.classList.toggle('open', !isOpen);
                    }
                }
                
                newResizer.addEventListener('pointerdown', pointerDown);
                newResizer.addEventListener('pointermove', pointerMove);
                newResizer.addEventListener('pointerup', pointerUp);
                newResizer.addEventListener('pointercancel', pointerUp);
                newResizer.addEventListener('lostpointercapture', pointerUp);
            });
        }

        function closeAllMenus(except = null) {
            document.querySelectorAll('.handle-menu').forEach(menu => {
                if (menu !== except) {
                    menu.classList.remove('open');
                }
            });
        }

        // ============================================
        // СОХРАНЕНИЕ И ВОССТАНОВЛЕНИЕ
        // ============================================

        function saveState() {
            const panels = document.querySelectorAll('.panel');
            const urls = [];
            panels.forEach(panel => {
                const iframe = panel.querySelector('iframe');
                if (iframe) {
                    urls.push(iframe.src);
                }
            });
            localStorage.setItem('panelsState', JSON.stringify(urls));
        }

        function restoreState() {
            const saved = localStorage.getItem('panelsState');
            if (!saved) return false;
            
            try {
                const urls = JSON.parse(saved);
                if (!urls || urls.length === 0) return false;
                
                panelsContainer.innerHTML = '';
                
                urls.forEach((url, index) => {
                    const panel = createPanel(url);
                    panelsContainer.appendChild(panel);
                    
                    if (index < urls.length - 1) {
                        const resizer = createResizer();
                        panelsContainer.appendChild(resizer);
                    }
                });
                
                updateUI();
                return true;
            } catch (e) {
                return false;
            }
        }

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================

        function initDefaultPanels() {
            const defaultPages = ['paramount.html', 'capital.html', 'flash.html', 'cross.html'];
            defaultPages.forEach((page, index) => {
                const panel = createPanel(page);
                panelsContainer.appendChild(panel);
                
                if (index < defaultPages.length - 1) {
                    const resizer = createResizer();
                    panelsContainer.appendChild(resizer);
                }
            });
            updateUI();
            saveState();
        }

        if (!restoreState()) {
            initDefaultPanels();
        }

        // ============================================
        // ОБРАБОТЧИКИ КНОПОК
        // ============================================

        if (addBtn) {
            addBtn.addEventListener('click', () => {
                const url = prompt('Enter URL for new panel:', 'index.html');
                if (!url) return;
                
                const newPanel = createPanel(url);
                panelsContainer.appendChild(newPanel);
                
                const newResizer = createResizer();
                panelsContainer.insertBefore(newResizer, newPanel);
                
                updateUI();
                saveState();
                
                setTimeout(() => {
                    newPanel.scrollIntoView({
                        behavior: 'smooth',
                        block: 'nearest',
                        inline: 'start'
                    });
                }, 100);
            });
        }

        if (removeBtn) {
            removeBtn.addEventListener('click', () => {
                const panels = document.querySelectorAll('.panel');
                if (panels.length <= 1) return;
                
                const lastPanel = panels[panels.length - 1];
                lastPanel.remove();
                
                const resizers = document.querySelectorAll('.resizer');
                if (resizers.length > 0) {
                    resizers[resizers.length - 1].remove();
                }
                
                updateUI();
                saveState();
            });
        }

        // ============================================
        // ОБРАБОТКА СООБЩЕНИЙ
        // ============================================

        window.addEventListener('message', function(event) {
            if (!event.data) return;

            if (event.data.type === 'TOGGLE_FULLSCREEN') {
                const iframes = document.querySelectorAll('iframe');
                iframes.forEach(iframe => {
                    if (iframe.contentWindow === event.source) {
                        const panel = iframe.closest('.panel');
                        if (panel) {
                            if (!document.fullscreenElement) {
                                panel.requestFullscreen().catch(() => {});
                            } else {
                                document.exitFullscreen();
                            }
                        }
                    }
                });
            }

            if (event.data.type === 'URL_CHANGED') {
                const iframes = document.querySelectorAll('iframe');
                iframes.forEach(iframe => {
                    try {
                        if (iframe.contentWindow === event.source) {
                            iframe.src = event.data.url;
                            saveState();
                        }
                    } catch (e) {}
                });
            }
        });

        // ============================================
        // ЗАКРЫТИЕ МЕНЮ
        // ============================================

        document.addEventListener('pointerdown', e => {
            if (!e.target.closest('.resizer')) {
                closeAllMenus();
            }
        });

        console.log('✅ Fields initialized');
        console.log(`📊 ${document.querySelectorAll('.panel').length} panels loaded`);
    </script>
</body>
</html>
