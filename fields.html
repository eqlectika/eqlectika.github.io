<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Research</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#workspace {
    width: 100%;
    height: 100%;
    display: grid;
    overflow: hidden;
}

/* =========================
   MOBILE — SWIPE
========================= */

@media (max-width: 767px) {

    #workspace {
        display: block;
        overflow: hidden;
    }

    #mobile-track {
        display: flex;
        width: 500%;
        height: 100%;
        transform: translateX(0);
        transition: transform .28s ease;
        will-change: transform;
    }

    .app-window {
        width: 20%;
        height: 100%;
        flex: 0 0 20%;
        overflow: hidden;
        position: relative;
    }

    .app-window iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
    }

    .resize-handle {
        display: none;
    }
}


/* =========================
   TABLET / NORMAL SCREEN
   3 COLUMNS
========================= */

@media (min-width: 768px) and (max-width: 1399px) {

    #workspace {
        display: grid;
        grid-template-columns:
            minmax(0, 1fr)
            6px
            minmax(0, 1fr)
            6px
            minmax(0, 1fr);

        grid-template-rows:
            1fr 1fr;
    }

    .app-window {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        position: relative;
    }

    .app-window iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
    }

    .app-1 {
        grid-column: 1;
        grid-row: 1;
    }

    .app-2 {
        grid-column: 3;
        grid-row: 1;
    }

    .app-3 {
        grid-column: 5;
        grid-row: 1;
    }

    .app-4 {
        grid-column: 1 / 4;
        grid-row: 2;
    }

    .app-5 {
        grid-column: 4 / 6;
        grid-row: 2;
    }

    .resize-handle {
        display: none;
    }
}


/* =========================
   WIDE SCREEN
   5 ADJUSTABLE COLUMNS
========================= */

@media (min-width: 1400px) {

    #workspace {
        display: flex;
        width: 100%;
        height: 100%;
    }

    .app-window {
        flex: 1 1 0;
        min-width: 120px;
        height: 100%;
        overflow: hidden;
        position: relative;
    }

    .app-window iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
        pointer-events: auto;
    }

    .resize-handle {
        flex: 0 0 6px;
        width: 6px;
        height: 100%;
        cursor: col-resize;
        background: rgba(255,255,255,.08);
        position: relative;
        z-index: 10;
    }

    .resize-handle:hover,
    .resize-handle.active {
        background: rgba(255,255,255,.35);
    }
}
</style>
</head>

<body>

<div id="workspace">

    <div id="mobile-track">

        <!-- 1 -->
        <div class="app-window app-1">
            <iframe
                src="index.html"
                title="Index">
            </iframe>
        </div>

        <div class="resize-handle"></div>

        <!-- 2 -->
        <div class="app-window app-2">
            <iframe
                src="onemore"
                title="OneMore">
            </iframe>
        </div>

        <div class="resize-handle"></div>

        <!-- 3 -->
        <div class="app-window app-3">
            <iframe
                src="flash"
                title="Flash">
            </iframe>
        </div>

        <div class="resize-handle"></div>

        <!-- 4 -->
        <div class="app-window app-4">
            <iframe
                src="capital"
                title="Capital">
            </iframe>
        </div>

        <div class="resize-handle"></div>

        <!-- 5 -->
        <div class="app-window app-5">
            <iframe
                src="cross"
                title="Cross">
            </iframe>
        </div>

    </div>

</div>


<script>
/* =====================================================
   MOBILE SWIPE
===================================================== */

let currentApp = 0;
let startX = 0;
let currentX = 0;
let dragging = false;

const track = document.getElementById("mobile-track");

function isMobile() {
    return window.innerWidth < 768;
}

function updateMobilePosition(animated = true) {

    if (!isMobile()) return;

    track.style.transition =
        animated
            ? "transform .28s ease"
            : "none";

    track.style.transform =
        `translateX(-${currentApp * 20}%)`;
}


document.addEventListener("pointerdown", function(e) {

    if (!isMobile()) return;

    startX = e.clientX;
    currentX = startX;
    dragging = true;

    track.style.transition = "none";

}, { passive: true });


document.addEventListener("pointermove", function(e) {

    if (!dragging || !isMobile()) return;

    currentX = e.clientX;

}, { passive: true });


document.addEventListener("pointerup", function(e) {

    if (!dragging || !isMobile()) return;

    dragging = false;

    const difference = currentX - startX;
    const threshold = window.innerWidth * 0.12;

    if (difference < -threshold && currentApp < 4) {

        currentApp++;

    } else if (difference > threshold && currentApp > 0) {

        currentApp--;
    }

    updateMobilePosition(true);

});


document.addEventListener("pointercancel", function() {

    if (!dragging) return;

    dragging = false;

    updateMobilePosition(true);

});


window.addEventListener("resize", function() {

    if (isMobile()) {

        updateMobilePosition(false);

    } else {

        track.style.transform = "";
        track.style.transition = "";
    }

});


/* =====================================================
   DESKTOP RESIZABLE COLUMNS
===================================================== */

if (window.matchMedia("(min-width: 1400px)").matches) {

    setupResizeHandles();
}


window.matchMedia("(min-width: 1400px)")
    .addEventListener("change", function(e) {

        if (e.matches) {

            setupResizeHandles();
        }
    });


let resizeInitialized = false;

function setupResizeHandles() {

    if (resizeInitialized) return;

    resizeInitialized = true;

    const workspace =
        document.getElementById("workspace");

    const handles =
        document.querySelectorAll(".resize-handle");

    let leftWindow = null;
    let rightWindow = null;

    let startPointerX = 0;
    let startLeftWidth = 0;
    let startRightWidth = 0;


    handles.forEach(handle => {

        handle.addEventListener(
            "pointerdown",
            function(e) {

                if (window.innerWidth < 1400) return;

                const previous =
                    handle.previousElementSibling;

                const next =
                    handle.nextElementSibling;

                if (
                    !previous ||
                    !next ||
                    !previous.classList.contains("app-window") ||
                    !next.classList.contains("app-window")
                ) {
                    return;
                }

                leftWindow = previous;
                rightWindow = next;

                startPointerX = e.clientX;

                startLeftWidth =
                    leftWindow.getBoundingClientRect().width;

                startRightWidth =
                    rightWindow.getBoundingClientRect().width;

                handle.classList.add("active");

                handle.setPointerCapture(e.pointerId);

                e.preventDefault();

            }
        );


        handle.addEventListener(
            "pointermove",
            function(e) {

                if (
                    !leftWindow ||
                    !rightWindow
                ) return;

                const delta =
                    e.clientX - startPointerX;

                const newLeftWidth =
                    startLeftWidth + delta;

                const newRightWidth =
                    startRightWidth - delta;

                const minWidth = 120;

                if (
                    newLeftWidth < minWidth ||
                    newRightWidth < minWidth
                ) {
                    return;
                }

                leftWindow.style.flex =
                    `0 0 ${newLeftWidth}px`;

                rightWindow.style.flex =
                    `0 0 ${newRightWidth}px`;

            }
        );


        function stopResize() {

            handle.classList.remove("active");

            leftWindow = null;
            rightWindow = null;
        }


        handle.addEventListener(
            "pointerup",
            stopResize
        );


        handle.addEventListener(
            "pointercancel",
            stopResize
        );

    });

}
</script>

</body>
</html>
