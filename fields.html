<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="manifest-fields.json" />
    <title>Fields</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
        }

        /* Контейнер */
        .panels {
            display: flex;
            width: 100vw;
            height: 100vh;
            background: #1e1e1e;
        }

        /* Каждая панель */
        .panel {
            flex: 1;
            min-width: 50px;
            background: white;
            position: relative;
            overflow: hidden;
        }

        .panel iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Разделитель */
        .resizer {
            width: 6px;
            background: #1e1e1e;
            cursor: col-resize;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .resizer:hover {
            background: #3b82f6;
        }

        /* === МОБИЛЬНАЯ ВЕРСИЯ: одно окно === */
        @media (max-width: 768px) {
            .panels {
                flex-direction: row;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                -webkit-overflow-scrolling: touch;
            }

            .panel {
                flex: 0 0 100vw;
                min-width: 100vw;
                height: 100vh;
                scroll-snap-align: start;
                background: white;
            }

            .resizer {
                display: none;
            }

            /* Индикатор страниц */
            .dots {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 8px;
                z-index: 100;
                background: rgba(0, 0, 0, 0.6);
                padding: 8px 14px;
                border-radius: 30px;
                backdrop-filter: blur(8px);
            }

            .dots button {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                border: none;
                background: rgba(255, 255, 255, 0.3);
                cursor: pointer;
                padding: 0;
                transition: 0.2s;
                flex-shrink: 0;
            }

            .dots button.active {
                background: white;
                transform: scale(1.3);
            }

            .dots button:hover {
                background: rgba(255, 255, 255, 0.6);
            }
        }

        /* Десктоп: скрываем точки */
        .dots {
            display: none;
        }

        @media (min-width: 769px) {
            .dots {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="panels" id="panels">
        <!-- Панели создаются скриптом -->
    </div>

    <!-- Индикатор для мобильных -->
    <div class="dots" id="dots"></div>

    <script>
        // === РЕГИСТРАЦИЯ SERVICE WORKER ===
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('✅ Service Worker зарегистрирован:', registration);
                })
                .catch(error => {
                    console.log('❌ Ошибка регистрации SW:', error);
                });
        }

        const pages = [
            'match.html',
            'index.html',
            'capital.html',
            'flash.html',
            'cross.html'
        ];

        const panelsContainer = document.getElementById('panels');
        const dotsContainer = document.getElementById('dots');

        // Создаём панели
        pages.forEach((page) => {
            const panel = document.createElement('div');
            panel.className = 'panel';

            const iframe = document.createElement('iframe');
            iframe.src = page;
            iframe.loading = 'lazy';
            panel.appendChild(iframe);

            panelsContainer.appendChild(panel);
        });

        // === Десктоп: разделители ===
        const panels = document.querySelectorAll('.panel');
        const isMobile = window.innerWidth <= 768;

        if (!isMobile) {
            panels.forEach((panel, index) => {
                if (index < panels.length - 1) {
                    const resizer = document.createElement('div');
                    resizer.className = 'resizer';
                    panelsContainer.insertBefore(resizer, panel.nextSibling);
                }
            });

            // Логика ресайза
            const resizers = document.querySelectorAll('.resizer');
            resizers.forEach((resizer) => {
                let isResizing = false;
                let startX = 0;
                let prevPanel = null;
                let nextPanel = null;

                resizer.addEventListener('mousedown', (e) => {
                    startResize(e.clientX);
                });

                function startResize(clientX) {
                    const parent = resizer.parentElement;
                    const children = parent.querySelectorAll('.panel');
                    const index = Array.from(parent.children).indexOf(resizer);

                    prevPanel = children[index];
                    nextPanel = children[index + 1];

                    if (!prevPanel || !nextPanel) return;

                    isResizing = true;
                    startX = clientX;

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);

                    document.body.style.userSelect = 'none';
                    document.body.style.cursor = 'col-resize';
                }

                function onMouseMove(e) {
                    if (!isResizing) return;
                    const rect = panelsContainer.getBoundingClientRect();
                    const pos = e.clientX - rect.left;

                    const prevRect = prevPanel.getBoundingClientRect();
                    const nextRect = nextPanel.getBoundingClientRect();

                    const prevStart = prevRect.left - rect.left;
                    const totalSize = prevRect.width + nextRect.width;

                    const minSize = 80;
                    let newPrevSize = Math.max(minSize, Math.min(totalSize - minSize, pos - prevStart));

                    const prevFlex = newPrevSize / totalSize;
                    const nextFlex = 1 - prevFlex;

                    prevPanel.style.flex = prevFlex;
                    nextPanel.style.flex = nextFlex;
                }

                function onMouseUp() {
                    isResizing = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                }
            });
        }

        // === Мобильные: точки-индикаторы ===
        if (isMobile) {
            const dotsContainer = document.getElementById('dots');
            dotsContainer.style.display = 'flex';

            pages.forEach((_, index) => {
                const dot = document.createElement('button');
                dot.dataset.index = index;
                if (index === 0) dot.classList.add('active');

                dot.addEventListener('click', () => {
                    const panel = panels[index];
                    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
                });

                dotsContainer.appendChild(dot);
            });

            // Подсветка активной точки при скролле
            let scrollTimeout;
            panelsContainer.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const scrollLeft = panelsContainer.scrollLeft;
                    const panelWidth = panelsContainer.clientWidth;
                    const currentIndex = Math.round(scrollLeft / panelWidth);

                    document.querySelectorAll('.dots button').forEach((dot, i) => {
                        dot.classList.toggle('active', i === currentIndex);
                    });
                }, 100);
            });
        }
    </script>
</body>
</html>
