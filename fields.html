<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Адаптивные поля</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px 24px;
            max-width: 1400px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #1e293b;
            margin-bottom: 24px;
            text-align: center;
        }

        /* Сетка по умолчанию: 1 колонка (смартфон) */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        /* Поле ввода с изменяемой шириной */
        .field-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            border-radius: 12px;
            padding: 4px 12px 4px 16px;
            border: 1px solid #e2e8f0;
            transition: border-color 0.2s;
        }

        .field-wrapper:focus-within {
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .field-wrapper label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #475569;
            white-space: nowrap;
            min-width: 20px;
        }

        .field-wrapper input {
            flex: 1;
            min-width: 0;
            padding: 14px 0;
            border: none;
            background: transparent;
            font-size: 1rem;
            outline: none;
            color: #0f172a;
            width: 100%;
        }

        .field-wrapper input::placeholder {
            color: #94a3b8;
        }

        /* Ручка изменения ширины */
        .resize-handle {
            width: 16px;
            height: 100%;
            min-height: 44px;
            cursor: col-resize;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            user-select: none;
            flex-shrink: 0;
            padding: 4px 0;
        }

        .resize-handle::before {
            content: "⋮";
            font-size: 1.2rem;
            line-height: 1;
            letter-spacing: -2px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .field-wrapper:hover .resize-handle::before {
            opacity: 1;
        }

        /* Планшет / маленький ноутбук — 3 колонки */
        @media (min-width: 600px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Широкий экран — 5 колонок */
        @media (min-width: 1024px) {
            .grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        /* Демо-информация */
        .info {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.8rem;
            color: #64748b;
        }

        .info span {
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .info .hint {
            background: transparent;
            padding: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>↕️ Поля с изменяемой шириной</h2>

    <div class="grid" id="grid">
        <!-- Поля будут добавлены через JS -->
    </div>

    <div class="info">
        <span>📱 1 колонка</span>
        <span>💻 3 колонки</span>
        <span>🖥️ 5 колонок</span>
        <span class="hint">🖱️ Тяните ⋮ вправо/влево</span>
    </div>
</div>

<script>
    (function() {
        const grid = document.getElementById('grid');
        const totalFields = 10; // достаточно для заполнения всех рядов

        // Создаём поля
        for (let i = 1; i <= totalFields; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'field-wrapper';

            const label = document.createElement('label');
            label.textContent = i;
            label.htmlFor = `field-${i}`;

            const input = document.createElement('input');
            input.type = 'text';
            input.id = `field-${i}`;
            input.placeholder = `Поле ${i}`;

            const handle = document.createElement('div');
            handle.className = 'resize-handle';
            handle.setAttribute('role', 'separator');
            handle.setAttribute('aria-label', 'Изменить ширину');

            wrapper.appendChild(label);
            wrapper.appendChild(input);
            wrapper.appendChild(handle);
            grid.appendChild(wrapper);

            // === Логика ресайза ===
            let isResizing = false;
            let startX = 0;
            let startWidth = 0;
            let nextWrapper = null;

            function getNextWrapper(el) {
                const sibling = el.nextElementSibling;
                if (sibling && sibling.classList.contains('field-wrapper')) {
                    return sibling;
                }
                return null;
            }

            function onMouseDown(e) {
                const wrapper = this.parentElement;
                const next = getNextWrapper(wrapper);
                if (!next) return; // нельзя ресайзить последний

                isResizing = true;
                startX = e.clientX;
                startWidth = wrapper.getBoundingClientRect().width;
                nextWrapper = next;

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);

                e.preventDefault();
                // Стили для визуальной обратной связи
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            }

            function onMouseMove(e) {
                if (!isResizing || !nextWrapper) return;

                const delta = e.clientX - startX;
                const containerWidth = grid.getBoundingClientRect().width;
                const gap = 16; // из CSS
                const colCount = getComputedStyle(grid).gridTemplateColumns.split(' ').length;

                // Получаем все поля в текущем ряду
                const wrappers = [...grid.querySelectorAll('.field-wrapper')];
                const idx = wrappers.indexOf(this.parentElement);
                if (idx === -1) return;

                // Определяем границы ряда (по колонкам)
                const rowStart = Math.floor(idx / colCount) * colCount;
                const rowEnd = Math.min(rowStart + colCount, wrappers.length);
                const rowWrappers = wrappers.slice(rowStart, rowEnd);

                // Ресайзим только если есть следующий в том же ряду
                const nextIdx = idx + 1;
                if (nextIdx >= rowEnd) return;

                const currentWrapper = wrappers[idx];
                const nextWrapperEl = wrappers[nextIdx];

                const currentRect = currentWrapper.getBoundingClientRect();
                const nextRect = nextWrapperEl.getBoundingClientRect();

                // Минимальная ширина — 60px
                const minWidth = 60;
                const maxNextWidth = nextRect.width - 20; // нельзя сжать соседа в 0

                let newWidth = Math.max(minWidth, currentRect.width + delta);
                // Ограничиваем, чтобы сосед не стал меньше minWidth
                const nextNewWidth = nextRect.width - (newWidth - currentRect.width);
                if (nextNewWidth < minWidth) {
                    newWidth = currentRect.width + (nextRect.width - minWidth);
                }

                // Применяем ширину явно через flex или grid — проще через style.flex
                // Используем flex-basis для гибкости
                const totalRowWidth = rowWrappers.reduce((sum, w) => sum + w.getBoundingClientRect().width, 0);
                const gapTotal = (rowWrappers.length - 1) * gap;
                const available = containerWidth - gapTotal;

                // Устанавливаем flex-значения пропорционально
                const currentFlex = newWidth / available;
                const nextFlex = (nextRect.width - (newWidth - currentRect.width)) / available;

                currentWrapper.style.flex = `${currentFlex} 1 0`;
                nextWrapperEl.style.flex = `${nextFlex} 1 0`;

                // Для корректной работы в grid используем min-width
                currentWrapper.style.minWidth = newWidth + 'px';
                nextWrapperEl.style.minWidth = Math.max(minWidth, nextRect.width - (newWidth - currentRect.width)) + 'px';
            }

            function onMouseUp() {
                isResizing = false;
                nextWrapper = null;
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }

            // Вешаем событие на ручку
            handle.addEventListener('mousedown', onMouseDown);

            // Touch support для мобильных
            handle.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                const wrapper = handle.parentElement;
                const next = getNextWrapper(wrapper);
                if (!next) return;

                isResizing = true;
                startX = touch.clientX;
                startWidth = wrapper.getBoundingClientRect().width;
                nextWrapper = next;

                document.addEventListener('touchmove', onTouchMove);
                document.addEventListener('touchend', onTouchEnd);

                e.preventDefault();
            });

            function onTouchMove(e) {
                if (!isResizing || !nextWrapper) return;
                const touch = e.touches[0];
                const delta = touch.clientX - startX;
                // Аналогичная логика (упрощённо)
                const wrappers = [...grid.querySelectorAll('.field-wrapper')];
                const idx = wrappers.indexOf(handle.parentElement);
                if (idx === -1) return;

                const colCount = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
                const rowStart = Math.floor(idx / colCount) * colCount;
                const rowEnd = Math.min(rowStart + colCount, wrappers.length);
                if (idx + 1 >= rowEnd) return;

                const currentWrapper = wrappers[idx];
                const nextWrapperEl = wrappers[idx + 1];
                const currentRect = currentWrapper.getBoundingClientRect();
                const nextRect = nextWrapperEl.getBoundingClientRect();

                const minWidth = 60;
                let newWidth = Math.max(minWidth, currentRect.width + delta);
                const nextNewWidth = nextRect.width - (newWidth - currentRect.width);
                if (nextNewWidth < minWidth) {
                    newWidth = currentRect.width + (nextRect.width - minWidth);
                }

                const containerWidth = grid.getBoundingClientRect().width;
                const gap = 16;
                const rowWrappers = wrappers.slice(rowStart, rowEnd);
                const totalRowWidth = rowWrappers.reduce((sum, w) => sum + w.getBoundingClientRect().width, 0);
                const gapTotal = (rowWrappers.length - 1) * gap;
                const available = containerWidth - gapTotal;

                currentWrapper.style.flex = `${newWidth / available} 1 0`;
                nextWrapperEl.style.flex = `${(nextRect.width - (newWidth - currentRect.width)) / available} 1 0`;
                currentWrapper.style.minWidth = newWidth + 'px';
                nextWrapperEl.style.minWidth = Math.max(minWidth, nextRect.width - (newWidth - currentRect.width)) + 'px';
            }

            function onTouchEnd() {
                isResizing = false;
                nextWrapper = null;
                document.removeEventListener('touchmove', onTouchMove);
                document.removeEventListener('touchend', onTouchEnd);
            }
        }

        // Небольшой фикс: при загрузке убираем избыточные flex, чтобы grid управлял
        // Но для ресайза нам нужны flex-свойства, оставляем как есть
        // Добавим начальные min-width для всех
        document.querySelectorAll('.field-wrapper').forEach(w => {
            w.style.minWidth = '60px';
        });
    })();
</script>
</body>
</html>
