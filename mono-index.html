<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ranking | Local Edition</title>
<link rel="manifest" href="manifest-ranking.json">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
body { background-color: #000; color: #fff; font-family: monospace; margin: 0; padding: 10px; box-sizing: border-box; }
#versus { width: 100%; margin: 2em 0; }
.versus-wrapper { display: flex; gap: 10px; justify-content: center; }
.versus_column { flex: 1; min-width: 0; cursor: pointer; }

.versus_thumbwrapper { 
    position: relative; 
    border: 3px solid #444; 
    background-color: #333; 
    aspect-ratio: 1/1; 
    box-sizing: border-box;
}
.versus_thumbwrapper img { 
    position: absolute;
    top: 0; left: 0;
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
}

.ranking-container { margin-top: 10px;}
.ranking-title { font-family: monospace; font-size: 24px; text-transform: uppercase; text-align: center; border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 20px; }
.ranking-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #222; cursor: pointer; }
.ranking-img { width: 40px; height: 40px; object-fit: cover; margin-right: 12px; border: 1px solid #444; background: #222; }
.ranking-info { flex-grow: 1; display: flex; justify-content: space-between; align-items: center; }
.item-details { display: none; padding: 15px; background: #050505; border-bottom: 1px solid #222; font-size: 14px; color: #ccc; }
.external-link { 
color: #448aff; 
text-decoration: none; 
display: block; 
margin-top: 10px; 
font-weight: bold; }
.admin-panel { 
margin-bottom: 40px; 
padding: 20px; 

font-family: monospace;

background: #333; font-family: monospace; }
.admin-input { 
    width: 100%; 
    padding: 12px; 

    font-family: monospace;

    margin-bottom: 15px; 
    background: #000; 
    border: 1px solid #777; 
    font-size: 16px;
    color: #fff; 
    box-sizing: border-box; 
}

.edit-btn {
    background: #448aff;
    color: white;
    border: none;
    padding: 10px 15px;
    margin-top: 30px;
    margin-right: 10px;
    text-transform: uppercase; 
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
}
.edit-btn:hover { background: #2979ff; }

.delete-btn {
    background: #ff4444;
    color: white;
    border: none;
    padding: 10px 15px;
    margin-top: 30px;
    cursor: pointer;
    text-transform: uppercase; 
    font-size: 12px;
    font-weight: bold;
}
.delete-btn:hover { background: #cc0000; }

textarea.admin-input {
    font-family: monospace;
    height: 150px;
    resize: vertical;
}
#new-img-file { 
display: none; 
font-family: monospace;
}
.file-label {
    font-family: monospace;
    display: inline-block;
    padding: 12px;
    background: #000;
    color: #fff;
    text-align: left;
    box-sizing: border-box;
    cursor: pointer;
    margin-bottom: 30px;
    border: 2px solid #fff;
}
.admin-btn { 
    width: 100%; 
    padding: 22px; 
    background: #fff; 
    font-family: monospace;
    color: #000; 
    border: none; 
    font-weight: bold; 
    cursor: pointer; 
    text-transform: uppercase; 
    font-size: 18px;
}
#header-link {
    z-index: 1000;
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
#header-logo {
    margin-bottom: 40px;
    max-height: 48px;
    display: block;
}
/* Стили для хедера из index.html */
.main-header {
    text-align: left;
    padding: 20px 0 10px 0;
}
.main-header h1 {
    font-family: monospace;
    font-size: 18px;
    margin: 0;
    letter-spacing: 2px;
}
.main-header p {
    color: #888;
    font-size: 14px;
    margin-top: 5px;
}
</style>
</head>
<body>

<header class="main-header">
    <h1>Made in Space</h1>
    <p>Architecture & Navigation</p>
</header>

<div id="versus">
    <div class="ranking-title">Pick Important</div>
    <div class="versus-wrapper">
        <div class="versus_column" id="item-left" onclick="vote('left')">
            <div class="versus_thumbwrapper"><img src="" alt=""></div>
            <h3 class="title" style="text-align:center"></h3>
        </div>
        <div class="versus_column" id="item-right" onclick="vote('right')">
            <div class="versus_thumbwrapper"><img src="" alt=""></div>
            <h3 class="title" style="text-align:center"></h3>
        </div>
    </div>
</div>
<div class="ranking-container">
    <div class="ranking-title">Local Ranking</div>
    <div id="ranking-list"></div>
</div>
<div class="admin-panel">
    <input type="text" id="new-title" class="admin-input" placeholder="Title">
    <textarea id="new-desc" class="admin-input" placeholder="Description"></textarea>
    <input type="url" id="new-url" class="admin-input" placeholder="External URL (optional)">
    <label for="new-img-file" class="file-label" id="file-label-text">Choose image file</label>
    <input type="file" id="new-img-file" accept="image/*" onchange="updateLabel(this)">
    <button class="admin-btn" onclick="saveOrAddItem()">Add Item</button>
</div>
<a href="index.html" id="header-link">
    <img src="logo.png" alt="Logo" id="header-logo">
</a>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.error('SW_REG_FAIL', err));
  });
}

const defaultItems = [
    { id: 1, title: "Clarity", description: "Plain sketch", externalUrl: "clarity.html", img: "", rating: 1500 },
    { id: 2, title: "Market", description: "Plain sketch", externalUrl: "market.html", img: "", rating: 1500 },
    { id: 3, title: "Paramount", description: "Plain sketch", externalUrl: "paramount.html", img: "", rating: 1500 },
    { id: 4, title: "Flash", description: "Plain sketch", externalUrl: "flash.html", img: "", rating: 1500 },
    { id: 5, title: "Spark", description: "Plain sketch", externalUrl: "spark.html", img: "", rating: 1500 },
    { id: 6, title: "Cross", description: "Plain sketch", externalUrl: "cross.html", img: "", rating: 1500 },
    { id: 7, title: "Blueprint", description: "Plain sketch", externalUrl: "blueprint.html", img: "", rating: 1500 },
    { id: 8, title: "Code", description: "Plain sketch", externalUrl: "code.html", img: "", rating: 1500 },
    { id: 9, title: "Lexis", description: "Plain sketch", externalUrl: "lexis.html", img: "", rating: 1500 },
    { id: 10, title: "Matrix", description: "Plain sketch", externalUrl: "matrix.html", img: "", rating: 1500 },
    { id: 11, title: "Breakthrough", description: "Plain sketch", externalUrl: "breakthrough.html", img: "", rating: 1500 },
    { id: 12, title: "Square", description: "Plain sketch", externalUrl: "square.html", img: "", rating: 1500 },
    { id: 13, title: "Size", description: "Plain sketch", externalUrl: "size.html", img: "", rating: 1500 },
    { id: 14, title: "Beta", description: "Plain sketch", externalUrl: "beta.html", img: "", rating: 1500 },
    { id: 15, title: "Demo", description: "Plain sketch", externalUrl: "demo.html", img: "", rating: 1500 },
    { id: 16, title: "Database", description: "Plain sketch", externalUrl: "database.html", img: "", rating: 1500 },
    { id: 17, title: "Book", description: "Plain sketch", externalUrl: "book.html", img: "", rating: 1500 },
    { id: 18, title: "Gossip", description: "Plain sketch", externalUrl: "gossip.html", img: "", rating: 1500 },
    { id: 19, title: "Clock", description: "Plain sketch", externalUrl: "clock.html", img: "", rating: 1500 },
    { id: 20, title: "Planet", description: "Space sketch", externalUrl: "planet.html", img: "", rating: 1500 },
    { id: 21, title: "Life", description: "Space sketch", externalUrl: "life.html", img: "", rating: 1500 },
    { id: 22, title: "Water", description: "Space sketch", externalUrl: "water.html", img: "", rating: 1500 },
    { id: 23, title: "Jetpack", description: "Space sketch", externalUrl: "jetpack.html", img: "", rating: 1500 },
    { id: 24, title: "Loop", description: "Space sketch", externalUrl: "loop.html", img: "", rating: 1500 },
    { id: 25, title: "Pentax", description: "Space sketch", externalUrl: "pentax.html", img: "", rating: 1500 },
    { id: 26, title: "Sublime", description: "Space sketch", externalUrl: "sublime.html", img: "", rating: 1500 },
    { id: 27, title: "Oculus", description: "Space sketch", externalUrl: "oculus.html", img: "", rating: 1500 },
    { id: 28, title: "Record", description: "Space sketch", externalUrl: "record.html", img: "", rating: 1500 },
    { id: 29, title: "Hybrid", description: "Space sketch", externalUrl: "hybrid.html", img: "", rating: 1500 },
    { id: 30, title: "Bismuth", description: "Space sketch", externalUrl: "bismuth.html", img: "", rating: 1500 },
    { id: 31, title: "Syntax", description: "Space sketch", externalUrl: "syntax.html", img: "", rating: 1500 },
    { id: 32, title: "Cube", description: "Space sketch", externalUrl: "cube.html", img: "", rating: 1500 },
    { id: 33, title: "Peer", description: "Space sketch", externalUrl: "peer.html", img: "", rating: 1500 },
    { id: 34, title: "Drop", description: "Space sketch", externalUrl: "drop.html", img: "", rating: 1500 },
    { id: 35, title: "Etymon", description: "Space sketch", externalUrl: "etymon.html", img: "", rating: 1500 },
    { id: 36, title: "Pearl", description: "Space sketch", externalUrl: "pearl.html", img: "", rating: 1500 },
    { id: 37, title: "Watch", description: "Space sketch", externalUrl: "watch.html", img: "", rating: 1500 },
    { id: 38, title: "Concept", description: "Concept page", externalUrl: "concept.html", img: "", rating: 1500 },
    { id: 39, title: "GitHub", description: "GitHub repository", externalUrl: "https://github.com/eqlectika", img: "", rating: 1500 },
    { id: 40, title: "Resume", description: "Resume page", externalUrl: "resume.html", img: "", rating: 1500 },
    { id: 41, title: "Wire", description: "Wire page", externalUrl: "wire.html", img: "", rating: 1500 },
    { id: 42, title: "Telegram", description: "Telegram contact", externalUrl: "https://t.me/eugenebox", img: "", rating: 1500 }
];

let items = defaultItems;
localStorage.setItem('versus_items', JSON.stringify(items));

let currentPair = [];
let editingId = null;

function editItem(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;

    $('#new-title').val(item.title);
    $('#new-desc').val(item.description);
    $('#new-url').val(item.externalUrl);
    $('#file-label-text').text("Keep current image or choose new");

    editingId = id;
    $('.admin-btn').text('Save Changes');
    $('.admin-panel')[0].scrollIntoView({ behavior: 'smooth' });
}

async function saveOrAddItem() {
    const title = $('#new-title').val().trim();
    const desc = $('#new-desc').val().trim();
    const url = $('#new-url').val().trim();
    const file = $('#new-img-file')[0].files[0];

    if (!title) return;

    let imgData = "";
    if (editingId !== null) {
        const item = items.find(i => i.id === editingId);
        if (item) {
            item.title = title;
            item.description = desc;
            item.externalUrl = url;
            if (file) {
                item.img = await compressImage(file);
            }
        }
        editingId = null;
        $('.admin-btn').text('Add Item');
    } else {
        if (file) {
            imgData = await compressImage(file);
        }
        items.push({ id: Date.now(), title, description: desc, externalUrl: url, img: imgData, rating: 1500 });
    }

    save();
    
    $('#new-title, #new-desc, #new-url, #new-img-file').val('');
    $('#file-label-text').text("Choose image file");
    
    if (items.length >= 2 && currentPair.length === 0) nextPair();
}

function updateLabel(input) {
    const fileName = input.files[0] ? input.files[0].name : "Choose image file";
    document.getElementById('file-label-text').innerText = fileName;
}

function save() {
    localStorage.setItem('versus_items', JSON.stringify(items));
    updateRankingList();
}

async function compressImage(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const maxWidth = 800;
                let width = img.width, height = img.height;
                if (width > maxWidth) { height = (maxWidth / width) * height; width = maxWidth; }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.8));
            };
        };
    });
}

function toggleDetails(id) { $(`#details-${id}`).slideToggle(200); }

function updateRankingList() {
    const sorted = [...items].sort((a, b) => b.rating - a.rating);
    let html = '';
    sorted.forEach((item, index) => {
        const imgTag = item.img ? `<img src="${item.img}" class="ranking-img">` : `<div class="ranking-img" style="display:inline-block;"></div>`;
        html += `<div class="ranking-item" onclick="toggleDetails('${item.id}')">
            ${imgTag}
            <div class="ranking-info"><span>${index + 1}. ${item.title}</span><strong>${Math.round(item.rating)}</strong></div>
        </div>
        <div id="details-${item.id}" class="item-details">
            <p>${item.description || 'No description.'}</p>
            ${item.externalUrl ? `<a href="${item.externalUrl}" target="_blank" class="external-link">Visit Link →</a>` : ''}
            <button class="edit-btn" onclick="event.stopPropagation(); editItem(${item.id})">Edit Item</button>
            <button class="delete-btn" onclick="event.stopPropagation(); deleteItem(${item.id})">Delete Item</button>
        </div>`;
    });
    $('#ranking-list').html(html);
}

function nextPair() {
    if (items.length < 2) return;
    let i1 = Math.floor(Math.random() * items.length), i2;
    do { i2 = Math.floor(Math.random() * items.length); } while (i1 === i2);
    currentPair = [i1, i2];
    
    if (items[i1].img) {
        $('#item-left img').attr('src', items[i1].img).show();
    } else {
        $('#item-left img').attr('src', '').hide();
    }
    $('#item-left .title').text(items[i1].title);

    if (items[i2].img) {
        $('#item-right img').attr('src', items[i2].img).show();
    } else {
        $('#item-right img').attr('src', '').hide();
    }
    $('#item-right .title').text(items[i2].title);
}

function vote(side) {
    if (items.length < 2) return;
    const winIdx = side === 'left' ? currentPair[0] : currentPair[1];
    const loseIdx = side === 'left' ? currentPair[1] : currentPair[0];
    const rW = items[winIdx].rating, rL = items[loseIdx].rating;
    const expW = 1 / (1 + Math.pow(10, (rL - rW) / 400));
    const change = 32 * (1 - expW);
    items[winIdx].rating += change; items[loseIdx].rating -= change;
    save();
    $('#versus').animate({ opacity: 0 }, 100, function() { nextPair(); $(this).animate({ opacity: 1 }, 100); });
}

function deleteItem(id) {
    if (confirm("Вы уверены, что хотите удалить этот элемент?")) {
        items = items.filter(item => item.id !== id);
        save();
        if (items.length < 2) {
            currentPair = [];
            $('#item-left img, #item-right img').attr('src', '');
            $('#item-left .title, #item-right .title').text('');
        } else {
            nextPair();
        }
    }
}

updateRankingList();
nextPair();
</script>
</body>
</html>
