<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest-cross.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<title>Cross Notes | Meme Editor</title>

<style>
/* ——— СКРОЛЛ-БАРЫ МИНИМИЗИРОВАНЫ ——— */
* {
  scrollbar-width: thin;          /* Firefox */
  scrollbar-color: transparent transparent; /* Firefox */
}
*::-webkit-scrollbar {
  width: 4px;                   /* Safari/Chrome */
  height: 4px;
  background: transparent;
}
*::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,0.15);
  border-radius: 8px;
}
*::-webkit-scrollbar-track {
  background: transparent;
}

body, html {
margin: 0;
padding: 0;
height: 100dvh;
width: 100vw;
overflow: hidden;
background: #000;
touch-action: none;
-webkit-tap-highlight-color: transparent;
}
.container {
display: grid;
grid-template-columns: var(--x, 50%) 1fr;
grid-template-rows: var(--y, 50%) 1fr;
height: 100%;
width: 100%;
}
.editor-wrapper {
position: relative;
width: 100%;
height: 100%;
overflow: hidden;
}

#t0 { 
  --default-bg: #ff8700; 
  --default-color: #000000; 
}
#t1 { --default-bg: #005f00; --default-color: #E1BEE7; }
#t2 { --default-bg: #870000; --default-color: #81C784; }
#t3 { --default-bg: #000080; --default-color: #FFD54F; }

.editor {
width: 100%;
height: 100%;
background: var(--bg, var(--default-bg));
color: var(--color, var(--default-color));
box-sizing: border-box;
padding: 15px;
font-size: 18px;
outline: none;
touch-action: auto;
-webkit-user-select: text;
user-select: text;
-webkit-touch-callout: default;
overflow-y: auto;
font-family: var(--fn, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif);
white-space: pre-wrap;
}

.editor:empty::before {
content: attr(data-placeholder);
pointer-events: none;
display: block;
white-space: pre-wrap;
}

.img-preview {
  position: absolute;
  max-width: 30%;
  max-height: 30%;
  border-radius: 4px;
  pointer-events: none;
  display: none;
  opacity: 0.7;
}

.handle {
position: absolute;
top: var(--y, 50%);
left: var(--x, 50%);
width: 32px;
height: 32px;
transform: translate(-50%, -50%) scale(1);
z-index: 100;
touch-action: none;
cursor: pointer;
-webkit-user-select: none;
user-select: none;
-webkit-touch-callout: none;
display: flex;
align-items: center;
justify-content: center;
transition: transform 0.1s ease, filter 0.3s ease;
}

.handle:active {
transform: translate(-50%, -50%) scale(0.85);
}

.handle img {
width: 100%;
height: 100%;
object-fit: contain;
pointer-events: none;
-webkit-user-drag: none;
transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* КРУПНЫЕ И ЭСТЕТИЧНЫЕ ЭЛЕМЕНТЫ МЕНЮ НАСТРОЕК */
#settings-modal select {
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  background-color: #333 !important;
  color: #fff !important;
  border: 1px solid #555 !important;
  padding: 12px 16px !important;
  font-size: 16px !important;
  border-radius: 8px !important;
  width: 100% !important;
  box-sizing: border-box !important;
  cursor: pointer;
}
#settings-modal select::-ms-expand {
  display: none;
}
</style>
</head>
<body>
<div class="container" id="app">
<div class="editor-wrapper"><div class="editor" id="t0" contenteditable="true" data-placeholder="1. Type or paste text and image here. &#10;2. Move Handle (crosshair) to resize Fields. &#10;3. Tap Handle to change design. &#10;4. Very long tap Field to format and delete image. &#10;5. Long tap Handle to level up."></div><img class="img-preview"></div>
<div class="editor-wrapper"><div class="editor" id="t1" contenteditable="true" data-placeholder="1. Type or paste text and image here. &#10;2. Move Handle (crosshair) to resize Fields. &#10;3. Tap Handle to change design. &#10;4. Very long tap Field to format and delete image. &#10;5. Long tap Handle to level up."></div><img class="img-preview"></div>
<div class="editor-wrapper"><div class="editor" id="t2" contenteditable="true" data-placeholder="1. Type or paste text and image here. &#10;2. Move Handle (crosshair) to resize Fields. &#10;3. Tap Handle to change design. &#10;4. Very long tap Field to format and delete image. &#10;5. Long tap Handle to level up."></div><img class="img-preview"></div>
<div class="editor-wrapper"><div class="editor" id="t3" contenteditable="true" data-placeholder="1. Type or paste text and image here. &#10;2. Move Handle (crosshair) to resize Fields. &#10;3. Tap Handle to change design. &#10;4. Very long tap Field to format and delete image. &#10;5. Long tap Handle to level up."></div><img class="img-preview"></div>
<a href="#" class="handle" id="handle" draggable="false"><img src="handle.png" alt="Logo" draggable="false"></a>
</div>

<!-- Мобильное меню настроек поля (увеличенные размеры) -->
<div id="settings-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center;">
  <div style="background:#222; color:#fff; padding:24px; border-radius:16px; width:85%; max-width:360px; font-family:sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,0.6);">
    <h3 style="margin-top:0; margin-bottom:20px; font-size:20px; text-align:center; font-weight:bold;">Field Settings</h3>
    
    <label style="display:block; font-size:15px; margin-bottom:6px; color:#ccc;">Font:</label>
    <select id="setting-font" style="margin-bottom:16px;">
      <option value='"Luckiest Guy", Arial, sans-serif'>Luckiest Guy</option>
      <option value='Copperplate, "Copperplate Gothic Bold", sans-serif'>Copperplate</option>
      <option value='"American Typewriter", Courier, monospace'>Typewriter</option>
      <option value='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'>System UI</option>
    </select>

    <label style="display:block; font-size:15px; margin-bottom:6px; color:#ccc;">Font Size:</label>
    <select id="setting-size" style="margin-bottom:16px;">
      <option value="14px">Small (14px)</option>
      <option value="18px">Normal (18px)</option>
      <option value="24px">Large (24px)</option>
      <option value="32px">Extra Large (32px)</option>
    </select>

    <div style="display:flex; gap:12px; margin-bottom:16px;">
      <div style="flex:1;">
        <label style="display:block; font-size:14px; margin-bottom:6px; color:#ccc;">Background:</label>
<input type="color" id="setting-bg" style="width:100%; height:50px; border:none; border-radius:6px; cursor:pointer; background:none;">      </div>
      <div style="flex:1;">
        <label style="display:block; font-size:14px; margin-bottom:6px; color:#ccc;">Text Color:</label>
<input type="color" id="setting-color" style="width:100%; height:50px; border:none; border-radius:6px; cursor:pointer; background:none;">      </div>
    </div>

    <label style="display:block; font-size:15px; margin-bottom:6px; color:#ccc;">Image Position:</label>
    <select id="setting-pos" style="margin-bottom:20px;">
      <option value="bottom right">Bottom Right</option>
      <option value="bottom left">Bottom Left</option>
      <option value="top right">Top Right</option>
      <option value="top left">Top Left</option>
    </select>

    <div id="image-action-container" style="margin-bottom:20px; display:none;">
      <label style="display:flex; align-items:center; font-size:16px; cursor:pointer; color:#ff758f; padding:4px 0;">
        <input type="checkbox" id="setting-del-img" style="width:20px; height:20px; margin-right:10px; accent-color:#ff758f; cursor:pointer;"> Delete image
      </label>
    </div>

    <div style="display:flex; gap:12px;">
      <button id="setting-cancel" style="flex:1; padding:12px; border:none; border-radius:8px; background:#444; color:#fff; font-size:16px; font-weight:bold; cursor:pointer;">Cancel</button>
      <button id="setting-save" style="flex:1; padding:12px; border:none; border-radius:8px; background:#ff8700; color:#000; font-size:16px; font-weight:bold; cursor:pointer;">Save</button>
    </div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
}
</script>

<script>
const container = document.getElementById('app');
const handle = document.getElementById('handle');
const textareas = document.querySelectorAll('.editor');
const images = document.querySelectorAll('.img-preview');

let isDragging = false;
let dragStartTime = 0;
let db;

const designs = ['handle.png', 'handle-black.png', 'logo.png', 'fleurdelis.png', 'break.png', 'paw.png', 'handle-cross-transparent.png' ];
let currentDesign = parseInt(localStorage.getItem('q_handle_design') || '0');

const fontsPool = [
  '"Luckiest Guy", Arial, sans-serif',
  'Copperplate, "Copperplate Gothic Bold", sans-serif',
  '"American Typewriter", Courier, monospace',
  '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
];

const defBgs = ['#ff8700', '#005f00', '#870000', '#000080']; 
const defColors = ['#000000', '#E1BEE7', '#81C784', '#FFD54F']; 

const magicPalettes = [
  { bg: defBgs, co: defColors },
  { bg: ['#2b2d42', '#8d99ae', '#edf2f4', '#ef233c'], co: ['#fff', '#000', '#000', '#fff'] },
  { bg: ['#1a5b8c', '#143d59', '#f4b41a', '#fbcbc9'], co: ['#fff', '#fff', '#000', '#000'] },
  { bg: ['#0f172a', '#1e293b', '#334155', '#475569'], co: ['#38bdf8', '#818cf8', '#fb7185', '#34d399'] },
  { bg: ['#111111', '#222222', '#333333', '#444444'], co: ['#eee', '#eee', '#eee', '#eee'] },
  { bg: ['#ffccd5', '#ffb3c1', '#ff8fa3', '#ff758f'], co: ['#590d22', '#590d22', '#fff', '#fff'] },
  { bg: ['#e2efe0', '#bccbaf', '#96a788', '#708264'], co: ['#283618', '#283618', '#fefae0', '#fefae0'] }
];

const dbRequest = indexedDB.open("QuadEditorDB", 3);
dbRequest.onupgradeneeded = e => {
  db = e.target.result;
  if(!db.objectStoreNames.contains("texts")) db.createObjectStore("texts", { keyPath: "id" });
};
dbRequest.onsuccess = e => { db = e.target.result; loadData(); };

async function saveToDB(id, content, img = null, clearImg = false) {
  return new Promise((resolve) => {
    const tx = db.transaction("texts", "readwrite");
    const store = tx.objectStore("texts");
    const req = store.get(id); 
    req.onsuccess = () => {
      const data = req.result || { id };
      data.content = content;
      if (clearImg) {
        delete data.img;
      } else if (img) { 
        data.img = img; 
      }
      store.put(data);
      tx.oncomplete = () => resolve();
    };
  });
}

function updateHandleImage(index) {
  const imgEl = handle.querySelector('img');
  imgEl.src = designs[index];
  if (index === 3) {
    imgEl.style.transform = 'rotate(0deg)';
  }
}

function loadData() {
  container.style.setProperty('--x', localStorage.getItem('q_x') || '50%');
  container.style.setProperty('--y', localStorage.getItem('q_y') || '50%');
  updateHandleImage(currentDesign);

  const imgPositions = [
    { top: 'auto', bottom: '10px', left: 'auto', right: '10px' },
    { top: 'auto', bottom: '10px', left: '10px', right: 'auto' },
    { top: '10px', bottom: 'auto', left: 'auto', right: '10px' },
    { top: '10px', bottom: 'auto', left: '10px', right: 'auto' }
  ];

  textareas.forEach((ta, i) => {
    const pos = imgPositions[i];
    const img = images[i];
    
    img.style.top = pos.top;
    img.style.bottom = pos.bottom;
    img.style.left = pos.left;
    img.style.right = pos.right;

    if (localStorage.getItem(`q_b_${i}`)) {
      ta.style.setProperty('--bg', localStorage.getItem(`q_b_${i}`));
      ta.style.setProperty('--color', localStorage.getItem(`q_c_${i}`));
    }
    if (localStorage.getItem(`q_f_${i}`)) {
      ta.style.setProperty('--fn', localStorage.getItem(`q_f_${i}`));
    }
    ta.style.fontSize = localStorage.getItem(`q_s_${i}`) || '18px';

    const tx = db.transaction("texts", "readonly");
    const req = tx.objectStore("texts").get(i);
    req.onsuccess = () => {
      if (req.result) {
        ta.innerHTML = req.result.content || '';
        if (req.result.img) { images[i].src = req.result.img; images[i].style.display = 'block'; }
        else { images[i].removeAttribute('src'); images[i].style.display = 'none'; }
      }
    };
  });
}

let handleLongPressTimer; 
let startX = 0, startY = 0;

handle.addEventListener('pointerdown', (e) => {
  isDragging = true;
  dragStartTime = Date.now();
  const touch = e.touches ? e.touches[0] : e;
  startX = touch.clientX;
  startY = touch.clientY;

  handleLongPressTimer = setTimeout(() => {
    if (isDragging) {
      isDragging = false;
      window.location.href = 'index.html';
    }
  }, 1000);
});

window.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const touch = e.touches ? e.touches[0] : e;
  
  const moveX = Math.abs(touch.clientX - startX);
  const moveY = Math.abs(touch.clientY - startY);
  
  if (moveX > 5 || moveY > 5) {
    clearTimeout(handleLongPressTimer);
  }

  const padding = 10;
  const rawX = (touch.clientX / window.innerWidth) * 100;
  const rawY = (touch.clientY / window.innerHeight) * 100;
  const clampedX = Math.max(padding, Math.min(100 - padding, rawX));
  const clampedY = Math.max(padding, Math.min(100 - padding, rawY));
  const x = `${clampedX}%`;
  const y = `${clampedY}%`;
  container.style.setProperty('--x', x);
  container.style.setProperty('--y', y);
  localStorage.setItem('q_x', x);
  localStorage.setItem('q_y', y);
});

window.addEventListener('pointerup', (e) => {
  clearTimeout(handleLongPressTimer);
  if (!isDragging) return;
  const duration = Date.now() - dragStartTime;
  isDragging = false;

  if (duration < 250) {
    currentDesign = (currentDesign + 1) % designs.length;
    localStorage.setItem('q_handle_design', currentDesign);
    updateHandleImage(currentDesign);

    const randomHue = Math.floor(Math.random() * 360);
    
    if (currentDesign === 3) {
      handle.style.filter = `drop-shadow(0 4px 4px rgba(0,0,0,0.5)) drop-shadow(0 4px 4px rgba(255,255,255,0.3))`;
    } else {
      const randomDegrees = Math.floor(Math.random() * 4) * 90;
      handle.querySelector('img').style.transform = `rotate(${randomDegrees}deg)`;
      handle.style.filter = `hue-rotate(${randomHue}deg) drop-shadow(0 6px 6px rgba(255,255,255,0.4))`;
    }

    const palette = magicPalettes[Math.floor(Math.random() * magicPalettes.length)];
    
    textareas.forEach((ta, i) => {
      const randomFont = fontsPool[Math.floor(Math.random() * fontsPool.length)];
      ta.style.setProperty('--fn', randomFont);
      localStorage.setItem(`q_f_${i}`, randomFont);
      
      ta.style.setProperty('--bg', palette.bg[i]);
      ta.style.setProperty('--color', palette.co[i]);
      localStorage.setItem(`q_b_${i}`, palette.bg[i]);
      localStorage.setItem(`q_c_${i}`, palette.co[i]);
    });
  }
});

handle.addEventListener('touchstart', (e) => {
  if (e.cancelable) e.preventDefault();
}, { passive: false });

handle.addEventListener('click', (e) => e.preventDefault());
handle.addEventListener('contextmenu', (e) => e.preventDefault());

function handleImageFile(file, index, ta) {
  const reader = new FileReader();
  reader.onload = (ev) => {
    images[index].src = ev.target.result;
    images[index].style.display = 'block';
    saveToDB(index, ta.innerHTML, ev.target.result);
  };
  reader.readAsDataURL(file);
}

// Элементы модального окна
const modal = document.getElementById('settings-modal');
const selFont = document.getElementById('setting-font');
const selSize = document.getElementById('setting-size');
const inpBg = document.getElementById('setting-bg');
const inpColor = document.getElementById('setting-color');
const selPos = document.getElementById('setting-pos');
const chkDelImg = document.getElementById('setting-del-img');
const imgActionContainer = document.getElementById('image-action-container');
const btnSave = document.getElementById('setting-save');
const btnCancel = document.getElementById('setting-cancel');

let activeIndex = null;
let textareaLongPressTimer;

textareas.forEach((ta, i) => {
  ta.addEventListener('input', () => {
    if (ta.textContent.trim() === '' && !ta.querySelector('img')) {
      ta.innerHTML = '';
    }
    saveToDB(i, ta.innerHTML);
  });

  ta.addEventListener('paste', (e) => {
    e.preventDefault();
    const item = Array.from(e.clipboardData.items).find(x => x.type.indexOf('image') !== -1);
    if (item) {
      handleImageFile(item.getAsFile(), i, ta);
    } else {
      const text = e.clipboardData.getData('text/plain');
      document.execCommand('insertText', false, text);
    }
  });

  ta.addEventListener('dragover', (e) => { e.preventDefault(); });

  ta.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      const file = Array.from(e.dataTransfer.files).find(x => x.type.indexOf('image') !== -1);
      if (file) { handleImageFile(file, i, ta); }
    } else {
      const item = Array.from(e.dataTransfer.items).find(x => x.type.indexOf('image') !== -1);
      if (item) { handleImageFile(item.getAsFile(), i, ta); }
    }
  });

  const startLongPress = () => {
    activeIndex = i;
    textareaLongPressTimer = setTimeout(() => {
      ta.blur();

      selFont.value = localStorage.getItem(`q_f_${i}`) || selFont.options[0].value;
      selSize.value = localStorage.getItem(`q_s_${i}`) || '18px';
      inpBg.value = localStorage.getItem(`q_b_${i}`) || getComputedStyle(ta).getPropertyValue('--default-bg').trim();
      inpColor.value = localStorage.getItem(`q_c_${i}`) || getComputedStyle(ta).getPropertyValue('--default-color').trim();
      selPos.value = localStorage.getItem(`q_pos_${i}`) || 'bottom right';

      if (images[i].style.display === 'block') {
        imgActionContainer.style.display = 'block';
        chkDelImg.checked = false;
      } else {
        imgActionContainer.style.display = 'none';
      }

      modal.style.display = 'flex';
    }, 1500);
  };

  const stopLongPress = () => clearTimeout(textareaLongPressTimer);

  ta.addEventListener('mousedown', startLongPress);
  ta.addEventListener('mouseup', stopLongPress);
  ta.addEventListener('mouseleave', stopLongPress);
  ta.addEventListener('touchstart', startLongPress, {passive: true});
  ta.addEventListener('touchend', stopLongPress);
});

btnSave.onclick = () => {
  if (activeIndex === null) return;
  const targetTa = textareas[activeIndex];

  targetTa.style.setProperty('--fn', selFont.value);
  localStorage.setItem(`q_f_${activeIndex}`, selFont.value);

  targetTa.style.fontSize = selSize.value;
  localStorage.setItem(`q_s_${activeIndex}`, selSize.value);

  targetTa.style.setProperty('--bg', inpBg.value);
  localStorage.setItem(`q_b_${activeIndex}`, inpBg.value);
  targetTa.style.setProperty('--color', inpColor.value);
  localStorage.setItem(`q_c_${activeIndex}`, inpColor.value);

  localStorage.setItem(`q_pos_${activeIndex}`, selPos.value);
  const [v, h] = selPos.value.split(' ');
  images[activeIndex].style.top = v === 'top' ? '10px' : 'auto';
  images[activeIndex].style.bottom = v === 'bottom' ? '10px' : 'auto';
  images[activeIndex].style.left = h === 'left' ? '10px' : 'auto';
  images[activeIndex].style.right = h === 'right' ? '10px' : 'auto';

  if (chkDelImg.checked) {
    images[activeIndex].removeAttribute('src');
    images[activeIndex].style.display = 'none';
    localStorage.removeItem(`q_pos_${activeIndex}`);
    saveToDB(activeIndex, targetTa.innerHTML, null, true);
  }

  modal.style.display = 'none';
  activeIndex = null;
};

btnCancel.onclick = () => {
  modal.style.display = 'none';
  activeIndex = null;
};
</script>
</body>
</html>
