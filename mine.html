<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>3D MineSweeper</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    overflow: hidden; background: #0a0a1a; 
    font-family: Arial, sans-serif; color: #fff;
    display: flex; flex-direction: column; align-items: center;
    height: 100vh; padding: 10px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; color: #ffcc00; }
  #topbar {
    display: flex; gap: 14px; align-items: center; margin-bottom: 8px;
    background: rgba(255,255,255,.08); padding: 6px 14px; border-radius: 20px;
    flex-wrap: wrap; justify-content: center;
  }
  #topbar div { font-size: 14px; }
  #topbar b { color: #ffcc00; }
  #canvasWrap { flex: 1; width: 100%; position: relative; display: flex; justify-content: center; align-items: center; }
  canvas { display: block; border-radius: 8px; }
  #controls {
    display: flex; gap: 10px; align-items: center; margin-top: 8px;
    flex-wrap: wrap; justify-content: center;
  }
  .group {
    display: flex; gap: 6px; align-items: center;
    background: rgba(255,255,255,.08); padding: 6px 12px; border-radius: 20px;
    font-size: 13px;
  }
  .group button {
    padding: 5px 10px; cursor: pointer; background: #444; color: #fff;
    border: 2px solid #666; border-radius: 5px; font-weight: bold; font-size: 13px;
  }
  .group button.active { background: #ffcc00; color: #000; border-color: #ffcc00; }
  .group button:hover { border-color: #ffcc00; }
  #layerNav button {
    padding: 5px 12px; background: #3a7bd5; color: #fff;
    border: none; border-radius: 5px; font-weight: bold; font-size: 14px; cursor: pointer;
  }
  #layerNav button:hover { background: #5a9bf5; }
  #layerNav button:disabled { opacity: .3; cursor: not-allowed; }
  #layerLabel { font-weight: bold; color: #ffcc00; min-width: 100px; text-align: center; font-size: 14px; }
  #help {
    font-size: 11px; text-align: center; opacity: .7; line-height: 1.5; margin-top: 6px;
    max-width: 700px;
  }
  #msg {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 56px; font-weight: bold; text-shadow: 0 0 30px #000;
    pointer-events: none; opacity: 0; transition: opacity .4s; z-index: 20;
  }
  #msg.show { opacity: 1; }
  #newGame {
    position: fixed; top: 10px; right: 10px; padding: 8px 16px;
    background: #ffcc00; color: #000; border: none; border-radius: 5px;
    cursor: pointer; font-weight: bold; font-size: 14px;
  }
  #newGame:hover { background: #ffdd44; }
</style>
</head>
<body>

<h1>💣 3D MineSweeper</h1>

<div id="topbar">
  <div>💣 <b id="mines">0</b></div>
  <div>🚩 <b id="flags">0</b></div>
  <div>⏱ <b id="time">0</b>с</div>
  <div>Размер: <b id="sizeLabel">6×6×6</b></div>
</div>

<div id="canvasWrap">
  <canvas id="game"></canvas>
</div>

<div id="controls">
  <div class="group">
    <span>Куб:</span>
    <button data-size="6">6</button>
    <button data-size="8">8</button>
    <button data-size="10">10</button>
    <button data-size="12">12</button>
  </div>
  <div class="group" id="layerNav">
    <button id="prevLayer">⬅</button>
    <div id="layerLabel">Слой 1 / 6</div>
    <button id="nextLayer">➡</button>
  </div>
  <div class="group">
    <span>Соседи:</span>
    <button id="mode2D" class="active">Слой</button>
    <button id="mode3D">Куб</button>
  </div>
</div>

<div id="help">
  <b>ЛКМ</b> — открыть · <b>ПКМ</b> — флаг 🚩 · Цифра = мины рядом · 
  ЛКМ по открытой цифре = открыть соседей (если флагов хватает) · 
  Смена размера только в новой игре
</div>

<button id="newGame">🔄 Новая игра</button>

<div id="msg"></div>

<script>
// ===== Настройки (меняются через UI) =====
let SIZE = 6;
let MINES = 20;
let CELL = 60;          // будет пересчитан
const GAP = 4;

// ===== Состояние =====
let grid = [];
let gameOver, started, flagsCount;
let activeLayer = 0;
let use3D = false;
let startTime, timerInt;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ===== Расчёт сложности =====
function minesForSize(n) {
  // ~7% от общего объёма, но не больше 15% и не меньше 8
  const total = n*n*n;
  return Math.min(Math.floor(total * 0.07), Math.floor(total * 0.15));
}

// ===== Настройка канваса =====
function setupCanvas() {
  const wrap = document.getElementById('canvasWrap');
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  const available = Math.min(w, h) - 10;
  const totalGrid = SIZE * 1 + (SIZE + 1) * GAP / SIZE; // пропорция
  CELL = Math.max(24, Math.min(80, Math.floor((available - GAP * (SIZE + 1)) / SIZE)));
  const side = SIZE * CELL + GAP * (SIZE + 1);
  canvas.width = side;
  canvas.height = side;
  canvas.style.width = side + 'px';
  canvas.style.height = side + 'px';
}

// ===== Игра =====
function newGame() {
  gameOver = false;
  started = false;
  flagsCount = 0;
  activeLayer = 0;
  MINES = minesForSize(SIZE);
  if (timerInt) clearInterval(timerInt);
  document.getElementById('time').textContent = '0';
  document.getElementById('msg').classList.remove('show');
  document.getElementById('sizeLabel').textContent = `${SIZE}×${SIZE}×${SIZE}`;

  grid = [];
  for (let x = 0; x < SIZE; x++) {
    grid[x] = [];
    for (let y = 0; y < SIZE; y++) {
      grid[x][y] = [];
      for (let z = 0; z < SIZE; z++) {
        grid[x][y][z] = { mine: false, state: 'hidden', value: 0 };
      }
    }
  }

  document.getElementById('mines').textContent = MINES;
  document.getElementById('flags').textContent = 0;
  updateLayerLabel();
  setupCanvas();
  draw();
}

function updateLayerLabel() {
  document.getElementById('layerLabel').textContent = `Слой ${activeLayer + 1} / ${SIZE}`;
  document.getElementById('prevLayer').disabled = activeLayer === 0;
  document.getElementById('nextLayer').disabled = activeLayer === SIZE - 1;
}

function neighbors(x, y, z) {
  const out = [];
  const zRange = use3D ? [-1, 0, 1] : [0];
  for (let dx = -1; dx <= 1; dx++)
    for (let dy = -1; dy <= 1; dy++)
      for (const dz of zRange) {
        if (!dx && !dy && !dz) continue;
        const nx = x+dx, ny = y+dy, nz = z+dz;
        if (nx>=0 && nx<SIZE && ny>=0 && ny<SIZE && nz>=0 && nz<SIZE)
          out.push([nx, ny, nz]);
      }
  return out;
}

function generateMines(sx, sy, sz) {
  const forbidden = new Set();
  for (let dx = -1; dx <= 1; dx++)
    for (let dy = -1; dy <= 1; dy++)
      for (let dz = -1; dz <= 1; dz++)
        forbidden.add(`${sx+dx},${sy+dy},${sz+dz}`);

  const all = [];
  for (let x = 0; x < SIZE; x++)
    for (let y = 0; y < SIZE; y++)
      for (let z = 0; z < SIZE; z++)
        if (!forbidden.has(`${x},${y},${z}`)) all.push([x,y,z]);

  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  const cnt = Math.min(MINES, all.length);
  for (let i = 0; i < cnt; i++) {
    const [x,y,z] = all[i];
    grid[x][y][z].mine = true;
  }

  for (let x = 0; x < SIZE; x++)
    for (let y = 0; y < SIZE; y++)
      for (let z = 0; z < SIZE; z++) {
        if (grid[x][y][z].mine) continue;
        grid[x][y][z].value = neighbors(x,y,z).filter(([a,b,c]) => grid[a][b][c].mine).length;
      }
}

function reveal(x, y, z) {
  const cell = grid[x][y][z];
  if (cell.state !== 'hidden') return;
  if (cell.mine) {
    cell.state = 'open';
    return;
  }
  cell.state = 'open';
  if (cell.value === 0) {
    for (const [a,b,c] of neighbors(x,y,z)) reveal(a, b, c);
  }
}

function toggleFlag(x, y, z) {
  const cell = grid[x][y][z];
  if (cell.state === 'open') return;
  if (cell.state === 'hidden') {
    cell.state = 'flag';
    flagsCount++;
  } else {
    cell.state = 'hidden';
    flagsCount--;
  }
  document.getElementById('flags').textContent = flagsCount;
}

function checkWin() {
  for (let x = 0; x < SIZE; x++)
    for (let y = 0; y < SIZE; y++)
      for (let z = 0; z < SIZE; z++) {
        const c = grid[x][y][z];
        if (!c.mine && c.state !== 'open') return false;
      }
  return true;
}

function lose() {
  gameOver = true;
  for (let x = 0; x < SIZE; x++)
    for (let y = 0; y < SIZE; y++)
      for (let z = 0; z < SIZE; z++) {
        const c = grid[x][y][z];
        if (c.mine && c.state !== 'flag') c.state = 'open';
      }
  if (timerInt) clearInterval(timerInt);
  showMsg('💥 BOOM!', '#ff4444');
  draw();
}

function win() {
  gameOver = true;
  if (timerInt) clearInterval(timerInt);
  showMsg('🎉 Победа!', '#44ff88');
  draw();
}

function showMsg(text, color) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.style.color = color;
  el.classList.add('show');
}

// ===== Рисование =====
const NUM_COLORS = ['', '#4fc3f7','#81c784','#ffb74d','#e57373','#ba68c8','#4dd0e1','#ffffff','#f06292'];

function draw() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const fontSize = Math.max(14, Math.floor(CELL * 0.55));
  const flagSize = Math.max(14, Math.floor(CELL * 0.5));

  for (let x = 0; x < SIZE; x++) {
    for (let y = 0; y < SIZE; y++) {
      const c = grid[x][y][activeLayer];
      const px = GAP + x * (CELL + GAP);
      const py = GAP + y * (CELL + GAP);
      const r = Math.max(3, Math.floor(CELL * 0.15));

      // Фон
      if (c.state === 'hidden') ctx.fillStyle = '#3a7bd5';
      else if (c.state === 'flag') ctx.fillStyle = '#ffcc00';
      else ctx.fillStyle = '#1a1a2a';

      roundRect(px, py, CELL, CELL, r);
      ctx.fill();

      // Обводка
      ctx.strokeStyle = 'rgba(0,0,0,.4)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Содержимое
      if (c.state === 'flag') {
        ctx.font = `${flagSize}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🚩', px + CELL/2, py + CELL/2 + 1);
      } else if (c.state === 'open') {
        if (c.mine) {
          ctx.font = `${fontSize}px Arial`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('💣', px + CELL/2, py + CELL/2);
        } else if (c.value > 0) {
          ctx.fillStyle = NUM_COLORS[c.value] || '#fff';
          ctx.font = `bold ${fontSize}px Arial`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(c.value, px + CELL/2, py + CELL/2);
        }
      }
    }
  }

  // Подсказка при 3D-режиме: сколько флагов всего вокруг
  if (use3D) {
    for (let x = 0; x < SIZE; x++) {
      for (let y = 0; y < SIZE; y++) {
        const c = grid[x][y][activeLayer];
        if (c.state === 'open' && c.value > 0) {
          const nbs = neighbors(x, y, activeLayer);
          const fl = nbs.filter(([a,b,cc]) => grid[a][b][cc].state === 'flag').length;
          if (fl > 0 && fl < c.value) {
            const px = GAP + x * (CELL + GAP);
            const py = GAP + y * (CELL + GAP);
            ctx.fillStyle = 'rgba(255,204,0,.75)';
            ctx.beginPath();
            ctx.arc(px + CELL - 6, py + 6, Math.max(3, CELL*0.08), 0, Math.PI*2);
            ctx.fill();
          }
        }
      }
    }
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ===== Ввод =====
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('pointerdown', (e) => {
  if (gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top) * scaleY;

  let gx = -1, gy = -1;
  for (let x = 0; x < SIZE; x++) {
    const px = GAP + x * (CELL + GAP);
    if (cx >= px && cx <= px + CELL) gx = x;
  }
  for (let y = 0; y < SIZE; y++) {
    const py = GAP + y * (CELL + GAP);
    if (cy >= py && cy <= py + CELL) gy = y;
  }
  if (gx < 0 || gy < 0) return;

  const cell = grid[gx][gy][activeLayer];

  if (e.button === 2) {
    toggleFlag(gx, gy, activeLayer);
    draw();
    return;
  }
  if (e.button !== 0) return;

  // Клик по открытой цифре — открыть соседей
  if (cell.state === 'open' && cell.value > 0) {
    const nbs = neighbors(gx, gy, activeLayer);
    const flagged = nbs.filter(([a,b,c]) => grid[a][b][c].state === 'flag').length;
    if (flagged === cell.value) {
      for (const [a,b,c] of nbs) {
        if (grid[a][b][c].state === 'hidden') reveal(a, b, c);
      }
      for (const [a,b,c] of nbs) {
        if (grid[a][b][c].mine && grid[a][b][c].state === 'open') {
          lose(); return;
        }
      }
      if (checkWin()) { win(); return; }
      draw();
    }
    return;
  }

  if (cell.state === 'flag') return;

  if (!started) {
    started = true;
    generateMines(gx, gy, activeLayer);
    startTime = Date.now();
    timerInt = setInterval(() => {
      document.getElementById('time').textContent = Math.floor((Date.now() - startTime) / 1000);
    }, 250);
  }

  reveal(gx, gy, activeLayer);
  if (cell.mine) { lose(); return; }
  if (checkWin()) { win(); return; }
  draw();
});

// ===== UI =====
document.getElementById('prevLayer').onclick = () => {
  if (activeLayer > 0) { activeLayer--; updateLayerLabel(); draw(); }
};
document.getElementById('nextLayer').onclick = () => {
  if (activeLayer < SIZE - 1) { activeLayer++; updateLayerLabel(); draw(); }
};

document.querySelectorAll('[data-size]').forEach(btn => {
  btn.onclick = () => {
    const newSize = parseInt(btn.dataset.size);
    if (started && !gameOver && !confirm(`Начать новую игру размером ${newSize}×${newSize}×${newSize}? Текущий прогресс потеряется.`)) {
      return;
    }
    SIZE = newSize;
    document.querySelectorAll('[data-size]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    newGame();
  };
});

document.getElementById('mode2D').onclick = () => {
  if (started && !gameOver && !confirm('Смена режима — начать новую игру?')) return;
  use3D = false;
  document.getElementById('mode2D').classList.add('active');
  document.getElementById('mode3D').classList.remove('active');
  if (started) newGame();
};
document.getElementById('mode3D').onclick = () => {
  if (started && !gameOver && !confirm('Смена режима — начать новую игру?')) return;
  use3D = true;
  document.getElementById('mode3D').classList.add('active');
  document.getElementById('mode2D').classList.remove('active');
  if (started) newGame();
};

document.getElementById('newGame').onclick = newGame;

window.addEventListener('resize', () => {
  setupCanvas();
  draw();
});

// ===== Старт =====
document.querySelector('[data-size="6"]').classList.add('active');
setupCanvas();
newGame();
</script>
</body>
</html>
