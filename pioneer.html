<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Minesweeper</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:#0a0a1a; color:#fff; font-family:Arial,sans-serif; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  
  /* Верхняя панель */
  #topbar { display:flex; justify-content:space-between; align-items:center; padding:10px; background:#151525; font-size:15px; }
  #topbar span { background:#222; padding:6px 12px; border-radius:6px; display:flex; gap:6px; align-items:center; font-weight:bold; }
  
  /* Игровое поле */
  #boardWrap { flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; padding:8px; }
  #board { display:grid; gap:2px; margin:auto; }
  .cell { background:#3a7bd5; border-radius:4px; display:flex; align-items:center; justify-content:center; font-weight:bold; cursor:pointer; user-select:none; position:relative; }
  .cell.flag { background:#ffcc00; color:#000; }
  .cell.open { background:#1a1a2a; }
  .cell.mine { background:#7a1010; }
  
  /* Мини-карта слоёв */
  #minimap { display:flex; gap:4px; justify-content:center; padding:8px; background:#151525; overflow-x:auto; }
  .mini-layer { flex-shrink:0; width:36px; height:36px; border-radius:6px; background:#222; border:2px solid #444; display:flex; align-items:center; justify-content:center; font-weight:bold; cursor:pointer; font-size:12px; }
  .mini-layer.active { border-color:#ffcc00; background:#3a3a1a; color:#ffcc00; }
  .mini-layer.done { background:#1a3a1a; border-color:#44ff88; color:#44ff88; }

  /* Нижние контролы */
  #controls { padding:8px; background:#151525; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; justify-content:center; gap:6px; }
  .row button { padding:8px 10px; background:#444; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px; }
  .row button.active { background:#ffcc00; color:#000; }
  .row button:disabled { opacity:.3; }
  #layerLabel { flex:1; text-align:center; background:#222; color:#ffcc00; border:none; font-weight:bold; padding:8px; border-radius:6px; }

  /* Оверлей */
  #overlay { display:none; position:fixed; inset:0; background:rgba(10,10,26,0.85); z-index:20; flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  #overlay.show { display:flex; }
  #msg { font-size:32px; font-weight:bold; margin-bottom:20px; text-align:center; }
  #overlay button { padding:14px 32px; background:#ffcc00; color:#000; border:none; border-radius:8px; font-size:18px; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>

<div id="topbar">
  <span>💣 <b id="mines">0</b></span>
  <span>🚩 <b id="flags">0</b></span>
  <span>⏱ <b id="time">0</b></span>
</div>

<div id="boardWrap">
  <div id="board"></div>
</div>

<div id="minimap"></div>

<div id="controls">
  <div class="row">
    <button id="prevLayer">‹</button>
    <div id="layerLabel">Layer 1 / 5</div>
    <button id="nextLayer">›</button>
  </div>
  <div class="row">
    <button data-size="5" class="size active">5³</button>
    <button data-size="8" class="size">8³</button>
    <button data-size="13" class="size">13³</button>
    <button data-size="21" class="size">21³</button>
  </div>
</div>

<div id="overlay">
  <div id="msg">💥 BOOM!</div>
  <button id="btnRestart">Play Again</button>
</div>

<script>
var SIZE = 5;
var MINES = 10;
var grid = [];
var activeLayer = 0;
var gameOver = false;
var started = false;
var flagsCount = 0;
var startTime = 0;
var timerInt = null;

var boardEl = document.getElementById('board');
var boardWrap = document.getElementById('boardWrap');
var overlay = document.getElementById('overlay');
var msgEl = document.getElementById('msg');
var minimapEl = document.getElementById('minimap');

// Плотность мин: 4% от объёма куба
function minesForSize(n) {
  var total = n * n * n;
  var m = Math.floor(total * 0.04);
  if (m < 4) m = 4;
  if (m > total - 25) m = total - 25;
  return m;
}

function applyBoardStyle() {
  var gap = SIZE <= 8 ? 3 : (SIZE <= 13 ? 2 : 1);
  var availW = boardWrap.clientWidth - 16 - gap * (SIZE - 1);
  var availH = boardWrap.clientHeight - 16 - gap * (SIZE - 1);
  var cell = Math.floor(Math.min(availW, availH) / SIZE);
  if (cell > 70) cell = 70;
  if (cell < 12) cell = 12;
  var fontSize = Math.max(8, Math.floor(cell * 0.5));
  boardEl.style.gridTemplateColumns = 'repeat(' + SIZE + ', ' + cell + 'px)';
  boardEl.style.gap = gap + 'px';
  var cells = boardEl.querySelectorAll('.cell');
  for (var i = 0; i < cells.length; i++) {
    cells[i].style.width = cell + 'px';
    cells[i].style.height = cell + 'px';
    cells[i].style.fontSize = fontSize + 'px';
  }
}

function newGame() {
  gameOver = false; started = false; flagsCount = 0; activeLayer = 0;
  if (timerInt) { clearInterval(timerInt); timerInt = null; }
  MINES = minesForSize(SIZE);
  
  document.getElementById('time').textContent = '0';
  document.getElementById('mines').textContent = MINES;
  document.getElementById('flags').textContent = '0';
  overlay.classList.remove('show');

  grid = [];
  for (var x = 0; x < SIZE; x++) {
    grid[x] = [];
    for (var y = 0; y < SIZE; y++) {
      grid[x][y] = [];
      for (var z = 0; z < SIZE; z++) grid[x][y][z] = { mine: false, state: 0, value: 0 };
    }
  }
  updateLayerLabel(); renderBoard(); renderMinimap(); applyBoardStyle();
}

function updateLayerLabel() {
  document.getElementById('layerLabel').textContent = 'Layer ' + (activeLayer + 1) + ' / ' + SIZE;
  document.getElementById('prevLayer').disabled = activeLayer === 0;
  document.getElementById('nextLayer').disabled = activeLayer === SIZE - 1;
}

// 26 соседей в 3D-кубе
function forEachNeighbor(x, y, z, fn) {
  for (var dx = -1; dx <= 1; dx++)
    for (var dy = -1; dy <= 1; dy++)
      for (var dz = -1; dz <= 1; dz++) {
        if (dx === 0 && dy === 0 && dz === 0) continue;
        var nx = x + dx, ny = y + dy, nz = z + dz;
        if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && nz >= 0 && nz < SIZE) fn(nx, ny, nz);
      }
}

function countMines(x, y, z) {
  var c = 0; forEachNeighbor(x, y, z, function(a,b,d){ if(grid[a][b][d].mine) c++; }); return c;
}
function countFlags(x, y, z) {
  var c = 0; forEachNeighbor(x, y, z, function(a,b,d){ if(grid[a][b][d].state === 2) c++; }); return c;
}

function generateMines(sx, sy, sz) {
  // Безопасная зона 3×3×3 вокруг первого клика
  var forbidden = {};
  forbidden[sx + ',' + sy + ',' + sz] = true;
  forEachNeighbor(sx, sy, sz, function(a,b,c){ forbidden[a+','+b+','+c] = true; });

  var pool = [];
  for (var x = 0; x < SIZE; x++)
    for (var y = 0; y < SIZE; y++)
      for (var z = 0; z < SIZE; z++) {
        if (forbidden[x+','+y+','+z]) continue;
        pool.push([x, y, z]);
      }
  var n = Math.min(MINES, pool.length);
  for (var i = 0; i < n; i++) {
    var j = i + Math.floor(Math.random() * (pool.length - i));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    grid[pool[i][0]][pool[i][1]][pool[i][2]].mine = true;
  }
  for (var xx = 0; xx < SIZE; xx++)
    for (var yy = 0; yy < SIZE; yy++)
      for (var zz = 0; zz < SIZE; zz++)
        if (!grid[xx][yy][zz].mine) grid[xx][yy][zz].value = countMines(xx, yy, zz);
}

// Открытие с рекурсией на 26 соседей
function reveal(x, y, z) {
  var start = grid[x][y][z];
  if (start.mine) { if (start.state === 0) start.state = 1; return; }
  var stack = [[x, y, z]];
  while (stack.length) {
    var p = stack.pop(), cell = grid[p[0]][p[1]][p[2]];
    if (cell.state !== 0 || cell.mine) continue;
    cell.state = 1;
    if (cell.value === 0) forEachNeighbor(p[0], p[1], p[2], function(a,b,c){
      var nb = grid[a][b][c]; if (nb.state === 0 && !nb.mine) stack.push([a,b,c]);
    });
  }
}

function toggleFlag(x, y, z) {
  var cell = grid[x][y][z];
  if (cell.state === 1) return;
  if (cell.state === 0) { cell.state = 2; flagsCount++; } else { cell.state = 0; flagsCount--; }
  document.getElementById('flags').textContent = flagsCount;
}

function checkWin() {
  for (var x = 0; x < SIZE; x++)
    for (var y = 0; y < SIZE; y++)
      for (var z = 0; z < SIZE; z++) {
        var c = grid[x][y][z]; if (!c.mine && c.state !== 1) return false;
      }
  return true;
}

function endGame(win) {
  gameOver = true;
  if (timerInt) { clearInterval(timerInt); timerInt = null; }
  if (!win) {
    for (var x = 0; x < SIZE; x++)
      for (var y = 0; y < SIZE; y++)
        for (var z = 0; z < SIZE; z++)
          if (grid[x][y][z].mine && grid[x][y][z].state !== 2) grid[x][y][z].state = 1;
  }
  renderBoard(); renderMinimap(); applyBoardStyle();
  msgEl.textContent = win ? '🎉 You win!' : '💥 BOOM!';
  msgEl.style.color = win ? '#44ff88' : '#ff4444';
  overlay.classList.add('show');
}

function isLayerDone(z) {
  // Слой пройден, если на нём все безопасные клетки открыты
  for (var x = 0; x < SIZE; x++)
    for (var y = 0; y < SIZE; y++) {
      if (!grid[x][y][z].mine && grid[x][y][z].state !== 1) return false;
    }
  return true;
}

function renderMinimap() {
  minimapEl.innerHTML = '';
  for (var z = 0; z < SIZE; z++) {
    var el = document.createElement('div');
    el.className = 'mini-layer';
    if (z === activeLayer) el.classList.add('active');
    if (isLayerDone(z)) el.classList.add('done');
    el.textContent = 'L' + (z + 1);
    (function(zz){
      el.addEventListener('click', function(){
        activeLayer = zz; updateLayerLabel(); renderBoard(); renderMinimap();
      });
    })(z);
    minimapEl.appendChild(el);
  }
}

function renderBoard() {
  boardEl.innerHTML = '';
  var NUM_COLORS = ['', '#4fc3f7','#81c784','#ffb74d','#e57373','#ba68c8','#4dd0e1','#ffffff','#f06292'];
  for (var y = 0; y < SIZE; y++) {
    for (var x = 0; x < SIZE; x++) {
      var c = grid[x][y][activeLayer];
      var el = document.createElement('div'); el.className = 'cell';
      
      if (c.state === 0) { /* hidden */ }
      else if (c.state === 2) { el.className = 'cell flag'; el.textContent = '🚩'; }
      else if (c.mine) { el.className = 'cell mine'; el.textContent = '💣'; }
      else {
        el.className = 'cell open';
        if (c.value > 0) {
          el.textContent = c.value;
          el.style.color = NUM_COLORS[c.value] || '#fff';
        }
      }
      bindCell(el, x, y); boardEl.appendChild(el);
    }
  }
}

function bindCell(el, x, y) {
  el.addEventListener('click', function () {
    if (gameOver) return;
    handleTap(x, y, activeLayer); renderBoard(); renderMinimap(); applyBoardStyle();
  });
  el.addEventListener('dblclick', function (e) {
    if (gameOver) return; e.preventDefault();
    toggleFlag(x, y, activeLayer); renderBoard(); applyBoardStyle();
  });
}

function handleTap(gx, gy, gz) {
  if (gameOver) return;
  var cell = grid[gx][gy][gz];
  
  if (cell.state === 1 && cell.value > 0) {
    var f = countFlags(gx, gy, gz);
    if (f === cell.value) {
      var hitMine = false;
      forEachNeighbor(gx, gy, gz, function(a,b,c){ if (grid[a][b][c].state === 0 && grid[a][b][c].mine) hitMine = true; });
      forEachNeighbor(gx, gy, gz, function(a,b,c){ if (grid[a][b][c].state === 0) reveal(a,b,c); });
      if (hitMine) { endGame(false); return; }
      if (checkWin()) { endGame(true); return; }
    }
    return;
  }
  
  if (cell.state !== 0) return;
  
  if (!started) {
    started = true; generateMines(gx, gy, gz); startTime = Date.now();
    timerInt = setInterval(function(){ document.getElementById('time').textContent = Math.floor((Date.now() - startTime) / 1000); }, 250);
  }
  
  if (cell.mine) { reveal(gx, gy, gz); endGame(false); return; }
  reveal(gx, gy, gz);
  if (checkWin()) { endGame(true); return; }
}

document.getElementById('prevLayer').addEventListener('click', function(){
  if (activeLayer > 0) { activeLayer--; updateLayerLabel(); renderBoard(); renderMinimap(); applyBoardStyle(); }
});
document.getElementById('nextLayer').addEventListener('click', function(){
  if (activeLayer < SIZE - 1) { activeLayer++; updateLayerLabel(); renderBoard(); renderMinimap(); applyBoardStyle(); }
});

document.getElementById('btnRestart').addEventListener('click', newGame);

var sizeButtons = document.querySelectorAll('button.size');
for (var i = 0; i < sizeButtons.length; i++) {
  (function (btn) {
    btn.addEventListener('click', function () {
      var newSize = parseInt(btn.getAttribute('data-size'), 10);
      if (started && !gameOver && !confirm('Change size? Game restarts.')) return;
      SIZE = newSize;
      for (var k = 0; k < sizeButtons.length; k++) sizeButtons[k].className = 'size';
      btn.className = 'size active';
      newGame();
    });
  })(sizeButtons[i]);
}
window.addEventListener('resize', applyBoardStyle);
newGame();
</script>
</body>
</html>
