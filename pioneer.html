<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<link rel="manifest" href="./manifest-pioneer.json">
<link rel="icon" type="image/png" sizes="512x512" href="./boom.png">
<link rel="apple-touch-icon" href="./boom.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mine3D">
<title>3D Minesweeper</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:#0a0a1a; color:#fff; font-family:Arial,sans-serif; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  
  #topbar { display:flex; justify-content:space-between; align-items:center; padding:10px; background:#151525; font-size:15px; gap:6px; }
  #topbar span { background:#222; padding:6px 12px; border-radius:6px; display:flex; gap:6px; align-items:center; font-weight:bold; }
  #topbar button { background:#222; border:none; color:#ffcc00; border-radius:6px; padding:6px 10px; font-size:15px; font-weight:bold; cursor:pointer; }

  #boardWrap { flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; padding:8px; position:relative; }
  #board { display:grid; gap:2px; margin:auto; }
  
  .cell {
    background:#3a7bd5; border-radius:4px; aspect-ratio: 1 / 1;
    display:flex; align-items:center; justify-content:center;
    font-weight:bold; cursor:pointer; user-select:none;
    position:relative; overflow:hidden;
  }
  .cell.flag { background:#ffcc00; color:#000; }
  .cell.open { background:#1a1a2a; }
  .cell.mine { background:#7a1010; }
  
  #minimap { display:flex; gap:4px; justify-content:center; padding:8px; background:#151525; overflow-x:auto; }
  .mini-layer { flex-shrink:0; width:36px; height:36px; border-radius:6px; background:#222; border:2px solid #444; display:flex; align-items:center; justify-content:center; font-weight:bold; cursor:pointer; font-size:12px; }
  .mini-layer.active { border-color:#ffcc00; background:#3a3a1a; color:#ffcc00; }
  .mini-layer.done { background:#1a3a1a; border-color:#44ff88; color:#44ff88; }

  #controls { padding:8px; background:#151525; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; justify-content:center; gap:6px; }
  .row button { padding:8px 10px; background:#444; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px; }
  .row button.active { background:#ffcc00; color:#000; }
  .row button:disabled { opacity:.3; }
  #layerLabel { flex:1; text-align:center; background:#222; color:#ffcc00; border:none; font-weight:bold; padding:8px; border-radius:6px; }

  #overlay { display:none; position:fixed; inset:0; background:rgba(10,10,26,0.85); z-index:20; flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  #overlay.show { display:flex; }
  #msg { font-size:32px; font-weight:bold; margin-bottom:20px; text-align:center; }
  #overlay button { padding:14px 32px; background:#ffcc00; color:#000; border:none; border-radius:8px; font-size:18px; font-weight:bold; cursor:pointer; }

  #toast {
    position: fixed; bottom: 100px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,.92); color: #ffcc00;
    padding: 10px 20px; border-radius: 22px;
    font-size: 14px; font-weight: bold;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 50; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #wordDisplay {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    font-size: 52px; font-weight: 900;
    color: #ffcc00;
    text-shadow: 0 0 30px rgba(255,204,0,.6), 0 4px 20px rgba(0,0,0,.8);
    opacity: 0; pointer-events: none;
    transition: opacity .4s, transform .4s;
    z-index: 60; text-align: center;
    letter-spacing: 2px;
    white-space: nowrap;
    max-width: 95vw; overflow: hidden; text-overflow: ellipsis;
  }
  #wordDisplay.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  #notebook {
    display:none; position:fixed; inset:0; z-index:70;
    background:rgba(10,10,26,0.95); backdrop-filter:blur(6px);
    overflow-y:auto;
  }
  #notebook.show { display:flex; }
  #notebookInner {
    max-width:560px; width:calc(100% - 32px);
    margin:auto; padding:24px 20px;
    background:#151525; border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,.6);
    color:#e8e8f0; font-size:14px;
  }
  #notebookInner h2 { color:#ffcc00; font-size:20px; margin-bottom:4px; text-align:center; }
  #notebookInner .hint { color:#888; font-size:12px; text-align:center; margin-bottom:16px; line-height:1.5; }

  .nb-row {
    display:flex; gap:6px; align-items:center;
    background:#1a1a2a; padding:8px; border-radius:8px;
    margin-bottom:8px;
  }
  .nb-row select, .nb-row input {
    background:#0a0a1a; color:#fff; border:1px solid #333;
    padding:8px; border-radius:6px; font-size:13px; font-family:inherit;
  }
  .nb-row select { flex-shrink:0; width:110px; }
  .nb-row input { flex:1; min-width:0; }
  .nb-row .del {
    background:#7a1010; color:#fff; border:none;
    width:32px; height:32px; border-radius:6px;
    font-weight:bold; cursor:pointer; flex-shrink:0;
  }
  .nb-row .del:active { background:#a02020; }

  #nbAdd, #nbClose, #nbReset {
    padding:10px 16px; border:none; border-radius:8px;
    font-size:14px; font-weight:bold; cursor:pointer;
    margin-top:10px;
  }
  #nbAdd { background:#4fc3f7; color:#000; }
  #nbClose { background:#ffcc00; color:#000; width:100%; }
  #nbReset { background:#333; color:#ccc; }

  .nb-actions { display:flex; gap:8px; }
  .nb-actions button { flex:1; }
 .ios-blur-fix {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 11px;
    z-index: 2147483647;
    pointer-events: none;
    background-color: #000;  /* подставьте цвет фона вашего файла */
    -webkit-background-clip: text;
    color: transparent;
}
</style>
</head>
<body>
  <div class="ios-blur-fix"></div>
<div id="topbar">
  <span>💣 <b id="mines">0</b></span>
  <span>🚩 <b id="flags">0</b></span>
  <span>⏱ <b id="time">0</b></span>
  <button id="btnNotebook" title="Notebook">📓</button>
</div>

<div id="boardWrap">
  <div id="board"></div>
  <div id="wordDisplay"></div>
</div>

<div id="minimap"></div>

<div id="controls">
  <div class="row">
    <button id="prevLayer">‹</button>
    <div id="layerLabel">Layer 1 / 5</div>
    <button id="nextLayer">›</button>
  </div>
  <div class="row">
    <button data-size="5" class="size active">5³</button>
    <button data-size="8" class="size">8³</button>
    <button data-size="13" class="size">13³</button>
    <button data-size="21" class="size">21³</button>
  </div>
</div>

<div id="overlay">
  <div id="msg">💥 BOOM!</div>
  <button id="btnRestart">Play Again</button>
</div>

<div id="toast"></div>

<div id="notebook">
  <div id="notebookInner">
    <h2>📓 Notebook</h2>
    <div class="hint">
      Words appear as gentle reminders during play<br>
      Pair a word with a trigger — it'll show up at that moment<br>
      Add the page to your home screen via the browser menu to use it as an app
    </div>
    <div id="nbList"></div>
    <button id="nbAdd">+ Add word</button>
    <div class="nb-actions">
      <button id="nbReset">Reset</button>
      <button id="nbClose">Close</button>
    </div>
  </div>
</div>

<script>
var SIZE = 5;
var MINES = 10;
var grid = [];
var activeLayer = 0;
var gameOver = false;
var started = false;
var flagsCount = 0;
var startTime = 0;
var timerInt = null;
var lastWordTime = 0;
var explosiveRunning = false;

const LONG_PRESS_MS = 400;
const NOTEBOOK_KEY = 'mine3d_notebook_v1';

var boardEl = document.getElementById('board');
var boardWrap = document.getElementById('boardWrap');
var overlay = document.getElementById('overlay');
var msgEl = document.getElementById('msg');
var minimapEl = document.getElementById('minimap');
var toastEl = document.getElementById('toast');
var wordDisplay = document.getElementById('wordDisplay');
var notebook = document.getElementById('notebook');
var nbList = document.getElementById('nbList');

var TRIGGERS = {
  'BOOM': '💥 On explosion',
  'WIN': '🎉 On victory',
  'START': '▶️ First tap',
  'FLAG': '🚩 Flag placed',
  'LAYER': '🔄 Layer switched',
  'TIME': '⏱ Every 30s'
};

var DEFAULT_WORDS = [
  { word: 'Focus', trigger: 'START' },
  { word: 'Breathe', trigger: 'LAYER' },
  { word: 'Nice', trigger: 'FLAG' },
  { word: 'Think', trigger: 'TIME' },
  { word: 'Almost', trigger: 'BOOM' },
  { word: 'Keep going', trigger: 'WIN' }
];

function loadNotebook() {
  try {
    var raw = localStorage.getItem(NOTEBOOK_KEY);
    if (raw) {
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) return arr;
    }
  } catch(e) {}
  return DEFAULT_WORDS.slice();
}

function saveNotebook(words) {
  try { localStorage.setItem(NOTEBOOK_KEY, JSON.stringify(words)); } catch(e) {}
}

var notebookWords = loadNotebook();

function showWordFor(trigger) {
  var matches = notebookWords.filter(function(w){ return w.trigger === trigger && w.word; });
  if (!matches.length) return;
  var pick = matches[Math.floor(Math.random() * matches.length)];
  showBigWord(pick.word);
}

var wordHideTimer = null;
function showBigWord(text) {
  wordDisplay.textContent = text;
  wordDisplay.classList.add('show');
  clearTimeout(wordHideTimer);
  wordHideTimer = setTimeout(function(){
    wordDisplay.classList.remove('show');
  }, 1600);
}

var toastTimer = null;
function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1400);
}

function minesForSize(n) {
  var total = n * n * n;
  var m = Math.floor(total * 0.04);
  if (m < 4) m = 4;
  if (m > total - 25) m = total - 25;
  return m;
}

function applyBoardStyle() {
  var gap = SIZE <= 8 ? 3 : (SIZE <= 13 ? 2 : 1);
  var availW = boardWrap.clientWidth - 16 - gap * (SIZE - 1);
  var availH = boardWrap.clientHeight - 16 - gap * (SIZE - 1);
  var cell = Math.floor(Math.min(availW, availH) / SIZE);
  if (cell > 70) cell = 70;
  if (cell < 12) cell = 12;
  var fontSize = Math.max(8, Math.floor(cell * 0.5));
  boardEl.style.gridTemplateColumns = 'repeat(' + SIZE + ', ' + cell + 'px)';
  boardEl.style.gridAutoRows = cell + 'px';
  boardEl.style.gap = gap + 'px';
  var cells = boardEl.querySelectorAll('.cell');
  for (var i = 0; i < cells.length; i++) {
    cells[i].style.width = cell + 'px';
    cells[i].style.height = cell + 'px';
    cells[i].style.fontSize = fontSize + 'px';
  }
}

function newGame() {
  gameOver = false; started = false; flagsCount = 0; activeLayer = 0; explosiveRunning = false;
  lastWordTime = 0;
  if (timerInt) { clearInterval(timerInt); timerInt = null; }
  MINES = minesForSize(SIZE);

  document.getElementById('time').textContent = '0';
  document.getElementById('mines').textContent = MINES;
  document.getElementById('flags').textContent = '0';
  overlay.classList.remove('show');

  grid = [];
  for (var x = 0; x < SIZE; x++) {
    grid[x] = [];
    for (var y = 0; y < SIZE; y++) {
      grid[x][y] = [];
      for (var z = 0; z < SIZE; z++) grid[x][y][z] = { mine: false, state: 0, value: 0 };
    }
  }
  updateLayerLabel(); renderBoard(); renderMinimap();
  requestAnimationFrame(function(){ applyBoardStyle(); });
  showToast('Tap a cell to start');
}

function updateLayerLabel() {
  document.getElementById('layerLabel').textContent = 'Layer ' + (activeLayer + 1) + ' / ' + SIZE;
  document.getElementById('prevLayer').disabled = activeLayer === 0;
  document.getElementById('nextLayer').disabled = activeLayer === SIZE - 1;
}

function forEachNeighbor(x, y, z, fn) {
  for (var dx = -1; dx <= 1; dx++)
    for (var dy = -1; dy <= 1; dy++)
      for (var dz = -1; dz <= 1; dz++) {
        if (dx === 0 && dy === 0 && dz === 0) continue;
        var nx = x + dx, ny = y + dy, nz = z + dz;
        if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && nz >= 0 && nz < SIZE) fn(nx, ny, nz);
      }
}
function countMines(x, y, z) {
  var c = 0; forEachNeighbor(x, y, z, function(a,b,d){ if(grid[a][b][d].mine) c++; }); return c;
}
function countFlags(x, y, z) {
  var c = 0; forEachNeighbor(x, y, z, function(a,b,d){ if(grid[a][b][d].state === 2) c++; }); return c;
}

function generateMines(sx, sy, sz) {
  var forbidden = {};
  forbidden[sx + ',' + sy + ',' + sz] = true;
  forEachNeighbor(sx, sy, sz, function(a,b,c){ forbidden[a+','+b+','+c] = true; });

  var pool = [];
  for (var x = 0; x < SIZE; x++)
    for (var y = 0; y < SIZE; y++)
      for (var z = 0; z < SIZE; z++) {
        if (forbidden[x+','+y+','+z]) continue;
        pool.push([x, y, z]);
      }
  var n = Math.min(MINES, pool.length);
  for (var i = 0; i < n; i++) {
    var j = i + Math.floor(Math.random() * (pool.length - i));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    grid[pool[i][0]][pool[i][1]][pool[i][2]].mine = true;
  }
  for (var xx = 0; xx < SIZE; xx++)
    for (var yy = 0; yy < SIZE; yy++)
      for (var zz = 0; zz < SIZE; zz++)
        if (!grid[xx][yy][zz].mine) grid[xx][yy][zz].value = countMines(xx, yy, zz);
}

function reveal(x, y, z) {
  var start = grid[x][y][z];
  if (start.mine) { if (start.state === 0) start.state = 1; return; }
  var stack = [[x, y, z]];
  while (stack.length) {
    var p = stack.pop(), cell = grid[p[0]][p[1]][p[2]];
    if (cell.state !== 0 || cell.mine) continue;
    cell.state = 1;
    if (cell.value === 0) forEachNeighbor(p[0], p[1], p[2], function(a,b,c){
      var nb = grid[a][b][c]; if (nb.state === 0 && !nb.mine) stack.push([a,b,c]);
    });
  }
}

function toggleFlag(x, y, z) {
  var cell = grid[x][y][z];
  if (cell.state === 1) return;
  if (cell.state === 0) {
    cell.state = 2; flagsCount++;
    showToast('🚩 Flag placed');
    showWordFor('FLAG');
  } else {
    cell.state = 0; flagsCount--;
    showToast('⬜ Flag removed');
  }
  document.getElementById('flags').textContent = flagsCount;
}

function checkWin() {
  for (var x = 0; x < SIZE; x++)
    for (var y = 0; y < SIZE; y++)
      for (var z = 0; z < SIZE; z++) {
        var c = grid[x][y][z]; if (!c.mine && c.state !== 1) return false;
      }
  return true;
}

function loseSequential() {
  gameOver = true;
  explosiveRunning = true;
  if (timerInt) { clearInterval(timerInt); timerInt = null; }

  var i = 0;
  function explodeNextLayer() {
    if (i >= SIZE) {
      explosiveRunning = false;
      var sec = Math.floor((Date.now() - startTime) / 1000);
      msgEl.textContent = '💥 BOOM!';
      msgEl.style.color = '#ff4444';
      overlay.classList.add('show');
      showToast('💥 Exploded in ' + sec + 's');
      showWordFor('BOOM');
      if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
      return;
    }
    var z = i++;
    activeLayer = z;
    for (var x = 0; x < SIZE; x++)
      for (var y = 0; y < SIZE; y++) {
        var c = grid[x][y][z];
        if (c.mine && c.state !== 2) c.state = 1;
      }
    renderBoard(); renderMinimap(); applyBoardStyle();
    showToast('💥 Layer ' + (z + 1) + ' detonated');
    if (navigator.vibrate) navigator.vibrate(40);
    setTimeout(explodeNextLayer, 140);
  }
  setTimeout(explodeNextLayer, 200);
}

function winGame() {
  gameOver = true;
  if (timerInt) { clearInterval(timerInt); timerInt = null; }
  renderBoard(); renderMinimap(); applyBoardStyle();
  var sec = Math.floor((Date.now() - startTime) / 1000);
  msgEl.textContent = '🎉 You win!';
  msgEl.style.color = '#44ff88';
  overlay.classList.add('show');
  showToast('🎉 All layers cleared in ' + sec + 's!');
  showWordFor('WIN');
  if (navigator.vibrate) navigator.vibrate([50, 50, 50, 50, 50]);
}

function isLayerDone(z) {
  for (var x = 0; x < SIZE; x++)
    for (var y = 0; y < SIZE; y++) {
      if (!grid[x][y][z].mine && grid[x][y][z].state !== 1) return false;
    }
  return true;
}

function renderMinimap() {
  minimapEl.innerHTML = '';
  for (var z = 0; z < SIZE; z++) {
    var el = document.createElement('div');
    el.className = 'mini-layer';
    if (z === activeLayer) el.classList.add('active');
    if (isLayerDone(z)) el.classList.add('done');
    el.textContent = 'L' + (z + 1);
    (function(zz){
      el.addEventListener('click', function(){
        if (explosiveRunning) return;
        if (zz === activeLayer) return;
        activeLayer = zz;
        updateLayerLabel(); renderBoard(); renderMinimap(); applyBoardStyle();
        showWordFor('LAYER');
      });
    })(z);
    minimapEl.appendChild(el);
  }
}

function renderBoard() {
  boardEl.innerHTML = '';
  var NUM_COLORS = ['', '#4fc3f7','#81c784','#ffb74d','#e57373','#ba68c8','#4dd0e1','#ffffff','#f06292'];
  for (var y = 0; y < SIZE; y++) {
    for (var x = 0; x < SIZE; x++) {
      var c = grid[x][y][activeLayer];
      var el = document.createElement('div'); el.className = 'cell';
      if (c.state === 0) { /* hidden */ }
      else if (c.state === 2) { el.className = 'cell flag'; el.textContent = '🚩'; }
      else if (c.mine) { el.className = 'cell mine'; el.textContent = '💣'; }
      else {
        el.className = 'cell open';
        if (c.value > 0) { el.textContent = c.value; el.style.color = NUM_COLORS[c.value] || '#fff'; }
      }
      bindCell(el, x, y); boardEl.appendChild(el);
    }
  }
}

function bindCell(el, x, y) {
  var pressTimer = null;
  var longFired = false;

  el.addEventListener('pointerdown', function (e) {
    if (gameOver || explosiveRunning) return;
    e.preventDefault();
    longFired = false;
    pressTimer = setTimeout(function () {
      longFired = true;
      if (navigator.vibrate) navigator.vibrate(35);
      toggleFlag(x, y, activeLayer);
      renderBoard(); applyBoardStyle();
    }, LONG_PRESS_MS);
  });

  el.addEventListener('pointerup', function (e) {
    e.preventDefault();
    clearTimeout(pressTimer);
    if (longFired || gameOver || explosiveRunning) return;
    handleTap(x, y, activeLayer);
    renderBoard(); renderMinimap(); applyBoardStyle();
  });

  el.addEventListener('pointercancel', function () { clearTimeout(pressTimer); });
  el.addEventListener('pointerleave', function () { clearTimeout(pressTimer); });
  el.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    if (gameOver || explosiveRunning) return;
    toggleFlag(x, y, activeLayer);
    renderBoard(); applyBoardStyle();
  });
}

function handleTap(gx, gy, gz) {
  if (gameOver) return;
  var cell = grid[gx][gy][gz];

  if (cell.state === 1 && cell.value > 0) {
    var f = countFlags(gx, gy, gz);
    if (f === cell.value) {
      var hitMine = false;
      forEachNeighbor(gx, gy, gz, function(a,b,c){ if (grid[a][b][c].state === 0 && grid[a][b][c].mine) hitMine = true; });
      forEachNeighbor(gx, gy, gz, function(a,b,c){ if (grid[a][b][c].state === 0) reveal(a,b,c); });
      if (hitMine) { loseSequential(); return; }
      if (checkWin()) { winGame(); return; }
      showToast('🔓 Neighbors opened');
    } else {
      showToast('🚩 Need ' + cell.value + ', have ' + f);
    }
    return;
  }

  if (cell.state !== 0) return;

  if (!started) {
    started = true;
    generateMines(gx, gy, gz);
    startTime = Date.now();
    timerInt = setInterval(function(){
      var sec = Math.floor((Date.now() - startTime) / 1000);
      document.getElementById('time').textContent = sec;
      if (sec > 0 && sec % 30 === 0 && sec !== lastWordTime) {
        lastWordTime = sec;
        showWordFor('TIME');
      }
    }, 250);
    showToast('⏱ Timer started');
    showWordFor('START');
  }

  if (cell.mine) { reveal(gx, gy, gz); loseSequential(); return; }
  reveal(gx, gy, gz);
  if (checkWin()) { winGame(); return; }
}

document.getElementById('prevLayer').addEventListener('click', function(){
  if (explosiveRunning) return;
  if (activeLayer > 0) {
    activeLayer--; updateLayerLabel(); renderBoard(); renderMinimap(); applyBoardStyle();
    showWordFor('LAYER');
  }
});
document.getElementById('nextLayer').addEventListener('click', function(){
  if (explosiveRunning) return;
  if (activeLayer < SIZE - 1) {
    activeLayer++; updateLayerLabel(); renderBoard(); renderMinimap(); applyBoardStyle();
    showWordFor('LAYER');
  }
});

document.getElementById('btnRestart').addEventListener('click', newGame);

var sizeButtons = document.querySelectorAll('button.size');
for (var i = 0; i < sizeButtons.length; i++) {
  (function (btn) {
    btn.addEventListener('click', function () {
      if (explosiveRunning) return;
      var newSize = parseInt(btn.getAttribute('data-size'), 10);
      if (started && !gameOver && !confirm('Change size? Game restarts.')) return;
      SIZE = newSize;
      for (var k = 0; k < sizeButtons.length; k++) sizeButtons[k].className = 'size';
      btn.className = 'size active';
      newGame();
    });
  })(sizeButtons[i]);
}

function renderNotebook() {
  nbList.innerHTML = '';
  notebookWords.forEach(function(entry, idx){
    var row = document.createElement('div');
    row.className = 'nb-row';

    var sel = document.createElement('select');
    Object.keys(TRIGGERS).forEach(function(k){
      var opt = document.createElement('option');
      opt.value = k;
      opt.textContent = TRIGGERS[k];
      if (k === entry.trigger) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', function(){
      notebookWords[idx].trigger = sel.value;
      saveNotebook(notebookWords);
    });

    var inp = document.createElement('input');
    inp.type = 'text';
    inp.value = entry.word;
    inp.placeholder = 'word…';
    inp.maxLength = 24;
    inp.addEventListener('input', function(){
      notebookWords[idx].word = inp.value;
      saveNotebook(notebookWords);
    });

    var del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.addEventListener('click', function(){
      notebookWords.splice(idx, 1);
      saveNotebook(notebookWords);
      renderNotebook();
    });

    row.appendChild(sel);
    row.appendChild(inp);
    row.appendChild(del);
    nbList.appendChild(row);
  });
}

document.getElementById('nbAdd').addEventListener('click', function(){
  notebookWords.push({ word: '', trigger: 'START' });
  saveNotebook(notebookWords);
  renderNotebook();
});

document.getElementById('nbReset').addEventListener('click', function(){
  if (!confirm('Reset to default words?')) return;
  notebookWords = DEFAULT_WORDS.slice();
  saveNotebook(notebookWords);
  renderNotebook();
});

document.getElementById('nbClose').addEventListener('click', function(){
  notebook.classList.remove('show');
});

document.getElementById('btnNotebook').addEventListener('click', function(){
  renderNotebook();
  notebook.classList.add('show');
});

window.addEventListener('resize', applyBoardStyle);

// ===== PWA: Register Service Worker =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(function(reg) {
        console.log('[PWA] SW registered:', reg.scope);
      })
      .catch(function(err) {
        console.warn('[PWA] SW registration failed:', err);
      });
  });
}

if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
  document.body.classList.add('pwa-standalone');
}

newGame();
</script>
