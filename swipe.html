<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Swipe</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --fg:#f2f2f2; --me:#7dd3fc;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{
  width:100%;height:100%;background:var(--bg);color:var(--fg);
  overflow:hidden;font-family:'JetBrains Mono','Fira Code',monospace;
}

#scroller{
  position:fixed;inset:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
}
#scroller::-webkit-scrollbar{display:none}

#stage{position:relative;width:100%;min-height:100%}

.ch{
  position:absolute;
  font-family:'JetBrains Mono','Fira Code',monospace;
  font-size:clamp(18px,4.5vw,26px);
  line-height:1;
  white-space:pre;
  pointer-events:none;user-select:none;
  transform-origin:50% 50%;
  color:var(--me);
  text-shadow:0 0 8px rgba(125,211,252,.35);
}
</style>
</head>
<body>

<div id="scroller"><div id="stage"></div></div>

<script>
/* =========================================================
   ТЕКСТ — массив предложений
   ========================================================= */
const LANG = (navigator.language || 'en').toLowerCase().startsWith('ru') ? 'ru' : 'en';

const MY_TEXT = {
  ru: [
    'Мы не знаем точно, когда родились...',
    'Мы информированы...',
    'Нам дали имя и научили жить...',
    'Пока мы учимся, мы продолжаем жить...',
    'Мы создаем время событиями...',
    'Супер-интеллект хороший собеседник и помощник...',
    'Однако для создания реальности нам нужен настоящий партнёр: наставник, ученик...',
    'Музыка, кино, дизайн, эстетика, строительство, искусство, инвестиции, йога, код...',
    'Мы эволюционируем благодаря вниманию...',
    'От наскальных рисунков через виртуальную реальность внимание нацелено в гиперпространство будущего...',
    'Я строю веб-терминалы с вашим логотипом, которые оживают и приносят радость...',
    'Я знаю, что, логотип или веб-терминал, который сделал для вас кто-то другой, уже эффективнее вдвойне...',
    'Что ты думаешь об этом?...',
    'Нравится ли тебе то, что происходит?..',
    'Хочешь продолжить игру воображения?..',
    'Найди меня по этому Telegram-адресу @eugenebox, если захочешь поделиться своими наблюдениями, мыслями, идеями... ',
  ],
  en: [
    'We don\'t actually know when we were born...',
    'We were informed...',
    'We were given a name and taught how to live...',
    'While we learn, we continue to live...',
    'We create time through events...',
    'A superintelligence is a good conversationalist and assistant...',
    'However, to create reality, we need a genuine partner: a mentor, a student...',
    'Music, cinema, design, aesthetics, construction, art, investments, yoga, code...',
    'We evolve through attention...',
    'From cave paintings to virtual reality, attention is now directed toward the hyperspace of the future...',
    'I build web terminals that come alive, make you happy, and wear your logo...',
    'I know that a logo or web terminal made by someone else is already twice as effective...',
    'What do you think about this?..',
    'Do you like what is happening?..',
    'Would you like to continue the imagination game?..',
    'Find me at this Telegram address: @eugenebox, if you’d like to share your observations, thoughts, ideas...', ]
};

const sentences = MY_TEXT[LANG];
const fullText = sentences.join('\n');

/* =========================================================
   Метрики
   ========================================================= */
const stage = document.getElementById('stage');
const scroller = document.getElementById('scroller');

const measure = document.createElement('span');
measure.style.cssText =
  'position:absolute;visibility:hidden;' +
  'font-family:"JetBrains Mono",monospace;' +
  'font-size:clamp(18px,4.5vw,26px);line-height:1;white-space:pre;';
measure.textContent = 'M';
document.body.appendChild(measure);

let charW = 0, lineH = 0;
const marginX = 20, marginY = 20;

function recalcMetrics(){
  charW = measure.getBoundingClientRect().width;
  const fs = parseFloat(getComputedStyle(measure).fontSize);
  lineH = fs * 1.45;
}
recalcMetrics();
window.addEventListener('resize', recalcMetrics);

/* =========================================================
   Раскладка
   ========================================================= */
let myCursor = 0;         // текущая позиция в fullText
const TOP_OFFSET = 80;   // ← сколько пикселей отступить сверху
let cursorY = marginY + TOP_OFFSET;let currentLine = [];
let currentLineWidth = 0;

function maxLineWidth(){ return window.innerWidth - marginX*2; }

function layoutCurrentLine(){
  let visibleLen = currentLine.length;
  while (visibleLen > 0 && currentLine[visibleLen-1].ch === ' ') visibleLen--;
  if (visibleLen === 0) return;
  const totalW = visibleLen * charW;
  const startX = (window.innerWidth - totalW) / 2;
  for (let i = 0; i < currentLine.length; i++){
    const e = currentLine[i];
    if (e.el) e.el.style.left = (startX + i*charW) + 'px';
  }
}

function wrapLine(){
  let breakIdx = -1;
  for (let i = currentLine.length - 1; i >= 0; i--){
    if (currentLine[i].ch === ' '){ breakIdx = i; break; }
  }
  let carry;
  if (breakIdx >= 0){
    carry = currentLine.splice(breakIdx + 1);
    currentLine.splice(breakIdx, 1);
  } else {
    carry = currentLine.splice(currentLine.length - 1);
  }
  layoutCurrentLine();
  currentLine = [];
  currentLineWidth = 0;
  cursorY += lineH;

  for (const item of carry){
    if (item.el){
      item.el.style.top = cursorY + 'px';
      item.el.style.left = (marginX + currentLine.length * charW) + 'px';
    }
    currentLine.push(item);
    currentLineWidth += charW;
  }
  layoutCurrentLine();
}

function forceNewline(){
  layoutCurrentLine();
  currentLine = [];
  currentLineWidth = 0;
  cursorY += lineH;
  updateStageHeight();
}

function updateStageHeight(){
  const needed = cursorY + lineH + 80;
  stage.style.height = Math.max(window.innerHeight, needed) + 'px';
}

/* =========================================================
   Оборот буквы
   ========================================================= */
function spin(el){
  const DUR = 600;
  const start = performance.now();
  function frame(now){
    const t = Math.min(1, (now - start) / DUR);
    const eased = 1 - Math.pow(1 - t, 3);
    el.style.transform = `rotate(${eased * Math.PI * 2}rad)`;
    if (t < 1) requestAnimationFrame(frame);
    else el.style.transform = 'rotate(0rad)';
  }
  requestAnimationFrame(frame);
}

/* =========================================================
   Добавление символа
   ========================================================= */
function addChar(ch, animateSpin){
  if (ch === '\n'){
    forceNewline();
    autoScroll();
    return;
  }

  if (currentLineWidth + charW > maxLineWidth() && currentLine.length > 0){
    wrapLine();
  }
  if (ch === ' '){
    currentLine.push({el:null, ch:' '});
    currentLineWidth += charW;
    layoutCurrentLine();
    updateStageHeight();
    autoScroll();
    return;
  }
  const el = document.createElement('span');
  el.className = 'ch';
  el.textContent = ch;
  el.style.top = cursorY + 'px';
  stage.appendChild(el);
  const entry = {el, ch};
  currentLine.push(entry);
  layoutCurrentLine();
  if (animateSpin) spin(el);
  else el.style.transform = 'rotate(0rad)';
  currentLineWidth += charW;
  updateStageHeight();
  autoScroll();
}

/* =========================================================
   Печать одного предложения
   ========================================================= */
let printing = false; // true, пока идёт печать предложения

function printSentence(){
  if (printing) return;
  if (myCursor >= fullText.length) return;

  printing = true;

  // ищем конец текущего предложения в fullText
  let end = fullText.indexOf('\n', myCursor);
  if (end === -1) end = fullText.length;

  // печатаем по одному символу
  function step(){
    if (myCursor >= end){
      if (myCursor < fullText.length && fullText[myCursor] === '\n'){
        myCursor++;
        addChar('\n', false);
      }
      printing = false;
      return;
    }
    const ch = fullText[myCursor++];
    addChar(ch, true);
    requestAnimationFrame(step);
  }
  step();
}

/* =========================================================
   Палец → печать
   ========================================================= */
const STEP_PX = 18;
let lastX = null, lastY = null;
let gestureMode = null;
let startClientX = 0, startClientY = 0;

function stagePoint(e){
  const t = e.touches ? e.touches[0] : e;
  const r = stage.getBoundingClientRect();
  return { x: t.clientX - r.left, y: t.clientY - r.top, cx: t.clientX, cy: t.clientY };
}

function moveTo(x, y){
  if (lastX === null){
    lastX = x; lastY = y;
    printSentence(); // первый свайп — печатаем одно предложение
    return;
  }

  let dx = x - lastX, dy = y - lastY, d = Math.hypot(dx, dy);
  while (d >= STEP_PX){
    const t = STEP_PX / d;
    lastX += dx * t; lastY += dy * t;
    dx = x - lastX; dy = y - lastY; d = Math.hypot(dx, dy);

    // проверяем, что ещё можно напечатать следующее предложение —
    // но НЕ печатаем его в этом же жесте
    if (myCursor >= fullText.length) break;
  }
}

stage.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  const p = stagePoint(e);
  gestureMode = null;
  startClientX = p.cx; startClientY = p.cy;
  lastX = null; lastY = null;
}, { passive: true });

stage.addEventListener('touchmove', (e) => {
  if (e.touches.length !== 1) return;
  const p = stagePoint(e);
  const dx = p.cx - startClientX;
  const dy = p.cy - startClientY;

  if (gestureMode === null){
    if (Math.hypot(dx, dy) < 8) return;
    gestureMode = Math.abs(dy) > Math.abs(dx) * 1.4 ? 'scroll' : 'draw';
  }
  if (gestureMode === 'scroll'){
    lastX = null; lastY = null;
    return;
  }
  e.preventDefault();
  moveTo(p.x, p.y);
}, { passive: false });

stage.addEventListener('touchend', () => {
  gestureMode = null; lastX = null; lastY = null;
}, { passive: true });
stage.addEventListener('touchcancel', () => {
  gestureMode = null; lastX = null; lastY = null;
}, { passive: true });

stage.addEventListener('mousedown', (e) => {
  const p = stagePoint(e);
  lastX = p.x; lastY = p.y;
  printSentence();
});
stage.addEventListener('mousemove', (e) => {
  if (!e.buttons) return;
  const p = stagePoint(e);
  moveTo(p.x, p.y);
});
window.addEventListener('mouseup', () => { lastX = null; lastY = null; });

/* =========================================================
   Автоскролл
   ========================================================= */
let userScrolling = false;
let userScrollTimer = null;
scroller.addEventListener('scroll', () => {
  userScrolling = true;
  clearTimeout(userScrollTimer);
  userScrollTimer = setTimeout(() => { userScrolling = false; }, 500);
}, { passive: true });

function autoScroll(){
  if (userScrolling) return;
  const bottom = cursorY + lineH + 40;
  const viewBottom = scroller.scrollTop + scroller.clientHeight;
  if (bottom > viewBottom){
    scroller.scrollTop = bottom - scroller.clientHeight + 40;
  }
}

/* =========================================================
   Init
   ========================================================= */
recalcMetrics();
updateStageHeight();
</script>
</body>
</html>
