<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest-match.json">

<title>Ranking | Local Edition</title>
<link rel="manifest" href="manifest-ranking.json">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
body { background-color: #000; color: #fff; max-width: 1200px; font-family: monospace; margin: 0; padding: 10px; box-sizing: border-box; }
#versus { width: 100%; margin: 2em 0; }
.versus-wrapper { display: flex; gap: 10px; justify-content: center; }
.versus_column { flex: 1; min-width: 0; cursor: pointer; }

.versus_thumbwrapper { 
    position: relative; 
    border: 3px solid #444; 
    background-color: #333; 
    aspect-ratio: 1/1; 
    box-sizing: border-box;
}
.versus_thumbwrapper img { 
    position: absolute;
    top: 0; left: 0;
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
}

.ranking-container { padding: 10px; margin-top: 10px;}
.ranking-title { font-family: monospace; font-size: 24px; text-transform: uppercase; text-align: center; border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 20px; }
.ranking-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #222; cursor: pointer; }
.ranking-img { width: 40px; height: 40px; object-fit: cover; margin-right: 12px; border: 1px solid #444; background: #222; }
.ranking-info { flex-grow: 1; display: flex; justify-content: space-between; align-items: center; }
.item-details { display: none; padding: 15px; background: #050505; border-bottom: 1px solid #222; font-size: 14px; color: #ccc; }
.external-link { 
color: #448aff; 
text-decoration: none; 
display: block; 
margin-top: 10px; 
font-weight: bold; }
.admin-panel { 
margin-bottom: 40px; 
padding: 20px; 

font-family: monospace;

background: #333; font-family: monospace; }
.admin-input { 
    width: 100%; 
    padding: 12px; 

    font-family: monospace;

    margin-bottom: 15px; 
    background: #000; 
    border: 1px solid #777; 
    font-size: 16px;
    color: #fff; 
    box-sizing: border-box; 
}

.edit-btn {
    background: #448aff;
    color: white;
    border: none;
    padding: 10px 15px;
    margin-top: 30px;
    margin-right: 10px;
    text-transform: uppercase; 
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
}
.edit-btn:hover { background: #2979ff; }

.delete-btn {
    background: #ff4444;
    color: white;
    border: none;
    padding: 10px 15px;
    margin-top: 30px;
    cursor: pointer;
    text-transform: uppercase; 
    font-size: 12px;
    font-weight: bold;
}
.delete-btn:hover { background: #cc0000; }

textarea.admin-input {
    font-family: monospace;
    height: 150px;
    resize: vertical;
}
#new-img-file { 
display: none; 
font-family: monospace;
}
.file-label {
    font-family: monospace;
    display: inline-block;
    padding: 12px;
    background: #000;
    color: #fff;
    text-align: left;
    box-sizing: border-box;
    cursor: pointer;
    margin: 5px 0 30px 0;
    border: 2px solid #fff;
}
.admin-btn { 
    width: 100%; 
    padding: 16px; 
    background: #fff; 
    font-family: monospace;
    color: #000; 
    border: none; 
    font-weight: bold; 
    cursor: pointer; 
    text-transform: uppercase; 
    font-size: 18px;
}
.main-header {
    text-align: left;
    padding: 20px 0 10px 0;
}
.main-header h1 {
    font-family: monospace;
    font-size: 18px;
    margin: 0;
    letter-spacing: 2px;
}
.main-header p {
    color: #888;
    font-size: 14px;
    margin-top: 5px;
}
#header-logo {
    width: 48px;
    height: 48px;
    flex-shrink: 0; /* Не дает флексу сжимать логотип */
    object-fit: contain;
}
</style>
</head>
<body>

<div style="display: flex; align-items: center; justify-content: flex-start; gap: 10px; margin-bottom: 5px;" class="main-header">
    <a href="index.html" id="header-link" style="display: flex; align-items: center;">
        <img src="logo.png" alt="Logo" id="header-logo">
    </a>
    <div style="display: flex; flex-direction: column; margin-top: 6px;">
        <h1 style="margin: 0; line-height: 1.2;">Made in Space</h1>
        <p style="margin: 0; color: #888;">Ranking version menu</p>
    </div>
</div>


<div id="versus">
    <div class="ranking-title">Pick Important</div>
    <div class="versus-wrapper">
        <div class="versus_column" id="item-left" onclick="vote('left')">
            <div class="versus_thumbwrapper"><img src="" alt=""></div>
            <h3 class="title" style="text-align:center"></h3>
        </div>
        <div class="versus_column" id="item-right" onclick="vote('right')">
            <div class="versus_thumbwrapper"><img src="" alt=""></div>
            <h3 class="title" style="text-align:center"></h3>
        </div>
    </div>
</div>
<div class="ranking-container">
    <div class="ranking-title">Local Ranking</div>
    <div id="ranking-list"></div>
</div>
<div class="admin-panel">
    <input type="text" id="new-title" class="admin-input" placeholder="Title">
    <textarea id="new-desc" class="admin-input" placeholder="Description"></textarea>
    <input type="url" id="new-url" class="admin-input" placeholder="External URL (optional)">
    <label for="new-img-file" class="file-label" id="file-label-text">Choose image file</label>
    <input type="file" id="new-img-file" accept="image/*" onchange="updateLabel(this)">
    <button class="admin-btn" onclick="saveOrAddItem()">Add Item</button>
</div>


<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.error('SW_REG_FAIL', err));
  });
}

const defaultItems = [
{ 
        id: 1, 
        title: "Market", 
        description: `Tech Stack & Concept: High-performance crypto-trading dashboard processing binary and futures real-time market data utilizing Chart.js, Web Workers, WebSockets, and the Binance API.

Key Features:
- Multithreaded Data Processing (Web Workers): Offloading heavy mathematical calculations, oscillator computations (RSI-14, 34-period Bollinger Bands), and custom 34/38 Parrots indicators to background threads.
- Multi-Timeframe Integration: Simultaneous connection to real-time streams across 8 timeframes (1m to 1M) for multiple trading pairs to calculate overall market momentum (Pair Global Time Force and Market Global Force).
- Divergence & Funding Rate Tracking: Automatic detection and visual mapping of price, RSI, and volume divergences, accompanied by a module tracking real-time and historical futures funding rates.
- Custom UI & Cross-Chart Synchronization: Unified zoom/scroll synchronization across price, pair percentage comparison, and funding rate charts, featuring interactive crosshairs and an adaptive live signal log.`, 
        externalUrl: "market.html", 
        img: "market-v8.png", 
        rating: 1500 
    },{ 
        id: 2, 
        title: "Flash", 
        description: `Tech Stack & Concept: Client-side PWA (Progressive Web App) designed for speed reading using Rapid Serial Visual Presentation (RSVP).

Key Features:
- Smart Dynamic Text Parsing: An automated engine that adapts frame delay (word display timing) based on punctuation marks (additional pauses for commas, periods, dashes) and word length.
- Dynamic Acceleration: A custom algorithm that smoothly increases and adjusts reading speed following the golden ratio (ϕ ≈ 0.618) toward the end of the text.
- Adaptive Interface: Automatic font size adjustment tailored to the device's physical screen width, CSS animation synchronization (Z-axis, blur, fade) aligned with JS timers, and integration of the Screen Wake Lock API to keep the display active.
- File Import & Themes: Support for loading local .txt files, instant custom click-to-invert color themes, and complete offline availability.`, 
        externalUrl: "flash.html", 
        img: "flash-blur.png", 
        rating: 1500 
    },    { id: 3, title: "Spark", description: "Plain sketch", externalUrl: "spark.html", img: "spark.png", rating: 1500 },
{ 
        id: 4, 
        title: "Cross", 
        description: `Tech Stack & Concept: Interactive PWA featuring a 4-section (2x2) flexible grid layout designed for concurrent text and image editing.

Key Features:
- Interactive Crosshair Controller: Smooth drag-and-drop central controller allowing dynamic, proportional resizing of all four editing quadrants simultaneously.
- Dynamic Style Generation: Support for custom color schemes, dynamic font switching, and customizable visual themes.
- Rich Text & Media Blocks: Instant insertion, preview, and formatting of text and media within each interactive contenteditable container.
- Mobile Optimization: Full touch-event support (touch-action: none/auto), responsive layouts, and PWA manifest integration for seamless mobile installation.`, 
        externalUrl: "cross.html", 
        img: "cross.png", 
        rating: 1500 
    },    { id: 5, title: "Lexis", description: "Plain sketch", externalUrl: "lexis.html", img: "lexis.png", rating: 1500 },
    { id: 6, title: "Matrix", description: "Plain sketch", externalUrl: "matrix.html", img: "matrix-v5.png", rating: 1500 },
{ 
        id: 7, 
        title: "Breakthrough", 
        description: `Tech Stack & Concept: P2P decentralized meme ranking and evaluation platform built on a direct device-to-device network architecture via lightweight brokers, bypassing central servers entirely.

Core Philosophy & Concept:
- Privacy First by Default: No central server stores user data. The system operates as both a personal catalog and a public leader-board. Content remains completely private until connected peers are online.
- Peer-Driven Network Activation: Operating on a fully decentralized structure supported by real-time online participants, the local resonance matrix activates when sharing direct access links with peers.

Key Features:
- Pairwise Elo Battle Engine: Head-to-head meme comparisons powered by the Elo rating system to evaluate content resonance, promote top-tier posts, and convert accumulated Impact into app features.
- Direct Vector Transfer & Safety: Zero mandatory registrations, passwords, or personal data tracking. Users retain full control over their visual vectors and transmit impulses directly to connected participants.
- Zero Friction UX: Instant setup allowing users to drop visual vectors, share direct links with targeted peers, and test content impact across the network.`, 
        externalUrl: "breakthrough.html", 
        img: "breakthrough.png", 
        rating: 1500 
    },    { id: 8, title: "Beta", description: "Plain sketch", externalUrl: "beta.html", img: "beta.png", rating: 1500 },
    { id: 9, title: "Demo", description: "Plain sketch", externalUrl: "demo.html", img: "demo.png", rating: 1500 },
    { id: 10, title: "Book", description: "Plain sketch", externalUrl: "book.html", img: "book.png", rating: 1500 },
    { id: 11, title: "Clock", description: "Plain sketch", externalUrl: "clock.html", img: "clock.png", rating: 1500 },
    { id: 12, title: "Planet", description: "Space sketch", externalUrl: "planet.html", img: "planet.png", rating: 1500 },
{ 
        id: 13, 
        title: "Life", 
        description: `Imagine a world where the landscape doesn’t sink below the horizon but rises above you, closing into a massive dome overhead: standing in London, you could look straight up and see Australia, other continents, oceans, and cities. Everything on the planet is visible through a telescope because you are inside a sphere, and gravity points outward.

Since existing visual tools couldn’t capture this specific concave geometry properly, the project was built from scratch using JavaScript.

Current Features:
The project is currently a live web-based physics and environment simulation:
- Inverted Sphere Physics: A fully functional concave world with gravity directed from the center outward. The thrust direction is completely independent.
- Cross-Platform Controls: Implemented for both desktop and mobile (touchscreen split into thrust and steering zones).
- VR Support: A dedicated version for Oculus VR headsets is available via the butterfly logo menu at the bottom of the screen.

Live Demo Controls:
- Desktop: Arrow keys – Movement | Single/Double tap Space – Thrust control
- Mobile: Left half of screen – Thrust | Right half of screen – Steering`, 
        externalUrl: "life.html", 
        img: "quaternion.PNG", 
        rating: 1500 
    },    { id: 14, title: "Loop", description: "Space sketch", externalUrl: "loop.html", img: "loop.png", rating: 1500 },
    { id: 15, title: "Pentax", description: "Space sketch", externalUrl: "pentax.html", img: "pentax.png", rating: 1500 },
    { id: 16, title: "Oculus", description: "Space sketch", externalUrl: "oculus.html", img: "oculus.png", rating: 1500 },
    { id: 17, title: "Syntax", description: "Space sketch", externalUrl: "syntax.html", img: "syntax.png", rating: 1500 },
    { id: 18, title: "Cube", description: "Space sketch", externalUrl: "cube.html", img: "cube.png", rating: 1500 },
    { id: 19, title: "Peer", description: "Space sketch", externalUrl: "peer.html", img: "peer.png", rating: 1500 },
    { id: 20, title: "Watch", description: "Space sketch", externalUrl: "watch.html", img: "watch.png", rating: 1500 },
];

let items = defaultItems;
localStorage.setItem('versus_items', JSON.stringify(items));

let currentPair = [];
let editingId = null;

function editItem(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;

    $('#new-title').val(item.title);
    $('#new-desc').val(item.description);
    $('#new-url').val(item.externalUrl);
    $('#file-label-text').text("Keep current image or choose new");

    editingId = id;
    $('.admin-btn').text('Save Changes');
    $('.admin-panel')[0].scrollIntoView({ behavior: 'smooth' });
}

async function saveOrAddItem() {
    const title = $('#new-title').val().trim();
    const desc = $('#new-desc').val().trim();
    const url = $('#new-url').val().trim();
    const file = $('#new-img-file')[0].files[0];

    if (!title) return;

    let imgData = "";
    if (editingId !== null) {
        const item = items.find(i => i.id === editingId);
        if (item) {
            item.title = title;
            item.description = desc;
            item.externalUrl = url;
            if (file) {
                item.img = await compressImage(file);
            }
        }
        editingId = null;
        $('.admin-btn').text('Add Item');
    } else {
        if (file) {
            imgData = await compressImage(file);
        }
        items.push({ id: Date.now(), title, description: desc, externalUrl: url, img: imgData, rating: 1500 });
    }

    save();
    
    $('#new-title, #new-desc, #new-url, #new-img-file').val('');
    $('#file-label-text').text("Choose image file");
    
    if (items.length >= 2 && currentPair.length === 0) nextPair();
}

function updateLabel(input) {
    const fileName = input.files[0] ? input.files[0].name : "Choose image file";
    document.getElementById('file-label-text').innerText = fileName;
}

function save() {
    localStorage.setItem('versus_items', JSON.stringify(items));
    updateRankingList();
}

async function compressImage(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const maxWidth = 800;
                let width = img.width, height = img.height;
                if (width > maxWidth) { height = (maxWidth / width) * height; width = maxWidth; }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.8));
            };
        };
    });
}

function toggleDetails(id) { $(`#details-${id}`).slideToggle(200); }

function updateRankingList() {
    const sorted = [...items].sort((a, b) => b.rating - a.rating);
    let html = '';
    sorted.forEach((item, index) => {
        const imgTag = item.img ? `<img src="${item.img}" class="ranking-img">` : `<div class="ranking-img" style="display:inline-block;"></div>`;
        html += `<div class="ranking-item" onclick="toggleDetails('${item.id}')">
            ${imgTag}
            <div class="ranking-info"><span>${index + 1}. ${item.title}</span><strong>${Math.round(item.rating)}</strong></div>
        </div>
        <div id="details-${item.id}" class="item-details">
            <p>${item.description || 'No description.'}</p>
            ${item.externalUrl ? `<a href="${item.externalUrl}" target="_blank" class="external-link">Visit Link →</a>` : ''}
            <button class="edit-btn" onclick="event.stopPropagation(); editItem(${item.id})">Edit Item</button>
            <button class="delete-btn" onclick="event.stopPropagation(); deleteItem(${item.id})">Delete Item</button>
        </div>`;
    });
    $('#ranking-list').html(html);
}

function nextPair() {
    if (items.length < 2) return;
    let i1 = Math.floor(Math.random() * items.length), i2;
    do { i2 = Math.floor(Math.random() * items.length); } while (i1 === i2);
    currentPair = [i1, i2];
    
    if (items[i1].img) {
        $('#item-left img').attr('src', items[i1].img).show();
    } else {
        $('#item-left img').attr('src', '').hide();
    }
    $('#item-left .title').text(items[i1].title);

    if (items[i2].img) {
        $('#item-right img').attr('src', items[i2].img).show();
    } else {
        $('#item-right img').attr('src', '').hide();
    }
    $('#item-right .title').text(items[i2].title);
}

function vote(side) {
    if (items.length < 2) return;
    const winIdx = side === 'left' ? currentPair[0] : currentPair[1];
    const loseIdx = side === 'left' ? currentPair[1] : currentPair[0];
    const rW = items[winIdx].rating, rL = items[loseIdx].rating;
    const expW = 1 / (1 + Math.pow(10, (rL - rW) / 400));
    const change = 32 * (1 - expW);
    items[winIdx].rating += change; items[loseIdx].rating -= change;
    save();
    $('#versus').animate({ opacity: 0 }, 100, function() { nextPair(); $(this).animate({ opacity: 1 }, 100); });
}

function deleteItem(id) {
    if (confirm("Вы уверены, что хотите удалить этот элемент?")) {
        items = items.filter(item => item.id !== id);
        save();
        if (items.length < 2) {
            currentPair = [];
            $('#item-left img, #item-right img').attr('src', '');
            $('#item-left .title, #item-right .title').text('');
        } else {
            nextPair();
        }
    }
}

updateRankingList();
nextPair();
</script>
</body>
</html>
