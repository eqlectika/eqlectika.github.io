<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="manifest-fields.json" />
    <title>Fields</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
        }


        .panels {
            display: flex;
            width: 100vw;
            height: 100vh;
            background: #1e1e1e;
            overflow: hidden;
        }

        .panel {
            flex: 1 1 0;
            min-width: 80px;
            width: 0;
            background: white;
            position: relative;
            overflow: hidden;
        }

        .panel iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }


        .resizer {
            width: 6px;
            min-width: 6px;
            flex: 0 0 6px;
            background: #1e1e1e;
            cursor: col-resize;
            position: relative;
            z-index: 10;
            touch-action: none;
        }

        .resizer::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: -6px;
            right: -6px;
        }

        .resizer:hover,
        .resizer.active {
            background: #3b82f6;
        }


        body.is-resizing {
            user-select: none;
            cursor: col-resize !important;
        }

        body.is-resizing iframe {
            pointer-events: none;
        }


        @media (max-width: 768px) {
            .panels {
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                scroll-snap-type: x mandatory;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }

            .panels::-webkit-scrollbar {
                display: none;
            }

            .panel {
                flex: 0 0 100vw;
                width: 100vw;
                min-width: 100vw;
                height: 100vh;
                scroll-snap-align: start;
                background: white;
            }

            .resizer {
                display: none;
            }


            .dots {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 8px;
                z-index: 100;
                background: rgba(0, 0, 0, 0.6);
                padding: 8px 14px;
                border-radius: 30px;
                backdrop-filter: blur(8px);
            }

            .dots button {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                border: none;
                background: rgba(255, 255, 255, 0.3);
                cursor: pointer;
                padding: 0;
                transition:
                    background 0.2s ease,
                    transform 0.2s ease;
                flex-shrink: 0;
            }

            .dots button.active {
                background: white;
                transform: scale(1.3);
            }

            .dots button:hover {
                background: rgba(255, 255, 255, 0.6);
            }
        }


        .dots {
            display: none;
        }

        @media (min-width: 769px) {
            .dots {
                display: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="panels" id="panels"></div>

    <div class="dots" id="dots"></div>

    <script>

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('✅ Service Worker зарегистрирован:', registration);
                })
                .catch(error => {
                    console.log('❌ Ошибка регистрации SW:', error);
                });
        }


        const pages = [
            'match.html',
            'index.html',
            'capital.html',
            'flash.html',
            'cross.html'
        ];

        const panelsContainer = document.getElementById('panels');
        const dotsContainer = document.getElementById('dots');


        pages.forEach(page => {
            const panel = document.createElement('div');
            panel.className = 'panel';

            const iframe = document.createElement('iframe');
            iframe.src = page;
            iframe.loading = 'lazy';

            panel.appendChild(iframe);
            panelsContainer.appendChild(panel);
        });

        const panels = Array.from(
            document.querySelectorAll('.panel')
        );

        const isMobile = window.innerWidth <= 768;


        if (!isMobile) {


            panels.forEach((panel, index) => {

                if (index >= panels.length - 1) {
                    return;
                }

                const resizer = document.createElement('div');
                resizer.className = 'resizer';

                panelsContainer.insertBefore(
                    resizer,
                    panel.nextSibling
                );
            });

            const resizers = Array.from(
                document.querySelectorAll('.resizer')
            );


            function initializePanelWidths() {

                const availableWidth =
                    panelsContainer.clientWidth -
                    (resizers.length * 6);

                const width =
                    availableWidth / panels.length;

                panels.forEach(panel => {
                    panel.style.flex = '0 0 auto';
                    panel.style.width = `${width}px`;
                });
            }

            initializePanelWidths();


            resizers.forEach((resizer, resizerIndex) => {

                let isResizing = false;

                let startX = 0;

                let startPrevWidth = 0;
                let startNextWidth = 0;

                let prevPanel = null;
                let nextPanel = null;

                let animationFrame = null;
                let pendingX = null;


                prevPanel = panels[resizerIndex];
                nextPanel = panels[resizerIndex + 1];

                if (!prevPanel || !nextPanel) {
                    return;
                }


                function startResize(e) {

                    e.preventDefault();

                    isResizing = true;

                    startX = e.clientX;

                    startPrevWidth =
                        prevPanel.getBoundingClientRect().width;

                    startNextWidth =
                        nextPanel.getBoundingClientRect().width;

                    resizer.classList.add('active');
                    document.body.classList.add('is-resizing');

                    resizer.setPointerCapture?.(e.pointerId);
                }


                function moveResize(e) {

                    if (!isResizing) {
                        return;
                    }

                    pendingX = e.clientX;


                    if (animationFrame !== null) {
                        return;
                    }

                    animationFrame = requestAnimationFrame(() => {

                        animationFrame = null;

                        if (!isResizing || pendingX === null) {
                            return;
                        }

                        const delta =
                            pendingX - startX;

                        const minWidth = 80;


                        let newPrevWidth =
                            startPrevWidth + delta;


                        newPrevWidth =
                            Math.max(
                                minWidth,
                                newPrevWidth
                            );


                        const maxPrevWidth =
                            startPrevWidth +
                            startNextWidth -
                            minWidth;

                        newPrevWidth =
                            Math.min(
                                maxPrevWidth,
                                newPrevWidth
                            );


                        const newNextWidth =
                            startPrevWidth +
                            startNextWidth -
                            newPrevWidth;


                        prevPanel.style.width =
                            `${newPrevWidth}px`;

                        nextPanel.style.width =
                            `${newNextWidth}px`;
                    });
                }


                function stopResize(e) {

                    if (!isResizing) {
                        return;
                    }

                    isResizing = false;

                    if (animationFrame !== null) {
                        cancelAnimationFrame(animationFrame);
                        animationFrame = null;
                    }

                    pendingX = null;

                    resizer.classList.remove('active');
                    document.body.classList.remove('is-resizing');

                    try {
                        resizer.releasePointerCapture?.(
                            e.pointerId
                        );
                    } catch (_) {}
                }


                resizer.addEventListener(
                    'pointerdown',
                    startResize
                );

                resizer.addEventListener(
                    'pointermove',
                    moveResize
                );

                resizer.addEventListener(
                    'pointerup',
                    stopResize
                );

                resizer.addEventListener(
                    'pointercancel',
                    stopResize
                );

                resizer.addEventListener(
                    'lostpointercapture',
                    stopResize
                );
            });


            let resizeTimer = null;

            window.addEventListener('resize', () => {

                clearTimeout(resizeTimer);

                resizeTimer = setTimeout(() => {

                    if (!document.body.classList.contains('is-resizing')) {
                        initializePanelWidths();
                    }

                }, 100);
            });
        }


        if (isMobile) {

            dotsContainer.style.display = 'flex';

            pages.forEach((_, index) => {

                const dot =
                    document.createElement('button');

                dot.dataset.index = index;

                if (index === 0) {
                    dot.classList.add('active');
                }

                dot.addEventListener('click', () => {

                    const panel = panels[index];

                    panel.scrollIntoView({
                        behavior: 'smooth',
                        block: 'nearest',
                        inline: 'start'
                    });
                });

                dotsContainer.appendChild(dot);
            });


            const observer =
                new IntersectionObserver(
                    entries => {

                        entries.forEach(entry => {

                            if (!entry.isIntersecting) {
                                return;
                            }

                            const index =
                                panels.indexOf(entry.target);

                            if (index === -1) {
                                return;
                            }

                            document
                                .querySelectorAll('.dots button')
                                .forEach((dot, i) => {
                                    dot.classList.toggle(
                                        'active',
                                        i === index
                                    );
                                });
                        });
                    },
                    {
                        root: panelsContainer,
                        threshold: 0.6
                    }
                );

            panels.forEach(panel => {
                observer.observe(panel);
            });
        }
    </script>

</body>
</html>
