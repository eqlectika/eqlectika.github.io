<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tap & Swipe · Map of the words</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<style>
:root{
  --bg:#000; --fg:#f2f2f2;
  --me:#7dd3fc; --user:#afff00;
  --accent:#ff5700;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{
  width:100%;height:100%;background:var(--bg);color:var(--fg);
  overflow:hidden;font-family:'JetBrains Mono','Fira Code',monospace;
}

/* ---------- шапка ---------- */
.top-bar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;
  padding:6px 8px;background:#000;
  font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:16px;color:#aaa;
  border-bottom:1px solid #1a1a1a;
}
.top-bar .left{
  display:flex;align-items:center;gap:8px;
  min-width:0;flex-shrink:1;overflow:hidden;
}
.top-bar .right{
  display:flex;align-items:center;gap:8px;
  flex-shrink:0;
}
.top-bar .brand{
  color:var(--accent);
  white-space:nowrap;
  text-decoration:none;
}
.top-bar .brand:hover{ text-decoration:underline; }
.top-bar .brand:visited{ color:var(--accent); }
.top-bar .live{color:#f00;animation:livePulse 1.5s infinite;white-space:nowrap}
.top-bar .tape{color:var(--user);white-space:nowrap}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.3}}

.btn-clear{
  background:transparent;border:1px solid #444;color:#aaa;
  font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:13px;
  padding:4px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;
}
.btn-clear:hover{border-color:#f00;color:#f00}

#peerIdInput{
  color:#0097ff;background:transparent;outline:none;
  font-family:monospace;font-size:14px;text-align:right;
  width:90px;padding:3px 6px;border:1px solid transparent;border-radius:6px;
  user-select:text;-webkit-user-select:text;cursor:text;
  transition:background .2s,color .2s,border-color .2s;
}
#peerIdInput::placeholder{color:#444}
#peerIdInput:focus{background:#111;color:#fff;border-color:#3d1a99}
#peerIdInput.saved{color:var(--user)!important;border-color:var(--user)!important}

/* ---------- скролл ---------- */
#scroller{
  position:fixed;left:0;right:0;
  top:44px;bottom:64px;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  z-index:1;
  touch-action:pan-y;
}
#scroller::-webkit-scrollbar{display:none}

#stage{position:relative;width:100%;min-height:100%}

/* ---------- буквы ---------- */
.ch{
  position:absolute;
  font-family:'JetBrains Mono','Fira Code',monospace;
  font-size:clamp(18px,4.5vw,26px);
  line-height:1;
  white-space:pre;
  pointer-events:none;user-select:none;
  transform-origin:50% 50%;
}
.ch.mine{color:var(--me);text-shadow:0 0 8px rgba(125,211,252,.35)}
.ch.user{color:var(--user);text-shadow:0 0 8px rgba(175,255,0,.35)}

/* ---------- подвал ---------- */
.footer-panel{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:#000;border-top:1px solid #1a1a1a;
}
#word-input{
  width:100%;max-width:600px;padding:10px 12px;
  font-family:'JetBrains Mono',monospace;font-size:16px;
  border:1px solid #444;border-radius:10px;
  background:linear-gradient(to bottom,#000,#0b1a2b);color:#fff;outline:none;
  user-select:text;-webkit-user-select:text;
}
#word-input::placeholder{color:#888}
#hint{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;
  font-size:clamp(16px,3.6vw,20px);
  line-height:1.4;
  color:#f2f2f2;
  font-family:'JetBrains Mono','Fira Code',monospace;
  text-shadow:0 0 10px rgba(0,0,0,.95);
  pointer-events:none;
  z-index:5;
  transition:opacity .6s ease;
  padding:0 16px;
  letter-spacing:.02em;
}
#hint.hidden{opacity:0}
</style>
</head>
<body>

<div class="top-bar">
  <div class="left">
<a class="brand" href="research.html">Tap &amp; Swipe</a>
    <span id="liveIndicator" class="live" style="display:none">Live! (<span id="livePeerCount">0</span>)</span>
    <span id="tapeIndicator" class="tape">Tape</span>
  </div>
  <div class="right">
    <button class="btn-clear" id="btnClear">Clear</button>
    <input type="text" id="peerIdInput" autocomplete="off" spellcheck="false"
           maxlength="9" placeholder="Your name">
  </div>
</div>
<div id="hint">Swipe here</div>
<div id="scroller"><div id="stage"></div></div>

<div class="footer-panel">
  <input type="text" id="word-input"
         autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false">
</div>

<script>
/* =========================================================
   0. ЯЗЫК + ТЕКСТ
   ========================================================= */
const LANG = (navigator.language || 'en').toLowerCase().startsWith('ru') ? 'ru' : 'en';

const PLACEHOLDER = {
  ru: 'Ответь и нажми Enter…',
  en: 'Reply and press Enter…'
}[LANG];

const MY_TEXT = {
  ru: [
    'Вот так просто можно теперь набирать то, что исходит из ниоткуда.',
    'Попробуй написать букву или какой-нибудь символ, чтобы продолжить.',
    'Мы не знаем точно, когда родились.',
    'Нам сообщили.',
    'Я строю веб-терминалы, которые оживают, приносят радость и носят твой логотип.',
    'И ещё: лучший логотип или веб-терминал, который кто-то сделает для тебя, уже вдвойне эффективен.',
    'А теперь скажи: как тебя зовут?',
    'Нравится ли тебе то, что происходит?',
    'Хочешь продолжить игру воображения?'
  ],
  en: [
    'We don\'t actually know when we were born...',
    'We were informed...',
    'Now you can come up with a name and type it in the top-right corner...',
    'I build web terminals that come alive, make you happy, and wear your logo...',
    'It seems that a logo or web terminal made by someone else is already twice as effective...',
    'Do you like what is happening?..',
    'Would you like to continue the imagination game?..',
    'Type your response in the field below and press Enter to send.'
  ]
};

const mySentences = MY_TEXT[LANG];
const myText = mySentences.join('\n');

/* =========================================================
   1. ХРАНИЛИЩЕ
   ========================================================= */
const store = {
  get(k, fb=null){ try{ const v=localStorage.getItem('st_'+k); return v===null?fb:JSON.parse(v);}catch(e){return fb;} },
  set(k, v){ try{ localStorage.setItem('st_'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('st_'+k); }catch(e){} }
};

let myId = store.get('peer_id', '');
if (!myId){ myId = 'Guest-' + Math.floor(1000+Math.random()*9000); store.set('peer_id', myId); }
const clientId = 'st_' + Math.random().toString(16).slice(2,10);

const peerIdInput = document.getElementById('peerIdInput');
peerIdInput.value = myId;

let myCursor = store.get('my_cursor', 0);
let userChars = store.get('user_chars', []);

function saveMyCursor(){ store.set('my_cursor', myCursor); }
function saveUserChars(){
  store.set('user_chars', userChars.map(u => ({ch:u.ch, author:u.author, printed:!!u.printed})));
}

let pending = store.get('pending', []);
function savePending(){ store.set('pending', pending); }
const applied = new Set(store.get('applied', []));
function saveApplied(){ store.set('applied', Array.from(applied).slice(-2000)); }

/* =========================================================
   2. MQTT
   ========================================================= */
const BROKER = 'wss://broker.emqx.io:8084/mqtt';
const TOPIC = 'breakthrough/words/v2';
let client = null;
let activePeers = {};
let isLive = false;

function connectMqtt(){
  try{
    client = mqtt.connect(BROKER, { clientId, reconnectPeriod:5000, connectTimeout:5000, keepalive:60 });
  }catch(e){ return; }

  client.on('connect', () => { client.subscribe(TOPIC,{qos:1}); startHB(); });
  client.on('close', () => { stopHB(); activePeers={}; updateChrome(); });
  client.on('offline', () => stopHB());

  client.on('message', (t, payload) => {
    let p; try{ p = JSON.parse(payload.toString()); }catch(e){ return; }
    if (p.sid === clientId) return;
    if (p.type === 'PING'){ activePeers[p.sender] = Date.now(); return; }
    if (p.type === 'TEXT_ADD'){
      if (p.editId && applied.has(p.editId)) return;
      if (p.editId){ applied.add(p.editId); saveApplied(); }
      appendUserText('\n' + p.text, p.author, true);
      if (client && client.connected){
        client.publish(TOPIC, JSON.stringify({
          type:'TEXT_ACK', editId:p.editId, sender:myId, sid:clientId
        }), {qos:1});
      }
      return;
    }
    if (p.type === 'TEXT_ACK'){
      if (p.editId){
        pending = pending.filter(e => e.editId !== p.editId);
        savePending(); updateChrome();
      }
    }
  });
}

let hbPing=null, hbPeers=null;
function startHB(){
  stopHB(); sendPing(); updatePeers();
  hbPing = setInterval(sendPing, 5000);
  hbPeers = setInterval(updatePeers, 3000);
}
function stopHB(){
  if (hbPing){clearInterval(hbPing);hbPing=null;}
  if (hbPeers){clearInterval(hbPeers);hbPeers=null;}
}
function sendPing(){
  if (client && client.connected)
    client.publish(TOPIC, JSON.stringify({type:'PING', sender:myId, sid:clientId}), {qos:0});
}
function updatePeers(){
  const now = Date.now();
  for (const id in activePeers) if (now-activePeers[id] > 12000) delete activePeers[id];
  isLive = Object.keys(activePeers).length > 0;
  updateChrome();
}
function flushPending(){
  if (!client || !client.connected || !pending.length) return;
  pending.slice().forEach(edit => {
    client.publish(TOPIC, JSON.stringify({
      ...edit, type:'TEXT_ADD', sender:myId, sid:clientId
    }), {qos:1});
  });
}

/* =========================================================
   3. UI Chrome
   ========================================================= */
const liveInd = document.getElementById('liveIndicator');
const tapeInd = document.getElementById('tapeIndicator');
const liveCount = document.getElementById('livePeerCount');

function updateChrome(){
  const n = Object.keys(activePeers).length;
  liveInd.style.display = isLive ? 'inline' : 'none';
  tapeInd.style.display = isLive ? 'none' : 'inline';
  liveCount.textContent = n;
}

/* =========================================================
   4. Метрики
   ========================================================= */
const stage = document.getElementById('stage');
const scroller = document.getElementById('scroller');

const measure = document.createElement('span');
measure.style.cssText =
  'position:absolute;visibility:hidden;' +
  'font-family:"JetBrains Mono",monospace;' +
  'font-size:clamp(18px,4.5vw,26px);line-height:1;white-space:pre;';
measure.textContent = 'M';
document.body.appendChild(measure);

let charW=0, lineH=0;
const marginX=20, marginY=20;

function recalcMetrics(){
  charW = measure.getBoundingClientRect().width;
  const fs = parseFloat(getComputedStyle(measure).fontSize);
  lineH = fs * 1.45;
}
recalcMetrics();
window.addEventListener('resize', recalcMetrics);

/* =========================================================
   5. Раскладка
   ========================================================= */
let cursorY = marginY;
let currentLine = [];
let currentLineWidth = 0;

function maxLineWidth(){ return window.innerWidth - marginX*2; }

function layoutCurrentLine(){
  let visibleLen = currentLine.length;
  while (visibleLen > 0 && currentLine[visibleLen-1].ch === ' ') visibleLen--;
  if (visibleLen === 0) return;
  const totalW = visibleLen * charW;
  const startX = (window.innerWidth - totalW) / 2;
  for (let i = 0; i < currentLine.length; i++){
    const e = currentLine[i];
    if (e.el) e.el.style.left = (startX + i*charW) + 'px';
  }
}

function wrapLine(){
  let breakIdx = -1;
  for (let i = currentLine.length - 1; i >= 0; i--){
    if (currentLine[i].ch === ' '){ breakIdx = i; break; }
  }
  let carry;
  if (breakIdx >= 0){
    carry = currentLine.splice(breakIdx + 1);
    currentLine.splice(breakIdx, 1);
  } else {
    carry = currentLine.splice(currentLine.length - 1);
  }
  layoutCurrentLine();
  currentLine = [];
  currentLineWidth = 0;
  cursorY += lineH;

  for (const item of carry){
    if (item.el){
      item.el.style.top = cursorY + 'px';
      item.el.style.left = (marginX + currentLine.length * charW) + 'px';
    }
    currentLine.push(item);
    currentLineWidth += charW;
  }
  layoutCurrentLine();
  lastX = null; lastY = null;
}

function forceNewline(){
  layoutCurrentLine();
  currentLine = [];
  currentLineWidth = 0;
  cursorY += lineH;
  lastX = null; lastY = null;
  updateStageHeight();
}

function updateStageHeight(){
  const needed = cursorY + lineH + 80;
  stage.style.height = Math.max(window.innerHeight - 120, needed) + 'px';
}

/* =========================================================
   6. Оборот буквы
   ========================================================= */
function spin(el){
  const DUR = 600;
  const start = performance.now();
  function frame(now){
    const t = Math.min(1, (now - start) / DUR);
    const eased = 1 - Math.pow(1 - t, 3);
    el.style.transform = `rotate(${eased * Math.PI * 2}rad)`;
    if (t < 1) requestAnimationFrame(frame);
    else el.style.transform = 'rotate(0rad)';
  }
  requestAnimationFrame(frame);
}

/* =========================================================
   7. Добавление символа
   ========================================================= */
function addChar(ch, kind, author, animateSpin){
  if (ch === '\n'){
    forceNewline();
    autoScroll();
    return;
  }
  if (currentLineWidth + charW > maxLineWidth() && currentLine.length > 0){
    wrapLine();
  }
  if (ch === ' '){
    currentLine.push({el:null, ch:' ', kind, author});
    currentLineWidth += charW;
    layoutCurrentLine();
    updateStageHeight();
    autoScroll();
    return;
  }
  const el = document.createElement('span');
  el.className = 'ch ' + kind;
  el.textContent = ch;
  el.style.top = cursorY + 'px';
  stage.appendChild(el);
  const entry = {el, ch, kind, author};
  currentLine.push(entry);
  layoutCurrentLine();
  if (animateSpin) spin(el);
  else el.style.transform = 'rotate(0rad)';
  currentLineWidth += charW;
  updateStageHeight();
  autoScroll();
}

/* =========================================================
   8. Печать
   ========================================================= */
function typeMyChar(){
  if (myCursor >= myText.length) return false;
  const ch = myText[myCursor++];
  saveMyCursor();
  addChar(ch, 'mine', null, true);
  return true;
}

function typeUserChar(){
  for (const u of userChars){
    if (!u.printed){
      u.printed = true;
      addChar(u.ch, 'user', u.author, true);
      saveUserChars();
      return true;
    }
  }
  return false;
}

// Печать одного символа в рамках текущего свайпа.
// Стоп на границе предложения (на \n) — следующий свайп продолжит.
function printOne(){
  if (myCursor < myText.length && myText[myCursor] === '\n'){
    return false;
  }
  if (typeMyChar()) return true;

  for (const u of userChars){
    if (!u.printed){
      if (u.ch === '\n') return false;
      u.printed = true;
      addChar(u.ch, 'user', u.author, true);
      saveUserChars();
      return true;
    }
  }
  return false;
}

// Входящие от пиров печатаем сразу целиком, включая \n
function appendUserText(text, author, autoPrint){
  const shouldPrintNow = !!autoPrint;
  for (const ch of text){
    userChars.push({ch, author: author || 'You', printed: shouldPrintNow});
  }
  saveUserChars();
  if (shouldPrintNow){
    for (const u of userChars){
      if (!u.printed){
        u.printed = true;
        addChar(u.ch, 'user', u.author, true);
      }
    }
  }
}

/* =========================================================
   9. Палец → печать
   ========================================================= */
const STEP_PX = 18;
let lastX = null, lastY = null;
let gestureMode = null;
let startClientX = 0, startClientY = 0;

function stagePoint(e){
  const t = e.touches ? e.touches[0] : e;
  const r = stage.getBoundingClientRect();
  return { x: t.clientX - r.left, y: t.clientY - r.top, cx: t.clientX, cy: t.clientY };
}

function moveTo(x, y){
  document.getElementById('hint').classList.add('hidden');

  if (lastX === null){
    lastX = x; lastY = y;

    // На первом движении нового свайпа «съедаем» \n,
    // чтобы перейти к следующему предложению.
    if (myCursor < myText.length && myText[myCursor] === '\n'){
      myCursor++;
      saveMyCursor();
      addChar('\n', 'mine', null, false);
    } else {
      for (const u of userChars){
        if (!u.printed && u.ch === '\n'){
          u.printed = true;
          saveUserChars();
          addChar('\n', 'user', u.author, false);
          break;
        }
      }
    }

    printOne();
    return;
  }

  let dx = x - lastX, dy = y - lastY, d = Math.hypot(dx, dy);
  while (d >= STEP_PX){
    const t = STEP_PX / d;
    lastX += dx * t; lastY += dy * t;
    dx = x - lastX; dy = y - lastY; d = Math.hypot(dx, dy);
    if (!printOne()) break;
  }
}

stage.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  const p = stagePoint(e);
  gestureMode = null;
  startClientX = p.cx; startClientY = p.cy;
  lastX = null; lastY = null;
}, { passive: true });

stage.addEventListener('touchmove', (e) => {
  if (e.touches.length !== 1) return;
  const p = stagePoint(e);
  const dx = p.cx - startClientX;
  const dy = p.cy - startClientY;

  if (gestureMode === null){
    if (Math.hypot(dx, dy) < 8) return;
    gestureMode = Math.abs(dy) > Math.abs(dx) * 1.4 ? 'scroll' : 'draw';
  }
  if (gestureMode === 'scroll'){
    lastX = null; lastY = null;
    return;
  }
  e.preventDefault();
  moveTo(p.x, p.y);
}, { passive: false });

stage.addEventListener('touchend', () => {
  gestureMode = null; lastX = null; lastY = null;
}, { passive: true });
stage.addEventListener('touchcancel', () => {
  gestureMode = null; lastX = null; lastY = null;
}, { passive: true });

stage.addEventListener('mousedown', (e) => {
  const p = stagePoint(e);
  lastX = p.x; lastY = p.y;
  printOne();
});
stage.addEventListener('mousemove', (e) => {
  if (!e.buttons) return;
  const p = stagePoint(e);
  moveTo(p.x, p.y);
});
window.addEventListener('mouseup', () => { lastX = null; lastY = null; });

/* =========================================================
   10. Поле ввода — только Enter
   ========================================================= */
const wordInput = document.getElementById('word-input');
wordInput.placeholder = PLACEHOLDER;
document.getElementById('btnClear').title = LANG === 'ru' ? 'Очистить экран' : 'Clear screen';

function submitInput(){
  const text = wordInput.value.trim();
  if (!text) return;
  wordInput.value = '';

  const edit = {
    editId: 'tx-' + Date.now() + '-' + Math.random().toString(16).slice(2,8),
    text,
    author: myId,
    ts: Date.now()
  };

  appendUserText('\n' + text + ' ', myId, false);

  if (isLive && client && client.connected){
    client.publish(TOPIC, JSON.stringify({
      ...edit, type:'TEXT_ADD', sender:myId, sid:clientId
    }), {qos:1});
  } else {
    pending.push(edit);
    savePending();
    updateChrome();
  }
}

wordInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.keyCode === 13){
    e.preventDefault();
    submitInput();
  }
});

/* =========================================================
   11. Clear
   ========================================================= */
document.getElementById('btnClear').addEventListener('click', () => {
  if (!confirm(LANG === 'ru' ? 'Очистить экран и весь текст на этом устройстве?' : 'Clear screen and all text on this device?')) return;

  myCursor = 0;
  userChars = [];
  pending = [];
  applied.clear();

  store.del('my_cursor');
  store.del('user_chars');
  store.del('pending');
  store.del('applied');

  stage.innerHTML = '';
  cursorY = marginY;
  currentLine = [];
  currentLineWidth = 0;
  lastX = null; lastY = null;
  updateStageHeight();
  updateChrome();
  
  document.getElementById('hint').classList.remove('hidden');
});

/* =========================================================
   12. Rename (2–9 символов)
   ========================================================= */
let beforeId = myId;
peerIdInput.addEventListener('focus', () => {
  beforeId = myId;
  requestAnimationFrame(() => peerIdInput.select());
});
peerIdInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter'){ e.preventDefault(); commitId(); peerIdInput.blur(); }
  if (e.key === 'Escape'){ peerIdInput.value = beforeId; peerIdInput.blur(); }
});
peerIdInput.addEventListener('blur', () => {
  if (peerIdInput.value.trim() !== myId) peerIdInput.value = myId;
});
function commitId(){
  const v = peerIdInput.value.trim();
  if (v === myId) return;
  if (!/^[A-Za-zА-Яа-я0-9_\- ]{2,9}$/.test(v)){
    peerIdInput.value = myId;
    return;
  }
  myId = v;
  store.set('peer_id', myId);
  peerIdInput.value = myId;
  peerIdInput.classList.add('saved');
  setTimeout(() => peerIdInput.classList.remove('saved'), 800);
}

/* =========================================================
   13. Автоскролл
   ========================================================= */
let userScrolling = false;
let userScrollTimer = null;
scroller.addEventListener('scroll', () => {
  userScrolling = true;
  clearTimeout(userScrollTimer);
  userScrollTimer = setTimeout(() => { userScrolling = false; }, 500);
}, { passive: true });

function autoScroll(){
  if (userScrolling) return;
  const bottom = cursorY + lineH + 40;
  const viewBottom = scroller.scrollTop + scroller.clientHeight;
  if (bottom > viewBottom){
    scroller.scrollTop = bottom - scroller.clientHeight + 40;
  }
}

/* =========================================================
   14. Восстановление
   ========================================================= */
function restorePrinted(){
  for (let i = 0; i < myCursor; i++){
    addChar(myText[i], 'mine', null, false);
  }
  for (const u of userChars){
    if (u.printed){
      addChar(u.ch, 'user', u.author, false);
    }
  }
}

/* =========================================================
   15. Init
   ========================================================= */
recalcMetrics();
restorePrinted();
updateStageHeight();
updateChrome();
connectMqtt();
</script>
