<!DOCTYPE html>
<html lang="en">
<head> 
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest-flash.json">
  <title>Fast Reading Converter</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      overscroll-behavior: none; 
      min-height: 100vh;
      min-height: var(--app-height, 100vh);
      margin: 0; padding: 0;
      background-color: #000000; color: #fff; 
      font-family: Arial, sans-serif;
      -webkit-user-select: none; user-select: none;
    }

    #scrollContainer {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: var(--app-height, 100vh);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      transition: transform 0.3s ease;
    }

    #logoContainer {
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 15px 5px 15px;
      width: 100%;
      max-width: 700px;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.5s ease;
      box-sizing: border-box;
    }

    body.is-reading #logoContainer {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #brandHeader {
      display: flex;
      flex-direction: column;
      align-items: center; 
      text-align: center;
      font-family: 'Cinzel', serif;
      width: 100%;
    }

    #inputContainer { 
      flex-shrink: 0;
      padding: 10px 15px 5px 15px;
      width: 100%;
      max-width: 700px;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      box-sizing: border-box; 
      transition: opacity 0.5s ease, max-height 0.3s ease, padding 0.3s ease, margin 0.3s ease;
      overflow: hidden;
    }

    body.is-reading #inputContainer { 
      opacity: 0 !important; 
      pointer-events: none !important;
      max-height: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    #wordDisplay {
      position: relative;
      width: 100%;
      max-width: 700px;
      min-height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 15px;
      box-sizing: border-box;
      transition: min-height 0.3s ease;
    }

    body.is-reading #wordDisplay {
      min-height: 70vh;
    }

    #wordDisplay:empty {
      display: none;
    }

    body.is-reading #wordDisplay:empty {
      display: flex;
      min-height: 70vh;
    }

    .word-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; 
      font-weight: 700; 
      white-space: nowrap;
      width: 90%;
      max-width: 90%;
      z-index: 60;
      pointer-events: none;
      transition: border-bottom 0.3s ease;
      text-align: center;
      padding: 10px;
    }

    .word-enter { 
      opacity: 0; 
      transform: translate(-50%, -50%) translateZ(500px) scale(0.8); 
      filter: blur(12px); 
    }

    .word-active { 
      opacity: 1; 
      transform: translate(-50%, -50%); 
      transition: all calc(var(--speed, 600ms) * 0.15) cubic-bezier(0.23, 1, 0.32, 1);
      filter: blur(0); 
    }

    .word-exit { 
      opacity: 0; 
      transform: translate(-50%, -50%) scale(0.5);
      filter: blur(10px); 
      transition: transform calc(var(--speed, 600ms) * 0.3) ease-in, 
                  opacity calc(var(--speed, 600ms) * 0.5) linear, 
                  filter calc(var(--speed, 600ms) * 0.4) calc(var(--speed, 600ms) * 0.2) ease-in;
    }

    .word-exit-long { 
      opacity: 0; 
      transform: translate(-50%, -50%) scale(0.8);
      filter: blur(20px); 
      transition: transform calc(var(--speed, 600ms) * 0.6) cubic-bezier(0.1, 0.8, 0.2, 1), 
                  opacity calc(var(--speed, 600ms) * 1.0) linear, 
                  filter calc(var(--speed, 600ms) * 0.7) calc(var(--speed, 600ms) * 0.8) ease-in;
    }

    body.is-paused .word-layer {
      cursor: pointer !important;
      pointer-events: auto !important;
      border-bottom: 3px solid rgba(255, 215, 0, 0.5);
      padding-bottom: 8px;
    }

#controls {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 10px 15px calc(env(safe-area-inset-bottom, 5px) + 10px);
  background: rgba(0,0,0,0.95);
  transition: opacity 0.3s ease;
  box-sizing: border-box;
  z-index: 100;
}

body.is-reading #controls {
  background: rgba(0,0,0,0.7);
}

    .button-row { 
      display: flex; 
      align-items: center; 
      gap: 5px; 
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    button {
      font-size: 12px; 
      background: transparent; 
      color: white;
      border-radius: 20px; 
      border: 2px solid rgba(255,255,255,0.38); 
      padding: 10px 16px; 
      cursor: pointer; 
      touch-action: manipulation;
      min-height: 40px;
      min-width: 60px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    #startBtn { 
      background: #fff; 
      color: #000; 
      border: none; 
      min-width: 80px; 
      font-weight: bold;
    }

    body.is-reading #startBtn, 
    body.is-reading #prevBtn, 
    body.is-reading #nextBtn, 
    body.is-reading #slowerBtn, 
    body.is-reading #fasterBtn { 
      opacity: 0.6; 
      background: transparent; 
      color: #fff; 
      border: 2px solid rgba(255,255,255,0.3); 
    }

    body.is-paused #startBtn { 
      background: #fff; 
      color: #000; 
      opacity: 1; 
      border: none;
    }
    
    body.is-paused #slowerBtn, 
    body.is-paused #fasterBtn { 
      display: none !important; 
    }
    
    #prevBtn, #nextBtn { 
      display: none; 
      background: rgba(255,255,255,0.1); 
    }
    
    body.is-paused #prevBtn, 
    body.is-paused #nextBtn { 
      display: block; 
      opacity: 1; 
      border-color: #fff; 
    }

    body.is-paused #editBtn { 
      display: block !important; 
      opacity: 1 !important; 
    }

    #editBtn {
      display: none;
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255, 255, 255, 1.0);
    }

    #accelBtn {
      border: 2px solid rgba(255, 255, 255, 0.38);
      font-size: 12px;
      color: #fff;
      padding: 7px 12px;
      border-radius: 0;
      background: transparent;
      min-width: 150px;
      margin: 0 0 30px 0;
    }

    #inputText {
      -webkit-user-select: text !important;
      user-select: text !important;
      pointer-events: auto !important;
      width: 100%; 
      min-height: 200px;
      padding: 10px 14px; 
      background: rgba(255,255,255,0.05); 
      color: #fff; 
      border: 2px solid rgba(255,255,255,0.38); 
      border-radius: 0px; 
      font-size: 18px; 
      outline: none; 
      box-sizing: border-box; 
      display: block;
      font-family: Arial, sans-serif;
      height: 30vh;
      resize: none;
      overflow-y: auto;
      text-align: center;
      touch-action: pan-y !important;
    }
    
    #inputText::placeholder {
      color: #ccc; 
      opacity: 1; 
    }

    .toolbar {
      display: flex; 
      gap: 10px; 
      margin-bottom: 10px; 
      width: 100%; 
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .toolbar-btn {
      flex: 1;
      padding: 10px 20px;
      text-align: center;
      font-size: 16px;
      border-radius: 0px;
      border: 1px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.1);
      min-height: 44px;
      min-width: 80px;
    }
    
    #fileInput { display: none; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,0.9);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 16px;
      opacity: 0;
      transition: all 0.4s ease;
      z-index: 999;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #pauseHint {
      display: none;
      color: rgba(255, 215, 0, 0.6);
      font-size: 14px;
      margin: 2px 0;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    @media (max-width: 480px) {
      button {
        font-size: 14px;
        padding: 10px 16px;
        min-height: 36px;
        min-width: 48px;
      }
      

      #inputText {
        min-height: 150px;
        height: 40vh;
        font-size: 14px;
      }
      
      .toolbar-btn {
        font-size: 12px;
        padding: 8px 14px;
        min-height: 36px;
        min-width: 60px;
      }
      
      body.is-reading #wordDisplay {
        min-height: 60vh;
      }
    }

    @media (max-width: 380px) {
      .button-row {
        gap: 3px;
      }
      button {
        font-size: 14px;
        padding: 10px 16px;
        min-height: 36px;
        min-width: 48px;
      }
      .word-layer {
        font-size: 22px !important;
      }
      
      #inputText {
        min-height: 120px;
        height: 35vh;
        font-size: 14px;
      }
      
      body.is-reading #wordDisplay {
        min-height: 55vh;
      }
    }

    #scrollContainer::-webkit-scrollbar {
      width: 0;
      background: transparent;
    }
  </style>
</head>
<body>

<div id="scrollContainer">
  
  <div id="logoContainer">
    <div id="brandHeader">
      <a href="match.html" id="logoLink" style="text-decoration: none;">
        <img src="fleurdelis.png" alt="Logo" style="max-width: 44px; margin-top: 20px; opacity: 0.9;">
      </a>
      <h1 style="font-size: 14px; margin: 3px 0 0 0; font-weight: normal; letter-spacing: 1px; color: #fff; width: 100%; text-align: center;">
        Fast Reading Converter
      </h1>
    </div>
  </div>

  <div id="inputContainer">
    <div class="toolbar">
      <button class="toolbar-btn" onclick="if(isReading) return; document.getElementById('fileInput').click()">Upload .txt</button>
      <input type="file" id="fileInput" accept=".txt">
    </div>
    <textarea id="inputText" placeholder="Paste your text here or use the button above.
 
Click on any blank area of the screen to invert the colors."></textarea>
  </div>

  <div id="wordDisplay"></div>

  <div id="controls">
    <button id="editBtn">Edit</button>
    <div id="pauseHint">Tap the word for definition via ChatGPT</div>

    <div class="button-row">
      <button id="slowerBtn">Slower</button>
      <button id="prevBtn">Back</button>
      <button id="startBtn">Start</button>
      <button id="nextBtn">Fore</button>
      <button id="fasterBtn">Faster</button>
    </div>
    <button id="accelBtn">Dynamic Accel: OFF</button>
  </div>

</div>

<div id="toast" class="toast">Copied to clipboard</div>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
}
</script>

<script>
    const wordDisplay = document.getElementById('wordDisplay');
    const inputText = document.getElementById('inputText');
    const startBtn = document.getElementById('startBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fasterBtn = document.getElementById('fasterBtn');
    const slowerBtn = document.getElementById('slowerBtn');
    const accelBtn = document.getElementById('accelBtn');
    const editBtn = document.getElementById('editBtn');
    const fileInput = document.getElementById('fileInput');
    const pauseHint = document.getElementById('pauseHint');
    const toast = document.getElementById('toast');
    const scrollContainer = document.getElementById('scrollContainer');
    const controls = document.getElementById('controls');
    const inputContainer = document.getElementById('inputContainer');

    const colors = ['#000000', '#2a0505', '#05052a', '#052a05', '#1a1a1a'];
    const textColors = ['#ffffff', '#ffeb3b', '#00ff00', '#ff4444', '#80cbc4', '#ffa726'];
    
    let colorIndex = parseInt(localStorage.getItem('reading_colorIndex')) || 0;
    let textColorIndex = parseInt(localStorage.getItem('reading_textColorIndex')) || 0;
    let wakeLock = null;
    
    let words = [], index = 0, timer = null, isPaused = false, isReading = false;
    let interval = parseInt(localStorage.getItem('reading_interval')) || 600;
    let isDynamicAccel = false;
    let inversionActive = localStorage.getItem('reading_inversionActive') === 'true';
    let transitionInterval = null;
    let inversionLevel = inversionActive ? 100 : 0;
    let toastTimeout = null;
    let scrollTimeout = null;
    
    document.body.style.backgroundColor = colors[colorIndex];
    inputText.value = localStorage.getItem('reading_text') || "";

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    function scrollToBottom() {
        if (scrollTimeout) cancelAnimationFrame(scrollTimeout);
        scrollTimeout = requestAnimationFrame(() => {
            const maxScroll = scrollContainer.scrollHeight - scrollContainer.clientHeight;
            scrollContainer.scrollTop = maxScroll + 50;
        });
    }

    function scrollToTop() {
        if (scrollTimeout) cancelAnimationFrame(scrollTimeout);
        scrollTimeout = requestAnimationFrame(() => {
            scrollContainer.scrollTop = 0;
        });
    }

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        inputText.value = evt.target.result;
        localStorage.setItem('reading_text', evt.target.result);
      };
      reader.readAsText(file);
    });

    inputText.addEventListener('input', () => {
        localStorage.setItem('reading_text', inputText.value);
        checkTextVisibility();
    });

    function updateFontSize(text, el) {
        const maxWidth = Math.min(window.innerWidth * 0.85, 600);
        const standardSize = Math.min(36, window.innerWidth / 12);
        el.style.fontSize = standardSize + 'px';
        let currentWidth = text.length * (standardSize * 0.6); 
        if (currentWidth > maxWidth) {
            const reducedSize = (maxWidth / text.length) / 0.6;
            el.style.fontSize = Math.max(12, reducedSize) + 'px';
        }
    }

    function applyInversionFilter() {
        document.documentElement.style.filter = `invert(${inversionLevel}%)`;
    }
    applyInversionFilter();

    function toggleInversion() {
        if (transitionInterval) clearInterval(transitionInterval);
        inversionActive = !inversionActive;
        localStorage.setItem('reading_inversionActive', inversionActive);
        const target = inversionActive ? 100 : 0;
        transitionInterval = setInterval(() => {
            if (inversionLevel === target) { clearInterval(transitionInterval); return; }
            inversionLevel += (inversionActive ? 5 : -5);
            applyInversionFilter();
        }, 15);
    }

    document.body.addEventListener('click', (e) => {
        if (
            e.target.tagName === 'BUTTON' || 
            e.target.tagName === 'TEXTAREA' || 
            e.target.closest('.toolbar') || 
            e.target.closest('#logoContainer') ||
            e.target.closest('.word-layer') ||
            e.target.closest('input')
        ) {
            return; 
        }
        toggleInversion();
    });

    function clearOldWord(isLongExit = false) {
        const oldEl = wordDisplay.querySelector('.word-active');
        if (oldEl) {
            const exitClass = isLongExit ? 'word-exit-long' : 'word-exit';
            oldEl.classList.replace('word-active', exitClass);
            const deleteTimeout = isLongExit ? (interval * 0.6) : (interval * 0.3);
            setTimeout(() => oldEl.remove(), deleteTimeout);
        }
    }

    function showNext() {
        if (index >= words.length || isPaused || !isReading) {
            if (index >= words.length) stopReading();
            return;
        }

        let rawTxt = words[index];
        let displayTxt = rawTxt;
        let isLongHold = displayTxt.includes('/');
        if (isLongHold) displayTxt = displayTxt.replace(/\//g, '');

        clearOldWord(isLongHold);

        if (displayTxt !== " " && !displayTxt.includes('|')) {
            const newEl = document.createElement('div');
            newEl.className = 'word-layer word-enter';
            newEl.textContent = displayTxt;
            newEl.style.color = textColors[textColorIndex];
            updateFontSize(displayTxt, newEl);
            wordDisplay.appendChild(newEl);
            
            requestAnimationFrame(() => {
                setTimeout(() => {
                    newEl.classList.replace('word-enter', 'word-active');
                }, 20);
            });
            
            newEl.style.pointerEvents = 'auto';
            newEl.style.cursor = 'pointer';
            
            newEl.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isPaused && isReading) {
                    const word = this.textContent;
                    const query = `What is the definition of the word "${word}" in the interface language?`;
                    
                    navigator.clipboard.writeText(word).then(() => {
                        showToast(`"${word}" copied`);
                    }).catch(() => {
                        showToast(`"${word}" copied`);
                    });
                    
                    window.open(
                        `https://chatgpt.com/?q=${encodeURIComponent(query)}`,
                        '_blank'
                    );
                }
            });
        }

        let extraPause = 0; 
        if (/[;,]/.test(rawTxt)) extraPause = 150;        
        else if (/:/.test(rawTxt)) extraPause = 150;
        else if (/[.!?—]/.test(rawTxt)) extraPause = 300; 
        
        if (rawTxt.length > 13) extraPause += 500;          
        if (isLongHold) extraPause += 200;

        let currentInterval = interval;
        if (isDynamicAccel && words.length > 1) {
            let progress = index / (words.length - 1);
            const phi = 0.618; 
            const intensity = 0.382; 
            let factor = progress <= phi 
                ? (1 - (progress / phi) * intensity) 
                : ((1 - intensity) + ((progress - phi) / (1 - phi)) * intensity);
            currentInterval = interval * factor;
        }

        document.documentElement.style.setProperty('--speed', currentInterval + 'ms');

        index++;
        timer = setTimeout(showNext, currentInterval + extraPause);
        
        scrollToBottom();
    }

    function stopReading() {
        releaseWakeLock();
        clearTimeout(timer);
        isReading = false; 
        isPaused = false;
        document.body.classList.remove('is-reading', 'is-paused');
        startBtn.textContent = 'Start';
        pauseHint.style.display = 'none';
        wordDisplay.innerHTML = '';
        checkTextVisibility();
        scrollToTop();
    }

    accelBtn.onclick = (e) => {
        e.stopPropagation();
        isDynamicAccel = !isDynamicAccel;
        accelBtn.textContent = `Dynamic Accel: ${isDynamicAccel ? 'ON' : 'OFF'}`;
    };

    startBtn.onclick = (e) => {
        e.stopPropagation();
        if (!isReading) {
            const text = inputText.value.trim();
            if (!text) return;
            localStorage.setItem('reading_text', text);
            
            words = text
              .replace(/([,;:.!?])(?!\s|$)/g, '$1 ')
              .split(/\s+/)
              .filter(w => w !== "")
              .map(w => w.replace(/_/g, ' '));
              
            index = 0; 
            isReading = true; 
            isPaused = false;
            document.body.classList.add('is-reading');
            document.body.classList.remove('is-paused');
            startBtn.textContent = 'Pause';
            pauseHint.style.display = 'none';
            requestWakeLock();
            showNext();
            scrollToBottom();
        } else {
            isPaused = !isPaused;
            document.body.classList.toggle('is-paused', isPaused);
            startBtn.textContent = isPaused ? 'Continue' : 'Pause';
            pauseHint.style.display = isPaused ? 'block' : 'none';
            if (!isPaused) {
                showNext();
                scrollToBottom();
            } else {
                clearTimeout(timer);
            }
        }
    };

    prevBtn.onclick = (e) => {
        e.stopPropagation();
        if (words.length === 0) return;
        index = Math.max(0, index - 2); 
        clearOldWord();
        if (isPaused) {
            const wasPaused = isPaused; 
            isPaused = false;
            showNext(); 
            clearTimeout(timer); 
            isPaused = wasPaused;
        } else {
            showNext();
        }
        scrollToBottom();
    };

    nextBtn.onclick = (e) => {
        e.stopPropagation();
        if (words.length === 0 || index >= words.length) return;
        clearOldWord();
        if (isPaused) {
            const wasPaused = isPaused; 
            isPaused = false;
            showNext(); 
            clearTimeout(timer); 
            isPaused = wasPaused;
        } else {
            showNext();
        }
        scrollToBottom();
    };

    function syncCssSpeed() {
        document.documentElement.style.setProperty('--speed', interval + 'ms');
    }

    fasterBtn.onclick = (e) => { 
        e.stopPropagation(); 
        interval = Math.max(50, interval - 50); 
        localStorage.setItem('reading_interval', interval); 
        syncCssSpeed(); 
    };
    
    slowerBtn.onclick = (e) => { 
        e.stopPropagation(); 
        interval += 50; 
        localStorage.setItem('reading_interval', interval); 
        syncCssSpeed(); 
    };

    syncCssSpeed();

    editBtn.onclick = (e) => { 
        e.preventDefault(); 
        e.stopPropagation(); 
        stopReading(); 
    };

    inputText.addEventListener('touchmove', (e) => { 
        e.stopPropagation(); 
    }, { passive: true });

    async function requestWakeLock() {
        try { 
            if ('wakeLock' in navigator) { 
                wakeLock = await navigator.wakeLock.request('screen'); 
            } 
        } catch (err) { 
            console.error(err); 
        }
    }
    
    function releaseWakeLock() { 
        if (wakeLock !== null) { 
            wakeLock.release(); 
            wakeLock = null; 
        } 
    }

    function resetHeight() { 
        document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`); 
    }
    
    window.addEventListener('resize', resetHeight);
    window.addEventListener('orientationchange', () => { 
        setTimeout(resetHeight, 100); 
    });
    resetHeight();

    function checkTextVisibility() {
        if (inputText.value.trim().length > 0) {
            controls.style.display = 'flex';
        } else {
            controls.style.display = 'none';
        }
    }

    checkTextVisibility();
    inputText.addEventListener('input', checkTextVisibility);
    fileInput.addEventListener('change', () => {
        setTimeout(checkTextVisibility, 50);
    });
</script> 
</body>
</html>
