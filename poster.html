<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interface Converter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/copperplate-gothic-std" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/bytesized@5.2.4/index.min.css" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: #0b0f1a;
    color: #e8e8e8;
    font-family: 'Ubuntu', sans-serif;
    min-height: 100vh;
  }

  .layout { display: flex; min-height: 100vh; }

  .sidebar {
    width: 320px; flex-shrink: 0;
    background: #05070d;
    border-right: 1px solid #1c2233;
    padding: 18px 16px 60px 16px;
    overflow-y: auto;
    max-height: 100vh;
    position: sticky; top: 0;
  }

  .sidebar h3 {
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: #5f6b85; margin: 22px 0 10px 0; padding-bottom: 6px;
    border-bottom: 1px solid #1c2233; font-weight: 700;
  }
  .sidebar h3:first-child { margin-top: 0; }

  .field {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 8px;
  }
  .field label { font-size: 12px; color: #98a3b8; flex: 1; min-width: 0; }
  .field input[type="number"],
  .field input[type="text"],
  .field select {
    width: 110px; flex-shrink: 0; padding: 6px 8px;
    background: #0f1420; color: #fff; border: 1px solid #2a3348;
    font-family: 'Ubuntu', sans-serif; font-size: 12px; border-radius: 3px;
  }
  .field input[type="color"] {
    width: 44px; height: 30px; padding: 0; background: none;
    border: 1px solid #2a3348; cursor: pointer; border-radius: 3px;
  }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .file-btn {
    display: block; width: 100%; padding: 8px 10px;
    background: #0f1420; color: #cfd6e6;
    border: 1px dashed #2a3348; text-align: center;
    font-size: 12px; cursor: pointer; border-radius: 3px;
    margin-bottom: 8px; transition: 0.15s;
  }
  .file-btn:hover { border-color: #448aff; color: #fff; }
  .file-btn input { display: none; }

  .action-btn {
    width: 100%; padding: 10px; background: #448aff; color: #fff;
    border: none; font-family: 'Ubuntu', sans-serif; font-weight: 700;
    font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    cursor: pointer; border-radius: 3px; margin-top: 6px; transition: 0.15s;
  }
  .action-btn:hover { background: #2979ff; }
  .action-btn.secondary {
    background: transparent; border: 1px solid #2a3348; color: #cfd6e6;
  }
  .action-btn.secondary:hover { background: #0f1420; border-color: #448aff; color: #fff; }

  .preview-area {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0px;
    overflow: hidden;
  }

  .stage-holder {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    flex-shrink: 0;
  }

  .stage-fit {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: calc(100vh - 80px);
    overflow: hidden;
  }
  .stage-scaler {
    transform-origin: center center;
  }
  .stage {
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.7);
    position: relative;
    flex-shrink: 0;
  }
  .stage-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 0;
    pointer-events: none;
  }
  .stage-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: transparent;
  }
  #capture-target {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    box-sizing: border-box;
    padding: 20px;
  }

  .brand {
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
  }
  .brand img.logo { display: block; object-fit: contain; }
  .brand .title {
    margin: 0; line-height: 1.1; text-decoration: none; display: block;
  }
  .brand .subtitle { margin: 0; display: block; }
  .brand .eqlectika {
    display: block;
    font-family: 'Ubuntu', sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    color: #ffffff;
    text-decoration: none;
    margin: 0;
  }
  .brand .eqlectika:hover {
    text-decoration: underline;
  }
  .progress-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
  }
  .progress-track {
    width: 320px;
    height: 14px;
    background: #444444;
    overflow: hidden;
  }
  .progress-fill {
    width: 34%;
    height: 14px;
    background: #ffffff;
    transition: width 200ms ease-out;
  }

* {
  scrollbar-width: none;
}

::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0;
}
</style>
</head>
<body>

<div class="layout">

  <aside class="sidebar">

    <h3>Canvas</h3>
    <div class="row-2">
      <div class="field"><label>Width</label><input type="number" id="cw" value="1080" min="100" max="4000"></div>
      <div class="field"><label>Height</label><input type="number" id="ch" value="1920" min="100" max="4000"></div>
    </div>
    <div class="field">
      <label>Fit to canvas (%)</label>
      <input type="number" id="fit" value="35" min="1" max="100">
    </div>
    <div class="field">
      <label>Format</label>
      <select id="format">
        <option value="png">PNG</option>
        <option value="jpeg">JPG</option>
      </select>
    </div>
    <div class="field">
      <label>Scale</label>
      <select id="scale">
        <option value="1">1×</option>
        <option value="2" selected>2×</option>
        <option value="3">3×</option>
      </select>
    </div>

    <h3>Gradient</h3>
    <div class="field"><label>Top color</label><input type="color" id="grad-top" value="#0f172a"></div>
    <div class="field"><label>Bottom color</label><input type="color" id="grad-bottom" value="#7E52F5"></div>
    <div class="field"><label>Middle stop (%)</label><input type="number" id="grad-mid" value="60" min="0" max="100"></div>

    <h3>Background</h3>
    <label class="file-btn">Upload background<input type="file" id="bg-file" accept="image/*"></label>
    <button class="action-btn secondary" onclick="clearBg()" style="margin-top:0;margin-bottom:8px;">Clear background</button>
     <div class="field">
      <label>Image fit</label>
      <select id="bg-fit">
        <option value="cover" selected>cover</option>
        <option value="contain">contain</option>
        <option value="stretch">stretch</option>
      </select>
    </div>
    <div class="field"><label>Overlay color</label><input type="color" id="ov-color" value="#000000"></div>
    <div class="field"><label>Overlay opacity (%)</label><input type="number" id="ov-opacity" value="30" min="0" max="100"></div>
    <div class="field">
      <label>Blend mode</label>
      <select id="ov-blend">
        <option value="normal" selected>normal</option>
        <option value="multiply">multiply</option>
        <option value="screen">screen</option>
        <option value="overlay">overlay</option>
        <option value="soft-light">soft-light</option>
        <option value="hard-light">hard-light</option>
        <option value="color">color</option>
        <option value="hue">hue</option>
        <option value="saturation">saturation</option>
        <option value="luminosity">luminosity</option>
      </select>
    </div>

    <h3>Logo</h3>
    <label class="file-btn">Upload logo<input type="file" id="logo-file" accept="image/*"></label>
    <div class="field"><label>Height (px)</label><input type="number" id="logo-h" value="56" min="8" max="400"></div>

    <h3>Title</h3>
    <div class="field">
      <label>Font</label>
      <select id="title-font">
        <option value="'Cinzel', serif" selected>Cinzel</option>
        <option value="'Playfair Display', serif">Playfair Display</option>
        <option value="'Ubuntu', sans-serif">Ubuntu</option>
        <option value="'Barlow Condensed', sans-serif">Barlow Condensed</option>
        <option value="'Roboto Condensed', sans-serif">Roboto Condensed</option>
        <option value="'Lato', sans-serif">Lato</option>
        <option value="'Roboto', sans-serif">Roboto</option>
        <option value="'Unbounded', sans-serif">Unbounded</option>
        <option value="'Courier Prime', monospace">Courier Prime</option>
        <option value="'Luckiest Guy', cursive">Luckiest Guy</option>
        <option value="'Copperplate Gothic Std', serif">Copperplate Gothic</option>
      </select>
    </div>
    <div class="field"><label>Size (px)</label><input type="number" id="title-size" value="22" min="8" max="200"></div>
    <div class="field"><label>Letter spacing</label><input type="number" id="title-spacing" value="1.5" min="-5" max="30" step="0.5"></div>
    <div class="field"><label>Color</label><input type="color" id="title-color" value="#ffffff"></div>
    <div class="field">
      <label>Weight</label>
      <select id="title-weight">
        <option value="400">400</option>
        <option value="600">600</option>
        <option value="700" selected>700</option>
        <option value="900">900</option>
      </select>
    </div>

    <h3>Subtitle</h3>
    <div class="field">
      <label>Font</label>
      <select id="sub-font">
        <option value="'Cinzel', serif" selected>Cinzel</option>
        <option value="'Playfair Display', serif">Playfair Display</option>
        <option value="'Ubuntu', sans-serif">Ubuntu</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="'Barlow Condensed', sans-serif">Barlow Condensed</option>
        <option value="'Roboto Condensed', sans-serif">Roboto Condensed</option>
        <option value="'Lato', sans-serif">Lato</option>
        <option value="'Roboto', sans-serif">Roboto</option>
        <option value="'Unbounded', sans-serif">Unbounded</option>
        <option value="'Courier Prime', monospace">Courier Prime</option>
        <option value="'Luckiest Guy', cursive">Luckiest Guy</option>
        <option value="'Copperplate Gothic Std', serif">Copperplate Gothic</option>
      </select>
    </div>
    <div class="field"><label>Size (px)</label><input type="number" id="sub-size" value="12" min="6" max="120"></div>
    <div class="field"><label>Letter spacing</label><input type="number" id="sub-spacing" value="3" min="-5" max="30" step="0.5"></div>
    <div class="field"><label>Color</label><input type="color" id="sub-color" value="#ffffff"></div>

    <h3>Spacing</h3>
   <div class="field">
  <label>Eqlectika font</label>
  <select id="eq-font">
    <option value="'Ubuntu', sans-serif" selected>Ubuntu</option>
    <option value="'Cinzel', serif">Cinzel</option>
    <option value="'Playfair Display', serif">Playfair Display</option>
    <option value="'Barlow Condensed', sans-serif">Barlow Condensed</option>
    <option value="'Roboto Condensed', sans-serif">Roboto Condensed</option>
    <option value="'Lato', sans-serif">Lato</option>
    <option value="'Roboto', sans-serif">Roboto</option>
    <option value="'Unbounded', sans-serif">Unbounded</option>
    <option value="'Courier Prime', monospace">Courier Prime</option>
    <option value="'Luckiest Guy', cursive">Luckiest Guy</option>
    <option value="'Copperplate Gothic Std', serif">Copperplate Gothic</option>
    <option value="Georgia, serif">Georgia</option>
  </select>
</div>
    <div class="field"><label>Logo → Title</label><input type="number" id="gap-logo-title" value="0" min="-100" max="200"></div>
    <div class="field"><label>Title → Subtitle</label><input type="number" id="gap-title-sub" value="0" min="-100" max="200"></div>
    <div class="field"><label>Subtitle → Eqlectika</label><input type="number" id="gap-sub-eq" value="10" min="-100" max="200"></div>
    <div class="field"><label>Eqlectika color</label><input type="color" id="eq-color" value="#ffffff"></div>
    <div class="field"><label>Eqlectika size (px)</label><input type="number" id="eq-size" value="12" min="6" max="120"></div>
    <div class="field"><label>Eqlectika → Bar</label><input type="number" id="gap-eq-bar" value="20" min="-100" max="200"></div>
    <div class="field">
     <label>Show Eqlectika address</label>
        <input type="checkbox" id="eq-show" checked style="width:18px;height:18px;accent-color:#448aff;cursor:pointer;">
    </div>

    <h3>Happiness Bar</h3>
    <div class="field"><label>Width (px)</label><input type="number" id="bar-w" value="120" min="20" max="1000"></div>
    <div class="field"><label>Height (px)</label><input type="number" id="bar-h" value="6" min="1" max="80"></div>
    <div class="field"><label>Fill color</label><input type="color" id="bar-fill" value="#ffffff"></div>
    <div class="field"><label>Track color</label><input type="color" id="bar-track" value="#444444"></div>
    <div class="field"><label>Progress (%)</label><input type="number" id="bar-progress" value="34" min="0" max="100"></div>

    <h3>Export</h3>
    <button class="action-btn" onclick="downloadImage()">Download</button>
    <button class="action-btn secondary" onclick="copyToClipboard()">Copy to clipboard</button>
    <button class="action-btn secondary" onclick="resetAll()">Reset all</button>

  </aside>

  <main class="preview-area">
    <div class="stage-fit">
      <div class="stage-scaler" id="stage-scaler">
        <div class="stage" id="stage">
        <div class="stage-bg" id="stage-bg"></div>
        <div class="stage-overlay" id="stage-overlay"></div>
        <div id="capture-target">

          <div class="brand">
            <img class="logo" id="logo-img" src="fleurdelis.png" alt="" onerror="this.style.visibility='hidden'">
            <a class="title" id="title-el" href="#">Trust Fibonacci</a>
            <span class="subtitle" id="subtitle-el">Custom web site and application</span>
            <a class="eqlectika" id="eqlectika-el" href="https://eqlectika.github.io" target="_blank" rel="noopener noreferrer">eqlectika.github.io</a>
          </div>

          <div class="progress-wrap" id="progress-wrap">
            <div class="progress-track" id="bar-el-track">
              <div class="progress-fill" id="bar-el-fill"></div>
            </div>
          </div>

        </div>
      </div>
    </div>
    </div>
  </main>

</div>

<script>
const stage        = document.getElementById('stage');
const stageBg      = document.getElementById('stage-bg');
const stageOverlay = document.getElementById('stage-overlay');
const logoImg      = document.getElementById('logo-img');
const titleEl      = document.getElementById('title-el');
const subtitleEl   = document.getElementById('subtitle-el');
const eqlectikaEl  = document.getElementById('eqlectika-el');
const progressWrap = document.getElementById('progress-wrap');
const barTrack     = document.getElementById('bar-el-track');
const barFill      = document.getElementById('bar-el-fill');

function bind(id, fn, event = 'input') {
  const el = document.getElementById(id);
  if (el) el.addEventListener(event, fn);
}

function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function fitStageToScreen() {
  const area    = document.querySelector('.stage-fit');
  const scaler  = document.getElementById('stage-scaler');
  const cw      = parseInt(document.getElementById('cw').value) || 1080;
  const ch      = parseInt(document.getElementById('ch').value) || 1920;

  const availW = area.clientWidth  - 0;
  const availH = area.clientHeight - 0;

  const scale  = Math.min(availW / cw, availH / ch, 1);

  scaler.style.width  = cw + 'px';
  scaler.style.height = ch + 'px';
  scaler.style.transform = `scale(${scale})`;
}

function render() {
  const cw  = Math.max(100, parseInt(document.getElementById('cw').value) || 1080);
  const ch  = Math.max(100, parseInt(document.getElementById('ch').value) || 1920);
  const fit = Math.min(100, Math.max(1, parseInt(document.getElementById('fit').value) || 35));

  stage.style.width  = cw + 'px';
  stage.style.height = ch + 'px';

  const top = document.getElementById('grad-top').value;
  const bot = document.getElementById('grad-bottom').value;
  const mid = Math.min(100, Math.max(0, parseInt(document.getElementById('grad-mid').value) || 60));
  stage.style.background = `linear-gradient(180deg, ${top} 0%, ${top} 30%, ${bot} ${mid}%, ${bot} 120%)`;

  const ovColor   = document.getElementById('ov-color').value;
  const ovOpacity = Math.min(100, Math.max(0, parseInt(document.getElementById('ov-opacity').value) || 0)) / 100;
  const ovBlend   = document.getElementById('ov-blend').value;
  stageOverlay.style.background   = hexToRgba(ovColor, ovOpacity);
  stageOverlay.style.mixBlendMode = ovBlend;

  const baseLogoH   = Math.max(8,  parseInt(document.getElementById('logo-h').value) || 56);
  const baseTitleS  = Math.max(8,  parseInt(document.getElementById('title-size').value) || 22);
  const baseTitleLS = parseFloat(document.getElementById('title-spacing').value) || 0;
  const baseSubS    = Math.max(6,  parseInt(document.getElementById('sub-size').value) || 12);
  const baseSubLS   = parseFloat(document.getElementById('sub-spacing').value) || 0;
  const baseBarW    = Math.max(20, parseInt(document.getElementById('bar-w').value) || 120);
  const baseBarH    = Math.max(1,  parseInt(document.getElementById('bar-h').value) || 6);
  const baseG1      = parseInt(document.getElementById('gap-logo-title').value) || 0;
  const baseG2      = parseInt(document.getElementById('gap-title-sub').value) || 0;
  const baseG3a     = parseInt(document.getElementById('gap-sub-eq').value) || 0;
  const baseG3b     = parseInt(document.getElementById('gap-eq-bar').value) || 0;

  const naturalH = baseLogoH + baseBarH + 60;

  const canvasMin = Math.min(cw, ch);
  const targetH   = canvasMin * (fit / 100);
  const k         = targetH / naturalH;

  logoImg.style.height       = (baseLogoH * k) + 'px';
  logoImg.style.width        = 'auto';
  logoImg.style.marginBottom = (baseG1 * k) + 'px';

  titleEl.style.fontFamily    = document.getElementById('title-font').value;
  titleEl.style.fontSize      = (baseTitleS * k) + 'px';
  titleEl.style.letterSpacing = (baseTitleLS * k) + 'px';
  titleEl.style.color         = document.getElementById('title-color').value;
  titleEl.style.fontWeight    = document.getElementById('title-weight').value;
  titleEl.style.marginBottom  = (baseG2 * k) + 'px';

  const eqShow = document.getElementById('eq-show').checked;

  subtitleEl.style.fontFamily    = document.getElementById('sub-font').value;
  subtitleEl.style.fontSize      = (baseSubS * k) + 'px';
  subtitleEl.style.letterSpacing = (baseSubLS * k) + 'px';
  subtitleEl.style.color         = document.getElementById('sub-color').value;

  const baseEqS = Math.max(6, parseInt(document.getElementById('eq-size').value) || 12);
  eqlectikaEl.style.fontSize = (baseEqS * k) + 'px';

  if (eqShow) {
    subtitleEl.style.marginBottom = '0px';

    eqlectikaEl.style.display       = 'block';
    eqlectikaEl.style.fontFamily    = document.getElementById('eq-font').value;
    eqlectikaEl.style.letterSpacing = (baseSubLS * k) + 'px';
    eqlectikaEl.style.color         = document.getElementById('eq-color').value;
    eqlectikaEl.style.marginTop     = (baseG3a * k) + 'px';
    eqlectikaEl.style.marginBottom  = (baseG3b * k) + 'px';
  } else {
    subtitleEl.style.marginBottom = ((baseG3a + baseG3b) * k) + 'px';

    eqlectikaEl.style.display = 'none';
    eqlectikaEl.style.marginTop     = '0px';
    eqlectikaEl.style.marginBottom  = '0px';
  }

  progressWrap.style.marginTop = '0px';

  barTrack.style.width      = (baseBarW * k) + 'px';
  barTrack.style.height     = (baseBarH * k) + 'px';
  barTrack.style.background = document.getElementById('bar-track').value;

  barFill.style.background = document.getElementById('bar-fill').value;
  barFill.style.width      = Math.min(100, Math.max(0, parseInt(document.getElementById('bar-progress').value) || 0)) + '%';
  barFill.style.height     = (baseBarH * k) + 'px';

  fitStageToScreen();
}

['cw','ch','fit','grad-top','grad-bottom','grad-mid',
 'ov-color','ov-opacity',
 'logo-h',
 'title-size','title-spacing','title-color',
 'sub-size','sub-spacing','sub-color',
 'gap-logo-title','gap-title-sub','gap-sub-eq','gap-eq-bar',
 'eq-color','eq-size',
 'bar-w','bar-h','bar-fill','bar-track','bar-progress'
].forEach(id => bind(id, render));

bind('ov-blend', render, 'change');
bind('bg-fit', applyBgFit, 'change');
bind('title-font', render, 'change');
bind('title-weight', render, 'change');
bind('sub-font', render, 'change');
bind('eq-show', render, 'change');

document.getElementById('logo-file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    logoImg.src = ev.target.result;
    logoImg.style.visibility = 'visible';
    render();
  };
  reader.readAsDataURL(f);
});

document.getElementById('bg-file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    stageBg.style.backgroundImage = `url(${ev.target.result})`;
    applyBgFit();
  };
  reader.readAsDataURL(f);
});

function applyBgFit() {
  const fit = document.getElementById('bg-fit').value;
  if (fit === 'cover') {
    stageBg.style.backgroundSize     = 'cover';
    stageBg.style.backgroundPosition = 'center';
    stageBg.style.backgroundRepeat   = 'no-repeat';
  } else if (fit === 'contain') {
    stageBg.style.backgroundSize     = 'contain';
    stageBg.style.backgroundPosition = 'center';
    stageBg.style.backgroundRepeat   = 'no-repeat';
  } else {
    stageBg.style.backgroundSize     = '100% 100%';
    stageBg.style.backgroundPosition = 'center';
    stageBg.style.backgroundRepeat   = 'no-repeat';
  }
}

function clearBg() {
  stageBg.style.backgroundImage = '';
  document.getElementById('bg-file').value = '';
}

render();

async function renderCanvas() {
  const scale = parseInt(document.getElementById('scale').value) || 1;
  const isJpg = document.getElementById('format').value === 'jpeg';
  const cw    = parseInt(document.getElementById('cw').value) || 1080;
  const ch    = parseInt(document.getElementById('ch').value) || 1920;

  return await html2canvas(stage, {
    scale: scale,
    useCORS: true,
    allowTaint: false,
    backgroundColor: isJpg ? document.getElementById('grad-top').value : null,
    width:  cw,
    height: ch,
    windowWidth:  cw,
    windowHeight: ch,
    scrollX: 0,
    scrollY: 0,
    x: 0,
    y: 0,
onclone: (clonedDoc) => {
  const sc = clonedDoc.getElementById('stage-scaler');
  if (sc) sc.style.transform = 'none';
  const eq = clonedDoc.getElementById('eqlectika-el');
  if (eq && !document.getElementById('eq-show').checked) eq.style.display = 'none';
}
  });
}
async function downloadImage() {
  const canvas = await renderCanvas();
  const fmt = document.getElementById('format').value;
  const mime = fmt === 'jpeg' ? 'image/jpeg' : 'image/png';
  const ext  = fmt === 'jpeg' ? 'jpg' : 'png';
  const link = document.createElement('a');
  link.download = `interface-${Date.now()}.${ext}`;
  link.href = canvas.toDataURL(mime, 0.95);
  link.click();
}

async function copyToClipboard() {
  try {
    const canvas = await renderCanvas();
    const fmt = document.getElementById('format').value;
    const mime = fmt === 'jpeg' ? 'image/jpeg' : 'image/png';
    canvas.toBlob(async (blob) => {
      try {
        await navigator.clipboard.write([ new ClipboardItem({ [mime]: blob }) ]);
        alert('Copied');
      } catch (e) { alert('Copy failed: ' + e.message); }
    }, mime, 0.95);
  } catch (e) { alert('Render failed: ' + e.message); }
}

window.addEventListener('resize', fitStageToScreen);

function resetAll() {
  if (!confirm('Reset all settings?')) return;
  location.reload();
}
</script>
