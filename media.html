<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest-media.json">
  <title>Media Loop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #ddd;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    #media {
      width: 100%;
      max-width: 800px;
      background: #000;
      border-radius: 8px;
      min-height: 80px;
    }
    video#media { aspect-ratio: 16/9; }
    .controls {
      width: 100%;
      max-width: 800px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    input[type="file"] { display: none; }
    label, button {
      background: #333;
      color: #eee;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      white-space: nowrap;
    }
    label:hover, button:hover { background: #444; }
    button:disabled { opacity: 0.4; cursor: default; }
    .times {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 16px;
    }
    .times input {
      width: 90px;
      background: #222;
      border: 1px solid #444;
      color: #eee;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 16px;
    }
    input[type="range"] {
      flex: 1;
      max-width: 320px;
      min-width: 120px;
      height: 8px;
      -webkit-appearance: none;
      appearance: none;
      background: #333;
      border-radius: 4px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      background: #6c5ce7;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      background: #6c5ce7;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    .logo {
      margin-top: auto;
      margin-bottom: 30px;
      padding-top: 40px;
    }
    .logo img {
      width: 38px;
      height: 38px;
      display: block;
    }
    #extractBtn { display: none; }
  </style>
</head>
<body>
  <video id="media" controls playsinline></video>

  <div class="controls">
    <div class="row">
      <label for="f">Choose media</label>
      <input type="file" id="f" accept="video/*,audio/*">
      <div class="times">
        <input type="number" id="start" value="0" step="0.1" min="0" disabled> –
        <input type="number" id="end" value="0" step="0.1" min="0" disabled>
      </div>
    </div>

    <div class="row">
      <input type="range" id="s" min="0" max="100" step="0.1" value="0" disabled>
      <input type="range" id="e" min="0" max="100" step="0.1" value="100" disabled>
    </div>

    <div class="buttons">
      <button id="loop" disabled>Loop</button>
      <button id="stop" disabled>Stop</button>
      <button id="extractBtn">Extract Audio</button>
    </div>
  </div>

  <a href="research.html" class="logo">
    <img src="logo.png" alt="Logo" width="38" height="38">
  </a>

  <script>
    const f = document.getElementById('f');
    const start = document.getElementById('start');
    const end = document.getElementById('end');
    const s = document.getElementById('s');
    const e = document.getElementById('e');
    const loopBtn = document.getElementById('loop');
    const stopBtn = document.getElementById('stop');
    const extractBtn = document.getElementById('extractBtn');

    let media = document.getElementById('media');
    let looping = false, from = 0, to = 0;
    let currentFile = null;
    let isVideo = false;
    let objectUrl = null;
    let cachedWavBlob = null;
    let cachedName = '';

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    f.onchange = () => {
      const file = f.files[0];
      if (!file) return;

      // Cleanup
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = null;
      }
      cachedWavBlob = null;
      looping = false;
      loopBtn.disabled = true;
      stopBtn.disabled = true;

      currentFile = file;
      isVideo = file.type.startsWith('video/');
      objectUrl = URL.createObjectURL(file);

      // Recreate media element
      const newMedia = document.createElement(isVideo ? 'video' : 'audio');
      newMedia.id = 'media';
      newMedia.controls = true;
      newMedia.playsInline = true;
      if (isVideo) newMedia.style.aspectRatio = '16/9';
      else newMedia.style.minHeight = '80px';

      media.replaceWith(newMedia);
      media = newMedia;

      media.addEventListener('loadedmetadata', onLoaded);
      media.addEventListener('timeupdate', onTimeUpdate);

      media.src = objectUrl;
      extractBtn.style.display = isVideo ? 'inline-block' : 'none';
      extractBtn.textContent = 'Extract Audio';
      extractBtn.disabled = false;
    };

    function onLoaded() {
      const d = media.duration;
      if (!isFinite(d)) return;
      [start, end, s, e, loopBtn].forEach(el => el.disabled = false);
      start.max = end.max = s.max = e.max = d;
      end.value = e.value = d.toFixed(1);
      start.value = s.value = 0;
    }

    function onTimeUpdate() {
      if (looping && media.currentTime >= to) {
        media.currentTime = from;
      }
    }

    function sync(fromSlider) {
      let a = +start.value, b = +end.value;
      if (fromSlider) {
        a = +s.value;
        b = +e.value;
      }
      if (a >= b) a = Math.max(0, b - 0.5);
      start.value = s.value = a.toFixed(1);
      end.value = e.value = b.toFixed(1);
    }

    s.oninput = e.oninput = () => sync(true);
    start.onchange = end.onchange = () => sync(false);

    loopBtn.onclick = () => {
      from = +start.value;
      to = +end.value;
      if (to <= from) return;
      looping = true;
      media.currentTime = from;
      media.play();
      loopBtn.disabled = true;
      stopBtn.disabled = false;
    };

    stopBtn.onclick = () => {
      looping = false;
      media.pause();
      loopBtn.disabled = false;
      stopBtn.disabled = true;
    };

    extractBtn.onclick = async () => {
      if (!currentFile || !isVideo) return;

      // На iOS большие файлы почти всегда роняют вкладку
      if (isIOS && currentFile.size > 40 * 1024 * 1024) {
        alert('This video is too large for audio extraction on iPhone.\n\nPlease try a shorter video or use a computer.');
        return;
      }

      extractBtn.disabled = true;
      extractBtn.textContent = 'Extracting...';

      try {
        if (!cachedWavBlob) {
          // Читаем файл
          const arrayBuffer = await currentFile.arrayBuffer();

          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

          // Сразу освобождаем AudioContext
          await audioCtx.close();

          const wav = audioBufferToWav(audioBuffer);
          cachedWavBlob = new Blob([wav], { type: 'audio/wav' });
          cachedName = (currentFile.name.replace(/\.[^/.]+$/, '') || 'audio') + '.wav';

          // Помогаем сборщику мусора
          // (arrayBuffer и audioBuffer больше не нужны)
        }

        // Скачивание
        downloadBlob(cachedWavBlob, cachedName);

      } catch (err) {
        console.error(err);
        alert('Failed to extract audio.\n\nOn iPhone this often happens with large videos because of memory limits.\nTry a shorter video or use a desktop browser.');
        cachedWavBlob = null; // сбрасываем кэш при ошибке
      }

      extractBtn.disabled = false;
      extractBtn.textContent = 'Extract Audio';
    };

    function downloadBlob(blob, filename) {
      // Пробуем современный API (работает в Chrome/Edge)
      if ('showSaveFilePicker' in window) {
        window.showSaveFilePicker({
          suggestedName: filename,
          types: [{
            description: 'WAV Audio',
            accept: { 'audio/wav': ['.wav'] }
          }]
        }).then(async (handle) => {
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
        }).catch(err => {
          if (err.name !== 'AbortError') {
            // Fallback если что-то пошло не так
            classicDownload(blob, filename);
          }
        });
        return;
      }

      // Обычный способ (Safari, Firefox, iOS)
      classicDownload(blob, filename);
    }

    function classicDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();

      // Важно: не удаляем ссылку сразу
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1000);
    }

    function audioBufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const bitDepth = 16;
      const bytesPerSample = bitDepth / 8;
      const blockAlign = numOfChan * bytesPerSample;
      const dataLength = buffer.length * blockAlign;
      const arrayBuffer = new ArrayBuffer(44 + dataLength);
      const view = new DataView(arrayBuffer);

      const writeString = (offset, str) => {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      };

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + dataLength, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numOfChan, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitDepth, true);
      writeString(36, 'data');
      view.setUint32(40, dataLength, true);

      const channels = [];
      for (let i = 0; i < numOfChan; i++) {
        channels.push(buffer.getChannelData(i));
      }

      let offset = 44;
      for (let i = 0; i < buffer.length; i++) {
        for (let ch = 0; ch < numOfChan; ch++) {
          let sample = Math.max(-1, Math.min(1, channels[ch][i]));
          sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
          view.setInt16(offset, sample, true);
          offset += 2;
        }
      }
      return arrayBuffer;
    }
  </script>
</body>
</html>
