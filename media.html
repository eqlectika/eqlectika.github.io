<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest-video.json">
  <title>Media Loop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #ddd;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    #media {
      width: 100%;
      max-width: 800px;
      background: #000;
      border-radius: 8px;
      min-height: 80px;
    }
    video#media { aspect-ratio: 16/9; }
    .controls {
      width: 100%;
      max-width: 800px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    input[type="file"] { display: none; }
    label, button {
      background: #333;
      color: #eee;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      white-space: nowrap;
    }
    label:hover, button:hover { background: #444; }
    button:disabled { opacity: 0.4; cursor: default; }
    .times {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 16px;
    }
    .times input {
      width: 90px;
      background: #222;
      border: 1px solid #444;
      color: #eee;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 16px;
    }
    input[type="range"] {
      flex: 1;
      max-width: 320px;
      min-width: 120px;
      height: 8px;
      -webkit-appearance: none;
      appearance: none;
      background: #333;
      border-radius: 4px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      background: #6c5ce7;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      background: #6c5ce7;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    .logo {
      margin-top: auto;
      margin-bottom: 30px;
      padding-top: 40px;
    }
    .logo img {
      width: 38px;
      height: 38px;
      display: block;
    }
    #extractBtn { display: none; }
  </style>
</head>
<body>
  <video id="media" controls playsinline></video>

  <div class="controls">
    <!-- Row 1 -->
    <div class="row">
      <label for="f">Choose media</label>
      <input type="file" id="f" accept="video/*,audio/*">
      <div class="times">
        <input type="number" id="start" value="0" step="0.1" min="0" disabled> –
        <input type="number" id="end" value="0" step="0.1" min="0" disabled>
      </div>
    </div>

    <!-- Row 2: Sliders -->
    <div class="row">
      <input type="range" id="s" min="0" max="100" step="0.1" value="0" disabled>
      <input type="range" id="e" min="0" max="100" step="0.1" value="100" disabled>
    </div>

    <!-- Row 3: Buttons -->
    <div class="buttons">
      <button id="loop" disabled>Loop</button>
      <button id="stop" disabled>Stop</button>
      <button id="extractBtn">Extract Audio</button>
    </div>
  </div>

  <a href="research.html" class="logo">
    <img src="logo.png" alt="Logo" width="38" height="38">
  </a>

  <script>
    const media = document.getElementById('media');
    const f = document.getElementById('f');
    const start = document.getElementById('start');
    const end = document.getElementById('end');
    const s = document.getElementById('s');
    const e = document.getElementById('e');
    const loopBtn = document.getElementById('loop');
    const stopBtn = document.getElementById('stop');
    const extractBtn = document.getElementById('extractBtn');

    let looping = false, from = 0, to = 0;
    let currentFile = null;
    let isVideo = false;

    f.onchange = () => {
      const file = f.files[0];
      if (!file) return;

      currentFile = file;
      isVideo = file.type.startsWith('video/');

      // Switch element if needed
      const newMedia = document.createElement(isVideo ? 'video' : 'audio');
      newMedia.id = 'media';
      newMedia.controls = true;
      newMedia.playsInline = true;
      if (isVideo) newMedia.style.aspectRatio = '16/9';
      media.replaceWith(newMedia);
      window.media = newMedia; // update reference

      // Re-bind events
      bindMediaEvents(newMedia);

      newMedia.src = URL.createObjectURL(file);
      extractBtn.style.display = isVideo ? 'inline-block' : 'none';
    };

    function bindMediaEvents(el) {
      el.onloadedmetadata = () => {
        const d = el.duration;
        [start, end, s, e, loopBtn].forEach(x => x.disabled = false);
        start.max = end.max = s.max = e.max = d;
        end.value = e.value = d.toFixed(1);
        start.value = s.value = 0;
      };

      el.ontimeupdate = () => {
        if (looping && el.currentTime >= to) el.currentTime = from;
      };
    }

    // Initial bind
    bindMediaEvents(media);

    function sync(fromSlider) {
      let a = +start.value, b = +end.value;
      if (fromSlider) {
        a = +s.value;
        b = +e.value;
      }
      if (a >= b) a = Math.max(0, b - 0.5);
      start.value = s.value = a.toFixed(1);
      end.value = e.value = b.toFixed(1);
    }

    s.oninput = e.oninput = () => sync(true);
    start.onchange = end.onchange = () => sync(false);

    loopBtn.onclick = () => {
      const el = document.getElementById('media');
      from = +start.value;
      to = +end.value;
      if (to <= from) return;
      looping = true;
      el.currentTime = from;
      el.play();
      loopBtn.disabled = true;
      stopBtn.disabled = false;
    };

    stopBtn.onclick = () => {
      const el = document.getElementById('media');
      looping = false;
      el.pause();
      loopBtn.disabled = false;
      stopBtn.disabled = true;
    };

    // ===== Extract Audio (to WAV) =====
    extractBtn.onclick = async () => {
      if (!currentFile || !isVideo) return;

      extractBtn.disabled = true;
      extractBtn.textContent = 'Extracting...';

      try {
        const arrayBuffer = await currentFile.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        // Convert to WAV
        const wav = audioBufferToWav(audioBuffer);
        const blob = new Blob([wav], { type: 'audio/wav' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = (currentFile.name.replace(/\.[^/.]+$/, '') || 'audio') + '.wav';
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        alert('Failed to extract audio: ' + err.message);
      }

      extractBtn.disabled = false;
      extractBtn.textContent = 'Extract Audio';
    };

    // Helper: AudioBuffer → WAV
    function audioBufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const bufferArray = new ArrayBuffer(length);
      const view = new DataView(bufferArray);
      const channels = [];
      let pos = 0;

      setUint32(0x46464952); // "RIFF"
      setUint32(length - 8);
      setUint32(0x45564157); // "WAVE"
      setUint32(0x20746d66); // "fmt "
      setUint32(16);
      setUint16(1); // PCM
      setUint16(numOfChan);
      setUint32(buffer.sampleRate);
      setUint32(buffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);
      setUint32(0x61746164); // "data"
      setUint32(length - 44);

      for (let i = 0; i < buffer.numberOfChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }

      let offset = 0;
      while (pos < length) {
        for (let i = 0; i < numOfChan; i++) {
          let sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
          view.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return bufferArray;

      function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
    }
  </script>
</body>
</html>
