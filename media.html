<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest-media.json">
  <title>Media Loop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #ddd;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .media-wrapper {
      width: 100%;
      max-width: 800px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 120px;
    }
    #media {
      width: 100%;
      max-height: 70vh;
    }
    video#media { aspect-ratio: 16/9; }
    audio#media { width: 100%; padding: 20px; }
    .controls {
      width: 100%;
      max-width: 800px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    input[type="file"] { display: none; }
    label, button {
      background: #333;
      color: #eee;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      white-space: nowrap;
    }
    label:hover, button:hover { background: #444; }
    button:disabled { opacity: 0.4; cursor: default; }
    .times {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 16px;
    }
    .times input {
      width: 90px;
      background: #222;
      border: 1px solid #444;
      color: #eee;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 16px;
    }
    input[type="range"] {
      flex: 1;
      max-width: 320px;
      min-width: 120px;
      height: 8px;
      -webkit-appearance: none;
      appearance: none;
      background: #333;
      border-radius: 4px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      background: #6c5ce7;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      background: #6c5ce7;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    .logo {
      margin-top: auto;
      margin-bottom: 30px;
      padding-top: 40px;
    }
    .logo img {
      width: 38px;
      height: 38px;
      display: block;
    }
    .progress-container {
      width: 100%;
      max-width: 800px;
      margin-top: 10px;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
      display: none;
    }
    .progress-bar.active { display: block; }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #6c5ce7;
      transition: width 0.2s;
    }
    .status-text {
      font-size: 14px;
      color: #888;
      margin-top: 8px;
      text-align: center;
      display: none;
    }
    .status-text.active { display: block; }
    .extract-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .format-selector, .quality-selector {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #222;
      padding: 8px 16px;
      border-radius: 8px;
    }
    .format-selector label {
      background: transparent;
      padding: 4px 12px;
      font-size: 14px;
    }
    .quality-selector select {
      background: #333;
      color: #eee;
      border: 1px solid #444;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .size-info {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="media-wrapper">
    <video id="media" controls playsinline></video>
  </div>

  <div class="controls">
    <div class="row">
      <label for="f">📁 Choose media</label>
      <!-- Сняты строгости accept для мобильного Safari/iOS -->
      <input type="file" id="f" accept="video/*,audio/*,.mov,.mp4,.m4a,.mp3,.wav,.aac,.ogg,.flac">
      <div class="times">
        <input type="number" id="start" value="0" step="0.1" min="0" disabled> –
        <input type="number" id="end" value="0" step="0.1" min="0" disabled>
      </div>
    </div>
    <div class="row">
      <input type="range" id="s" min="0" max="100" step="0.1" value="0" disabled>
      <input type="range" id="e" min="0" max="100" step="0.1" value="100" disabled>
    </div>
    <div class="buttons">
      <div class="row">
        <button id="loop" disabled>🔁 Loop</button>
        <button id="stop" disabled>⏹ Stop</button>
      </div>

      <div class="extract-options" id="extractOptions" style="display:none;">
        <div class="format-selector">
          <label><input type="radio" name="format" value="wav" checked> <span>WAV</span></label>
          <label><input type="radio" name="format" value="mp3"> <span>MP3</span></label>
        </div>
        <div class="quality-selector" id="qualitySelector" style="display:none;">
          <span>Bitrate:</span>
          <select id="mp3Quality">
            <option value="128">128 kbps</option>
            <option value="192" selected>192 kbps</option>
            <option value="256">256 kbps</option>
            <option value="320">320 kbps</option>
          </select>
        </div>
        <button id="extractBtn">🎵 Extract Audio</button>
      </div>
      <div class="size-info" id="sizeInfo"></div>
    </div>
  </div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="status-text" id="statusText">Processing...</div>
  </div>

  <a href="research.html" class="logo">
    <img src="logo.png" alt="Logo" width="38" height="38">
  </a>

  <script>
    const f = document.getElementById('f');
    const start = document.getElementById('start');
    const end = document.getElementById('end');
    const s = document.getElementById('s');
    const e = document.getElementById('e');
    const loopBtn = document.getElementById('loop');
    const stopBtn = document.getElementById('stop');
    const extractBtn = document.getElementById('extractBtn');
    const extractOptions = document.getElementById('extractOptions');
    const qualitySelector = document.getElementById('qualitySelector');
    const mp3Quality = document.getElementById('mp3Quality');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const sizeInfo = document.getElementById('sizeInfo');
    
    let media = document.getElementById('media');
    let looping = false, from = 0, to = 0;
    let currentFile = null;
    let objectUrl = null;

    // Переключение отображения выбора качества MP3
    document.querySelectorAll('input[name="format"]').forEach(radio => {
      radio.addEventListener('change', (evt) => {
        qualitySelector.style.display = evt.target.value === 'mp3' ? 'flex' : 'none';
      });
    });

    f.onchange = () => {
      const file = f.files[0];
      if (!file) return;

      if (objectUrl) URL.revokeObjectURL(objectUrl);
      currentFile = file;
      objectUrl = URL.createObjectURL(file);

      // Проверка типа файла для отображения меню извлечения
      const isVideo = file.type.startsWith('video/') || /\.(mov|mp4|webm|m4v|avi)$/i.test(file.name);
      
      // Заменяем элемент медиа аккуратно без разрушения UI
      const newType = isVideo ? 'video' : 'audio';
      if (media.tagName.toLowerCase() !== newType) {
        const newMedia = document.createElement(newType);
        newMedia.id = 'media';
        newMedia.controls = true;
        newMedia.playsInline = true;
        media.replaceWith(newMedia);
        media = newMedia;
      }

      media.src = objectUrl;
      media.addEventListener('loadedmetadata', onLoaded);
      media.addEventListener('timeupdate', onTimeUpdate);

      extractOptions.style.display = 'flex'; // Позволяем извлекать/перекодировать аудио из любого файла
      const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
      sizeInfo.textContent = `File size: ${sizeMB} MB`;
    };

    function onLoaded() {
      const d = media.duration;
      if (!isFinite(d)) return;
      [start, end, s, e, loopBtn].forEach(el => el.disabled = false);
      start.max = end.max = s.max = e.max = d;
      end.value = e.value = d.toFixed(1);
      start.value = s.value = 0;
    }

    function onTimeUpdate() {
      if (looping && media.currentTime >= to) {
        media.currentTime = from;
      }
    }

    function sync(fromSlider) {
      let a = +start.value, b = +end.value;
      if (fromSlider) { a = +s.value; b = +e.value; }
      if (a >= b) a = Math.max(0, b - 0.5);
      start.value = s.value = a.toFixed(1);
      end.value = e.value = b.toFixed(1);
    }

    s.oninput = e.oninput = () => sync(true);
    start.onchange = end.onchange = () => sync(false);

    loopBtn.onclick = () => {
      from = +start.value;
      to = +end.value;
      if (to <= from) return;
      looping = true;
      media.currentTime = from;
      media.play();
      loopBtn.disabled = true;
      stopBtn.disabled = false;
    };

    stopBtn.onclick = () => {
      looping = false;
      media.pause();
      loopBtn.disabled = false;
      stopBtn.disabled = true;
    };

    // ПРЯМОЕ ДЕКОДИРОВАНИЕ АУДИО ИЗ ВИДЕО/АУДИО ФАЙЛА
    async function decodeAudioFromFile(file) {
      const arrayBuffer = await file.arrayBuffer();
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      statusText.textContent = 'Decoding audio stream...';
      progressFill.style.width = '40%';

      try {
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        await audioCtx.close();
        return audioBuffer;
      } catch (err) {
        await audioCtx.close();
        throw new Error('Unable to decode audio from file. Format may not be supported by browser engine.');
      }
    }

    // Извлечение аудио
    extractBtn.onclick = async () => {
      if (!currentFile) return;

      const format = document.querySelector('input[name="format"]:checked').value;
      const bitrate = parseInt(mp3Quality.value);

      extractBtn.disabled = true;
      progressBar.classList.add('active');
      statusText.classList.add('active');
      progressFill.style.width = '10%';
      statusText.textContent = 'Reading file...';

      try {
        // 1. Декодируем аудиопоток напрямую из видео
        const audioBuffer = await decodeAudioFromFile(currentFile);
        
        progressFill.style.width = '70%';
        statusText.textContent = `Converting to ${format.toUpperCase()}...`;

        let resultBlob;
        if (format === 'mp3') {
          resultBlob = await convertBufferToMp3(audioBuffer, bitrate);
        } else {
          resultBlob = audioBufferToWav(audioBuffer);
        }

        progressFill.style.width = '100%';
        statusText.textContent = '✅ Extraction complete!';

        const ext = format === 'mp3' ? 'mp3' : 'wav';
        const baseName = currentFile.name.replace(/\.[^/.]+$/, '');
        downloadBlob(resultBlob, `${baseName}_audio.${ext}`);

      } catch (err) {
        console.error(err);
        alert('Extraction failed: ' + err.message);
      } finally {
        setTimeout(() => {
          extractBtn.disabled = false;
          progressBar.classList.remove('active');
          statusText.classList.remove('active');
        }, 1200);
      }
    };

    // Конвертация AudioBuffer в WAV (16-bit PCM)
    function audioBufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      let channels = [], sample, offset = 0, pos = 0;

      function writeString(str) {
        for (let i = 0; i < str.length; i++) {
          out.setUint8(pos++, str.charCodeAt(i));
        }
      }

      writeString('RIFF');
      out.setUint32(pos, length - 8, true); pos += 4;
      writeString('WAVE');
      writeString('fmt ');
      out.setUint32(pos, 16, true); pos += 4; // SubChunk1Size
      out.setUint16(pos, 1, true); pos += 2;  // PCM
      out.setUint16(pos, numOfChan, true); pos += 2;
      out.setUint32(pos, sampleRate, true); pos += 4;
      out.setUint32(pos, sampleRate * numOfChan * 2, true); pos += 4; // ByteRate
      out.setUint16(pos, numOfChan * 2, true); pos += 2; // BlockAlign
      out.setUint16(pos, 16, true); pos += 2; // BitsPerSample
      writeString('data');
      out.setUint32(pos, length - pos - 4, true); pos += 4;

      for (let i = 0; i < buffer.numberOfChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return new Blob([out], { type: 'audio/wav' });
    }

    // Конвертация AudioBuffer в MP3 (через LameJS)
    async function convertBufferToMp3(audioBuffer, bitrate) {
      if (typeof lamejs === 'undefined') {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js';
          script.onload = resolve;
          script.onerror = () => reject(new Error('Failed to load MP3 encoder library.'));
          document.head.appendChild(script);
        });
      }

      const channels = audioBuffer.numberOfChannels;
      const sampleRate = audioBuffer.sampleRate;
      const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, bitrate);
      const mp3Data = [];

      const left = audioBuffer.getChannelData(0);
      const right = channels > 1 ? audioBuffer.getChannelData(1) : left;

      // Перевод float32 в int16
      const sampleCount = audioBuffer.length;
      const leftInt16 = new Int16Array(sampleCount);
      const rightInt16 = new Int16Array(sampleCount);

      for (let i = 0; i < sampleCount; i++) {
        let sL = Math.max(-1, Math.min(1, left[i]));
        leftInt16[i] = sL < 0 ? sL * 0x8000 : sL * 0x7FFF;
        let sR = Math.max(-1, Math.min(1, right[i]));
        rightInt16[i] = sR < 0 ? sR * 0x8000 : sR * 0x7FFF;
      }

      const chunkSize = 1152;
      for (let i = 0; i < sampleCount; i += chunkSize) {
        const leftChunk = leftInt16.subarray(i, i + chunkSize);
        let mp3buf;
        if (channels === 2) {
          const rightChunk = rightInt16.subarray(i, i + chunkSize);
          mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
        } else {
          mp3buf = mp3encoder.encodeBuffer(leftChunk);
        }
        if (mp3buf.length > 0) mp3Data.push(mp3buf);
      }

      const endBuf = mp3encoder.flush();
      if (endBuf.length > 0) mp3Data.push(endBuf);

      return new Blob(mp3Data, { type: 'audio/mp3' });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1000);
    }
  </script>
</body>
</html>
