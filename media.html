<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="media.png">
  <link rel="manifest" href="manifest-media.json">
  <title>Media Loop DJ Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #ddd;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .media-wrapper {
      width: 100%;
      max-width: 800px;
      background: linear-gradient(145deg, #16161a, #0a0a0c);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
      border: 1px solid #2a2a35;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    #media {
      width: 100%;
      max-height: 60vh;
    }
    video#media { aspect-ratio: 16/9; }

    .controls {
      width: 100%;
      max-width: 800px;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .timeline-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .custom-slider {
      width: 100%;
      height: 16px;
      -webkit-appearance: none;
      appearance: none;
      background: #252525;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }
    .custom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      background: #6c5ce7;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 0 10px rgba(108, 92, 231, 0.5);
    }
    .custom-slider::-moz-range-thumb {
      width: 28px;
      height: 28px;
      background: #6c5ce7;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #fff;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .primary-btn, label.upload-label {
      background: #6c5ce7;
      color: #fff;
      border: none;
      padding: 16px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .primary-btn:active, label.upload-label:active { transform: scale(0.97); }
    
    .cue-btn {
      background: #fdcb6e;
      color: #111;
    }
    .cue-btn.active {
      background: #ffeaa7;
      box-shadow: 0 0 16px #fdcb6e;
    }

    .loop-btn {
      background: #333;
      color: #eee;
    }
    .loop-btn.active {
      background: #00b894;
      color: #fff;
      box-shadow: 0 0 14px #00b894;
    }

    .secondary-btn {
      background: #333;
      color: #eee;
      border: none;
      padding: 16px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      transition: background 0.1s;
    }

    .stop-btn {
      background: #bb3979;
      color: #fff;
    }
    .secondary-btn:active { background: #444; }
    .secondary-btn:disabled, .primary-btn:disabled { opacity: 0.3; cursor: default; transform: none; }

    .time-control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .time-buttons-row {
      display: flex;
      gap: 4px;
      width: 100%;
    }

    .step-btn {
      flex: 1;
      height: 26px;
      background: #25252c;
      border: 1px solid #3a3a45;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-btn:hover { background: #353540; }
    .step-btn:active { transform: scale(0.95); }
    .step-btn:disabled { opacity: 0.3; cursor: default; transform: none; }

    .triangle-left {
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-right: 7px solid #aaa;
    }
    .step-btn:hover .triangle-left { border-right-color: #fff; }

    .triangle-right {
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 7px solid #aaa;
    }
    .step-btn:hover .triangle-right { border-left-color: #fff; }

    input[type="file"] { display: none; }

    .times {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 18px;
      width: 100%;
      justify-content: center;
    }
    .times input::-webkit-outer-spin-button,
    .times input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .times input {
      width: 84px;
      background: #222;
      border: 1px solid #444;
      color: #eee;
      padding: 10px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      outline: none;
      -moz-appearance: textfield;
      text-align: center;
      text-align-last: center;
    }

    .range-container {
      position: relative;
      width: 100%;
      height: 30px;
      display: grid;
      align-items: center;
    }

    .range-slider-multi {
      grid-area: 1 / 1;
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      background: none;
      pointer-events: none;
      outline: none;
      margin: 0;
    }

    .range-track-bg {
      grid-area: 1 / 1;
      height: 8px;
      background: #252525;
      border-radius: 4px;
      width: 100%;
    }

    .range-slider-multi::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      pointer-events: auto;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #a29bfe;
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 0 6px rgba(162, 155, 254, 0.8);
    }

    .range-slider-multi::-moz-range-thumb {
      pointer-events: auto;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #a29bfe;
      cursor: pointer;
      border: 2px solid #fff;
    }

    .range-highlight {
      grid-area: 1 / 1;
      height: 8px;
      background: linear-gradient(90deg, #00b894, #6c5ce7);
      border-radius: 4px;
      pointer-events: none;
      z-index: 1;
      width: 0%;
      left: 0%;
      position: relative;
      box-shadow: 0 0 10px rgba(0, 184, 148, 0.4);
    }

    .cue-marker {
      position: absolute;
      top: -4px;
      bottom: -4px;
      width: 3px;
      background: #fdcb6e;
      z-index: 3;
      pointer-events: none;
      border-radius: 2px;
      box-shadow: 0 0 8px #fdcb6e;
      display: none;
    }
    .cue-marker::after {
      content: '';
      position: absolute;
      top: -6px;
      left: -4px;
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 6px solid #fdcb6e;
    }

    .range-slider-multi { z-index: 2; }

    #s::-webkit-slider-thumb { background: #00b894; }
    #s::-moz-range-thumb { background: #00b894; }
    #e::-webkit-slider-thumb { background: #ff7675; }
    #e::-moz-range-thumb { background: #ff7675; }

    .extract-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      margin-top: 10px;
    }
    .format-selector {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #222;
      padding: 10px 16px;
      border-radius: 8px;
    }

    .quality-selector {
      display: flex;
      gap: 8px;
      align-items: center;
      background: transparent; 
      padding: 0;              
      border: none;           
    }

    .progress-container {
      width: 100%;
      max-width: 800px;
      margin-top: 12px;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
      display: none;
    }
    .progress-bar.active { display: block; }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #6c5ce7;
      transition: width 0.2s;
    }
    
    .status-text {
      font-size: 14px;
      color: #aaa;
      margin-top: 8px;
      text-align: center;
      display: none;
    }
    .status-text.active { display: block; }

    .logo {
      margin-top: auto;
      margin-bottom: 40px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
      text-decoration: none;
    }
    .logo img {
      width: 44px;
      height: 44px;
      display: block;
    }
    .logo-tip {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: #999;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="media-wrapper">
    <video id="media" controls playsinline></video>
  </div>

  <div class="controls">
    <div class="timeline-container">
      <input type="range" id="seekBar" class="custom-slider" value="0" min="0" max="100" step="0.01" disabled>
    </div>

    <div class="row">
      <label for="f" class="upload-label">Choose media</label>
      <input type="file" id="f" accept="video/*,audio/*,.mov,.mp4,.m4a,.mp3,.wav,.aac,.ogg,.flac">
    </div>

    <div class="row">
      <div class="times">
        <div class="time-control-group">
          <input type="number" id="start" value="0" step="0.01" min="0" disabled>
          <div class="time-buttons-row">
            <button class="step-btn" id="stepStartMinus" title=" -0.01s " disabled><div class="triangle-left"></div></button>
            <button class="step-btn" id="stepStartPlus" title=" +0.01s " disabled><div class="triangle-right"></div></button>
          </div>
        </div>

        –

        <div class="time-control-group">
          <input type="number" id="end" value="0" step="0.01" min="0" disabled>
          <div class="time-buttons-row">
            <button class="step-btn" id="stepEndMinus" title=" -0.01s " disabled><div class="triangle-left"></div></button>
            <button class="step-btn" id="stepEndPlus" title=" +0.01s " disabled><div class="triangle-right"></div></button>
          </div>
        </div>
      </div>
    </div>

    <div class="range-container">
      <div class="range-track-bg"></div>
      <div class="range-highlight" id="rangeHighlight"></div>
      <div class="cue-marker" id="cueMarker"></div>
      <input type="range" id="s" class="range-slider-multi" min="0" max="100" step="0.01" value="0" disabled>
      <input type="range" id="e" class="range-slider-multi" min="0" max="100" step="0.01" value="100" disabled>
    </div>

    <div class="row">
      <button id="cueBtn" class="primary-btn cue-btn" disabled>Cue</button>
      <button id="playBtn" class="primary-btn" disabled>Play</button>
      <button id="loopBtn" class="primary-btn loop-btn" disabled>Loop</button>
      <button id="stopBtn" class="secondary-btn stop-btn" disabled>Stop</button>
    </div>

    <div class="extract-options" id="extractOptions" style="display:none;">
      <div class="format-selector">
        <label><input type="radio" name="format" value="wav" checked> <span>WAV</span></label>
        <label><input type="radio" name="format" value="mp3"> <span>MP3</span></label>
      </div>
      <div class="quality-selector" id="qualitySelector" style="display:none;">
        <span>Bitrate:</span>
        <select id="mp3Quality">
          <option value="128">128 kbps</option>
          <option value="192" selected>192 kbps</option>
          <option value="256">256 kbps</option>
          <option value="320">320 kbps</option>
        </select>
      </div>
      <button id="extractBtn" class="secondary-btn">Extract Audio</button>
    </div>
    <div class="status-text" id="sizeInfo" style="display:block;"></div>
  </div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="status-text" id="statusText">Processing...</div>
  </div>

  <a href="research.html" class="logo" id="logoBtn" title="Hold to update app">
     <img src="logo.png" alt="Logo">
     <span class="logo-tip">Hold to update</span>
  </a>

  <script>
    const DB_NAME = 'MediaLoopDB';
    const STORE_NAME = 'mediaStore';
    const SETTINGS_PREFIX = 'mediaLoop_settings_';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 2);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
        };
        req.onsuccess = () => {
          const db = req.result;
          db.onversionchange = () => db.close();
          resolve(db);
        };
        req.onerror = () => reject(req.error);
      });
    }

    async function saveMediaToDB(file, startVal, endVal, cueVal = 0) {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put({ file, name: file.name, type: file.type, start: startVal, end: endVal, cue: cueVal }, 'cachedMedia');
      return tx.complete;
    }

    async function getMediaFromDB() {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get('cachedMedia');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    const f = document.getElementById('f');
    const start = document.getElementById('start');
    const end = document.getElementById('end');
    const s = document.getElementById('s');
    const e = document.getElementById('e');
    const seekBar = document.getElementById('seekBar');
    const rangeHighlight = document.getElementById('rangeHighlight');
    const cueMarker = document.getElementById('cueMarker');
    const cueBtn = document.getElementById('cueBtn');
    const playBtn = document.getElementById('playBtn');
    const loopBtn = document.getElementById('loopBtn');
    const stopBtn = document.getElementById('stopBtn');
    const extractBtn = document.getElementById('extractBtn');
    const extractOptions = document.getElementById('extractOptions');
    const qualitySelector = document.getElementById('qualitySelector');
    const mp3Quality = document.getElementById('mp3Quality');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const sizeInfo = document.getElementById('sizeInfo');
    const logoBtn = document.getElementById('logoBtn');

    const stepStartMinus = document.getElementById('stepStartMinus');
    const stepStartPlus = document.getElementById('stepStartPlus');
    const stepEndMinus = document.getElementById('stepEndMinus');
    const stepEndPlus = document.getElementById('stepEndPlus');
    
    let media = document.getElementById('media');
    let isLoopActive = false;
    let cueTime = 0;
    let currentFile = null;
    let objectUrl = null;
    let isCueHolding = false;

    function updateRangeHighlight() {
      const max = parseFloat(s.max) || 1;
      const valS = parseFloat(s.value) || 0;
      const valE = parseFloat(e.value) || max;
      
      const leftPercent = (valS / max) * 100;
      const widthPercent = ((valE - valS) / max) * 100;
      
      rangeHighlight.style.left = leftPercent + '%';
      rangeHighlight.style.width = widthPercent + '%';

      if (media.duration && isFinite(media.duration)) {
        const cuePercent = (cueTime / max) * 100;
        cueMarker.style.left = cuePercent + '%';
        cueMarker.style.display = 'block';
      }
    }

    function saveCurrentSettings() {
      if (!currentFile) return;
      const settings = {
        fileName: currentFile.name,
        start: start.value,
        end: end.value,
        s: s.value,
        e: e.value,
        cueTime: cueTime
      };
      localStorage.setItem('mediaLoop_lastFile', currentFile.name);
      localStorage.setItem(SETTINGS_PREFIX + currentFile.name, JSON.stringify(settings));
    }

    document.querySelectorAll('input[name="format"]').forEach(radio => {
      radio.addEventListener('change', (evt) => {
        qualitySelector.style.display = evt.target.value === 'mp3' ? 'flex' : 'none';
      });
    });

    window.addEventListener('DOMContentLoaded', async () => {
      const lastFileName = localStorage.getItem('mediaLoop_lastFile');
      if (lastFileName) {
        const savedDataStr = localStorage.getItem(SETTINGS_PREFIX + lastFileName);
        if (savedDataStr) {
          try {
            const cfg = JSON.parse(savedDataStr);
            
            [start, end, s, e].forEach(el => el.disabled = false);
            [stepStartMinus, stepStartPlus, stepEndMinus, stepEndPlus].forEach(el => el.disabled = false);
            start.value = cfg.start || 0;
            end.value = cfg.end || 0;
            s.value = cfg.s || 0;
            e.value = cfg.e || 100;
            cueTime = cfg.cueTime || cfg.start || 0;
            updateRangeHighlight();

            sizeInfo.innerHTML = `🎵 Последний файл: <b style="color:#fff;">${lastFileName}</b>. Выберите его снова для старта.`;
            sizeInfo.style.display = 'block';
            sizeInfo.style.color = '#fdcb6e';
            sizeInfo.style.background = 'rgba(253, 203, 110, 0.08)';
            sizeInfo.style.padding = '8px 12px';
            sizeInfo.style.borderRadius = '8px';
            sizeInfo.style.border = '1px dashed #fdcb6e44';
          } catch (err) {
            console.error('Ошибка чтения настроек', err);
          }
        }
      }

      const cached = await getMediaFromDB();
      if (cached && cached.file) {
        loadMediaFile(cached.file, cached.start, cached.end, cached.cue, cached.start, cached.end);
      }
    });

    f.onchange = () => {
      const file = f.files[0];
      if (!file) return;

      const savedDataStr = localStorage.getItem(SETTINGS_PREFIX + file.name);
      let savedStart = 0, savedEnd = null, savedCue = 0, savedS = null, savedE = null;

      if (savedDataStr) {
        try {
          const cfg = JSON.parse(savedDataStr);
          savedStart = parseFloat(cfg.start) || 0;
          savedEnd = parseFloat(cfg.end) || null;
          savedCue = parseFloat(cfg.cueTime) || savedStart;
          savedS = parseFloat(cfg.s) || null;
          savedE = parseFloat(cfg.e) || null;
        } catch (err) {
          console.error('Ошибка чтения настроек для файла:', err);
        }
      }

      loadMediaFile(file, savedStart, savedEnd, savedCue, savedS, savedE);
    };

    function loadMediaFile(file, savedStart = 0, savedEnd = null, savedCue = 0, savedS = null, savedE = null) {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      currentFile = file;
      objectUrl = URL.createObjectURL(file);

      const isVideo = file.type.startsWith('video/') || /\.(mov|mp4|webm|m4v|avi)$/i.test(file.name);
      const newType = isVideo ? 'video' : 'audio';

      if (media.tagName.toLowerCase() !== newType) {
        const newMedia = document.createElement(newType);
        newMedia.id = 'media';
        newMedia.controls = true;
        newMedia.playsInline = true;
        media.replaceWith(newMedia);
        media = newMedia;
      }

      media.src = objectUrl;
      
      media.addEventListener('loadedmetadata', () => onLoaded(savedStart, savedEnd, savedCue, savedS, savedE), { once: true });
      media.addEventListener('timeupdate', onTimeUpdate);

      initMediaSession();

      extractOptions.style.display = 'flex';
      sizeInfo.textContent = `File: ${file.name} (${(file.size / 1048576).toFixed(1)} MB)`;
      
      saveCurrentSettings(); 
    }

    function onLoaded(savedStart, savedEnd, savedCue, savedS, savedE) {
      const d = media.duration;
      if (!isFinite(d)) return;

      [start, end, s, e, seekBar, cueBtn, playBtn, loopBtn, stopBtn].forEach(el => el.disabled = false);
      [stepStartMinus, stepStartPlus, stepEndMinus, stepEndPlus].forEach(el => el.disabled = false);
      
      start.max = end.max = s.max = e.max = seekBar.max = d;
      
      const startVal = (savedStart !== undefined && savedStart <= d) ? savedStart : 0;
      const endVal = (savedEnd !== null && savedEnd <= d) ? savedEnd : d;

      start.value = startVal.toFixed(2);
      end.value = endVal.toFixed(2);
      
      s.value = (savedS !== null && savedS <= d) ? savedS.toFixed(2) : startVal.toFixed(2);
      e.value = (savedE !== null && savedE <= d) ? savedE.toFixed(2) : endVal.toFixed(2);

      cueTime = (savedCue !== undefined && savedCue <= d) ? savedCue : startVal;
      updateRangeHighlight();

      media.currentTime = cueTime;
      seekBar.value = cueTime;

      saveMediaToDB(currentFile, startVal, endVal, cueTime);
      saveCurrentSettings();
    }

    function initMediaSession() {
      if (!('mediaSession' in navigator)) return;

      const fileName = currentFile ? currentFile.name : 'Track';

      navigator.mediaSession.metadata = new MediaMetadata({
        title: fileName,
        artist: 'Media Loop DJ',
        album: 'DJ Edition',
        artwork: [
          { src: 'logo.png', sizes: '512x512', type: 'image/png' }
        ]
      });

      navigator.mediaSession.setActionHandler('play', () => { media.play(); });
      navigator.mediaSession.setActionHandler('pause', () => { media.pause(); });
      navigator.mediaSession.setActionHandler('stop', () => { stopBtn.click(); });
      navigator.mediaSession.setActionHandler('seekto', (details) => {
        if (details.seekTime !== undefined) {
          media.currentTime = details.seekTime;
        }
      });
    }

    function updateMediaSessionPosition() {
      if (!('mediaSession' in navigator) || !media.duration || !isFinite(media.duration)) return;
      try {
        navigator.mediaSession.setPositionState({
          duration: media.duration,
          playbackRate: media.playbackRate,
          position: media.currentTime
        });
      } catch (e) {}
    }

    function onTimeUpdate() {
      if (!media.duration) return;
      seekBar.value = media.currentTime;

      const from = +start.value;
      const to = +end.value;

      if (isLoopActive && media.currentTime >= to) {
        media.currentTime = from;
        media.play();
      }

      playBtn.textContent = media.paused ? 'Play' : 'Pause';
      updateMediaSessionPosition();
    }

    seekBar.oninput = () => {
      media.currentTime = seekBar.value;
    };

function sync(fromSlider) {
      let a = +start.value, b = +end.value;
      if (fromSlider) { 
        a = +s.value; 
        b = +e.value; 
        if (a >= b) a = Math.max(0, b - 0.05);
        start.value = a.toFixed(2);
        end.value = b.toFixed(2);
      } else {
        if (a >= b) a = Math.max(0, b - 0.05);
      }
      
      s.value = a;
      e.value = b;

      updateRangeHighlight();

      if (currentFile) saveMediaToDB(currentFile, a, b, cueTime);
      saveCurrentSettings(); 
    }

    s.oninput = e.oninput = () => sync(true);
    
    start.oninput = end.oninput = () => {
      let a = parseFloat(start.value);
      let b = parseFloat(end.value);
      if (!isNaN(a)) s.value = a;
      if (!isNaN(b)) e.value = b;
      updateRangeHighlight();
    };

    start.onchange = end.onchange = () => {
      let a = parseFloat(start.value) || 0;
      let b = parseFloat(end.value) || 0;
      if (a >= b) a = Math.max(0, b - 0.05);
      start.value = a.toFixed(2);
      end.value = b.toFixed(2);
      sync(false);
    };

    function adjustTime(inputElement, delta) {
      if (!media.duration) return;
      let val = parseFloat(inputElement.value) || 0;
      val = Math.max(0, Math.min(media.duration, val + delta));
      inputElement.value = val.toFixed(2);
      
      if (inputElement === start) s.value = inputElement.value;
      if (inputElement === end) e.value = inputElement.value;
      
      sync(false);
    }

    stepStartMinus.onclick = () => adjustTime(start, -0.01);
    stepStartPlus.onclick = () => adjustTime(start, 0.01);
    stepEndMinus.onclick = () => adjustTime(end, -0.01);
    stepEndPlus.onclick = () => adjustTime(end, 0.01);

    function handleCuePress(e) {
      e.preventDefault();
      if (!media.duration) return;

      if (!media.paused) {
        media.pause();
        media.currentTime = cueTime;
      } else {
        isCueHolding = true;
        cueTime = media.currentTime;
        media.currentTime = cueTime;
        media.play();
        cueBtn.classList.add('active');
        updateRangeHighlight();
        if (currentFile) saveMediaToDB(currentFile, +start.value, +end.value, cueTime);
        saveCurrentSettings();
      }
    }

    function handleCueRelease(e) {
      e.preventDefault();
      if (isCueHolding) {
        isCueHolding = false;
        media.pause();
        media.currentTime = cueTime;
        cueBtn.classList.remove('active');
      }
    }

    cueBtn.addEventListener('mousedown', handleCuePress);
    cueBtn.addEventListener('mouseup', handleCueRelease);
    cueBtn.addEventListener('mouseleave', handleCueRelease);
    cueBtn.addEventListener('touchstart', handleCuePress);
    cueBtn.addEventListener('touchend', handleCueRelease);

    playBtn.onclick = () => {
      if (media.paused) media.play();
      else media.pause();
    };

    loopBtn.onclick = () => {
      isLoopActive = !isLoopActive;
      
      if (isLoopActive) {
        loopBtn.classList.add('active');
        const from = +start.value;
        const to = +end.value;
        if (media.currentTime < from || media.currentTime >= to) {
          media.currentTime = from;
        }
        if (media.paused) media.play();
      } else {
        loopBtn.classList.remove('active'); 
      }
    };

    stopBtn.onclick = () => {
      isLoopActive = false; 
      loopBtn.classList.remove('active');
      media.pause();
      media.currentTime = cueTime || +start.value; 
    };

    async function decodeAudioFromFile(file) {
      const arrayBuffer = await file.arrayBuffer();
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      statusText.textContent = 'Decoding audio stream...';
      progressFill.style.width = '40%';
      try {
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        await audioCtx.close();
        return audioBuffer;
      } catch (err) {
        await audioCtx.close();
        throw new Error('Decoding error. Unsupported media format.');
      }
    }

    extractBtn.onclick = async () => {
      if (!currentFile) return;
      const format = document.querySelector('input[name="format"]:checked').value;
      const bitrate = parseInt(mp3Quality.value);

      extractBtn.disabled = true;
      progressBar.classList.add('active');
      statusText.classList.add('active');
      progressFill.style.width = '10%';
      statusText.textContent = 'Reading file...';

      try {
        const audioBuffer = await decodeAudioFromFile(currentFile);
        progressFill.style.width = '70%';
        statusText.textContent = `Converting to ${format.toUpperCase()}...`;

        const resultBlob = format === 'mp3' 
          ? await convertBufferToMp3(audioBuffer, bitrate)
          : audioBufferToWav(audioBuffer);

        progressFill.style.width = '100%';
        statusText.textContent = 'Extraction complete!';

        const ext = format === 'mp3' ? 'mp3' : 'wav';
        const baseName = currentFile.name.replace(/\.[^/.]+$/, '');
        downloadBlob(resultBlob, `${baseName}_audio.${ext}`);
      } catch (err) {
        alert('Extraction failed: ' + err.message);
      } finally {
        setTimeout(() => {
          extractBtn.disabled = false;
          progressBar.classList.remove('active');
          statusText.classList.remove('active');
        }, 1200);
      }
    };

    function audioBufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels, sampleRate = buffer.sampleRate;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      let channels = [], sample, offset = 0, pos = 0;

      function writeString(str) {
        for (let i = 0; i < str.length; i++) out.setUint8(pos++, str.charCodeAt(i));
      }

      writeString('RIFF');
      out.setUint32(pos, length - 8, true); pos += 4;
      writeString('WAVE'); writeString('fmt ');
      out.setUint32(pos, 16, true); pos += 4;
      out.setUint16(pos, 1, true); pos += 2;
      out.setUint16(pos, numOfChan, true); pos += 2;
      out.setUint32(pos, sampleRate, true); pos += 4;
      out.setUint32(pos, sampleRate * numOfChan * 2, true); pos += 4;
      out.setUint16(pos, numOfChan * 2, true); pos += 2;
      out.setUint16(pos, 16, true); pos += 2;
      writeString('data');
      out.setUint32(pos, length - pos - 4, true); pos += 4;

      for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true); pos += 2;
        }
        offset++;
      }
      return new Blob([out], { type: 'audio/wav' });
    }

    async function convertBufferToMp3(audioBuffer, bitrate) {
      if (typeof lamejs === 'undefined') {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js';
          script.onload = resolve;
          script.onerror = () => reject(new Error('Failed to load MP3 library.'));
          document.head.appendChild(script);
        });
      }

      const channels = audioBuffer.numberOfChannels;
      const mp3encoder = new lamejs.Mp3Encoder(channels, audioBuffer.sampleRate, bitrate);
      const mp3Data = [];
      const left = audioBuffer.getChannelData(0);
      const right = channels > 1 ? audioBuffer.getChannelData(1) : left;
      const sampleCount = audioBuffer.length;

      const leftInt16 = new Int16Array(sampleCount);
      const rightInt16 = new Int16Array(sampleCount);

      for (let i = 0; i < sampleCount; i++) {
        let sL = Math.max(-1, Math.min(1, left[i]));
        leftInt16[i] = sL < 0 ? sL * 0x8000 : sL * 0x7FFF;
        let sR = Math.max(-1, Math.min(1, right[i]));
        rightInt16[i] = sR < 0 ? sR * 0x8000 : sR * 0x7FFF;
      }

      const chunkSize = 1152;
      for (let i = 0; i < sampleCount; i += chunkSize) {
        const leftChunk = leftInt16.subarray(i, i + chunkSize);
        let mp3buf = (channels === 2) 
          ? mp3encoder.encodeBuffer(leftChunk, rightInt16.subarray(i, i + chunkSize))
          : mp3encoder.encodeBuffer(leftChunk);
        if (mp3buf.length > 0) mp3Data.push(mp3buf);
      }

      const endBuf = mp3encoder.flush();
      if (endBuf.length > 0) mp3Data.push(endBuf);

      return new Blob(mp3Data, { type: 'audio/mp3' });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    }

    // --- ЛОГИКА ОБНОВЛЕНИЯ (HOLD TO UPDATE) ПО ЛОГОТИПУ ---
    let pressTimer = null;

    function startPress(e) {
      pressTimer = setTimeout(async () => {
        e.preventDefault();
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let reg of registrations) { await reg.unregister(); }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (let key of keys) { await caches.delete(key); }
        }
        alert('Updated!');
        window.location.reload(true);
      }, 1500);
    }

    function cancelPress() {
      if (pressTimer) clearTimeout(pressTimer);
    }

    logoBtn.addEventListener('mousedown', startPress);
    logoBtn.addEventListener('mouseup', cancelPress);
    logoBtn.addEventListener('mouseleave', cancelPress);
    logoBtn.addEventListener('touchstart', startPress);
    logoBtn.addEventListener('touchend', cancelPress);
    logoBtn.addEventListener('touchcancel', cancelPress);
  </script>
</body>
