<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/loop.png">
<meta property="og:image" content="/words.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="1091">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Word Mosaic | Tap word for Definition</title>
    <link rel="manifest" href="manifest-words.json">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Roboto Condensed', sans-serif;
            transition: background-color 0.5s ease;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding: 10px;
        }

        .words-wrapper {
            flex-grow: 1;
            width: 100%;
            position: relative;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 6px 8px;
            padding: 10px;
            overflow-y: auto;
            cursor: default;
            touch-action: pan-y;
        }

.footer-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
    flex-shrink: 0;
    z-index: 10;
    padding-top: 5px;
    padding-bottom: 15px;
}

.word-cell {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    white-space: nowrap;
    background: transparent;
    border: none;
    padding: 2px 4px;
    line-height: 1;
    opacity: 0.95;
    transition: color 0.5s ease;
}

#word-input {
    width: 100%;
    max-width: 500px;
    padding: 10px 18px;
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 16px;
    outline: none;
    margin: 0 0 10px 0;
    transition: all 0.3s;
    user-select: text;
    border: 1px solid #999;
    -webkit-user-select: text;
}

        .logo-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 34px;
        }

        .logo-link img {
            height: 34px;
            width: auto;
            display: block;
        }

        #word-input::placeholder {
            color: var(--placeholder-color, #fff);
            opacity: 1;
        }
        
        .note {
    width: 100%;
    max-width: 500px;
    text-align: center;
    margin-top: 4px;
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 16px;
}

.note-toggle {
    cursor: pointer;
    color: #f00;
    user-select: none;
    -webkit-user-select: none;
}

.note-text {
    display: none;
    margin-top: 6px;
    padding: 0 10px;
    color: #fff;
    line-height: 1.3;
}

.note.open .note-text {
    display: block;
}
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <div class="words-wrapper" id="words-wrapper"></div>

<div class="footer-panel">
    <input type="text" id="word-input" placeholder="Enter words and press Enter..." autofocus>

    <a href="match.html" class="logo-link">
        <img src="star.png" alt="Логотип">
    </a>

    <div class="note" id="note">
        <div class="note-toggle" id="note-toggle">Note!</div>
        <div class="note-text">
A short tap on a word opens ChatGPT to clarify the word definition. 
Operating system or AI may retain a previous word for reasons beyond this app’s control. 
Currently selected word will be copied to the clipboard anytime, so you can paste it instead if an older word appears in the request.
        </div>
    </div>
</div>
    </div>

    <script>
        const inputField = document.getElementById('word-input');
        const displayContainer = document.getElementById('words-wrapper');
        const mainContainer = document.getElementById('main-container');
const note = document.getElementById('note');
const noteToggle = document.getElementById('note-toggle');

noteToggle.addEventListener('click', (event) => {
    event.stopPropagation();
    note.classList.toggle('open');
});

note.querySelector('.note-text').addEventListener('click', (event) => {
    event.stopPropagation();
    note.classList.remove('open');
});
        let wordsList = [];

        // Загружаем сохраненные слова из Local Storage при запуске
        const savedWords = localStorage.getItem('mosaic_words');
        if (savedWords) {
            try {
                wordsList = JSON.parse(savedWords);
            } catch (e) {
                wordsList = [];
            }
        }

const themes = [
    { bg: '#121212', inputBg: '#212121', inputColor: '#FFFFFF', inputBorder: '#999' },
    { bg: '#000033', inputBg: '#0D47A1', inputColor: '#FFFFFF', inputBorder: '#999' },
    { bg: '#1a3300', inputBg: '#1B5E20', inputColor: '#FFFFFF', inputBorder: '#999' },
    { bg: '#2b1a33', inputBg: '#4A148C', inputColor: '#FFFFFF', inputBorder: '#999' }
];

        let currentThemeIndex = 0;

        function applyTheme(theme) {
            mainContainer.style.backgroundColor = theme.bg;
            inputField.style.backgroundColor = theme.inputBg;
            inputField.style.color = theme.inputColor;
            inputField.style.setProperty('--placeholder-color', theme.inputBorder);

            const cells = document.querySelectorAll('.word-cell');
            cells.forEach((cell, index) => {
                cell.style.color = getPastelTextColor(index);
            });
        }

        function getPastelTextColor(index) {
            const hue = (index * 53 + currentThemeIndex * 70) % 360;
            return `hsl(${hue}, 65%, 80%)`;
        }

        function updateLayout() {
            displayContainer.innerHTML = '';
            
            if (wordsList.length === 0) return;

            const fragment = document.createDocumentFragment();

            const tempCells = wordsList.map((word, index) => {
                const cell = document.createElement('div');
                cell.className = 'word-cell';
                cell.textContent = word;
                cell.style.color = getPastelTextColor(index);
                cell.style.fontSize = '40px';

let pressTimer;
let pressStartTime = 0;
let longPressTriggered = false;

cell.addEventListener('pointerdown', (event) => {
    event.stopPropagation();
    pressStartTime = Date.now();
    longPressTriggered = false;

    pressTimer = setTimeout(() => {
        longPressTriggered = true;

        wordsList.splice(index, 1);
        localStorage.setItem('mosaic_words', JSON.stringify(wordsList));
        updateLayout();
    }, 600);
});

cell.addEventListener('pointerup', (event) => {
    event.stopPropagation();

    const pressDuration = Date.now() - pressStartTime;
    clearTimeout(pressTimer);

if (pressDuration < 600 && !longPressTriggered) {
    const query = `What is the definition of the word "${word}" in the interface language?`;

    navigator.clipboard.writeText(word).catch(() => {});

    window.open(
        `https://chatgpt.com/?q=${encodeURIComponent(query)}`,
        '_blank'
    );
}
});

cell.addEventListener('pointercancel', (event) => {
    event.stopPropagation();
    clearTimeout(pressTimer);
});

cell.addEventListener('pointerleave', (event) => {
    event.stopPropagation();
});
                
                fragment.appendChild(cell);
                return cell;
            });

            displayContainer.appendChild(fragment);

            requestAnimationFrame(() => {
                const containerHeight = displayContainer.clientHeight;
                const contentHeight = displayContainer.scrollHeight;

                if (contentHeight > containerHeight && containerHeight > 0) {
                    const currentSize = 40;
                    const ratio = containerHeight / contentHeight;
                    const newSize = Math.max(8, Math.floor(currentSize * ratio * 0.9));
                    
                    tempCells.forEach(cell => {
                        cell.style.fontSize = `${newSize}px`;
                    });
                }
            });
        }

        document.body.addEventListener('click', (event) => {
            if (
                event.target === inputField ||
                event.target.closest('#word-input') ||
                event.target.closest('.logo-link') ||
                event.target.closest('.word-cell')
            ) return;

            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            applyTheme(themes[currentThemeIndex]);
            updateLayout();
        });

        inputField.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const text = inputField.value.trim();
                if (text) {
                    const newWords = text.split(/\s+/).filter(w => w.length > 0);
                    if (newWords.length > 0) {
                        wordsList = wordsList.concat(newWords);
                        localStorage.setItem('mosaic_words', JSON.stringify(wordsList));
                        inputField.value = '';
                        updateLayout();
                    }
                }
            }
        });

        applyTheme(themes[0]);
        updateLayout();
    </script>
</body>
</html>
