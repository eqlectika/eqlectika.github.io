* { scrollbar-width: thin; scrollbar-color: transparent transparent; }
*::-webkit-scrollbar { width:4px; height:4px; background:transparent; }
*::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.15); border-radius:8px; }

body, html {
  margin:0; padding:0; height:100dvh; width:100vw; overflow:hidden;
  background:#000; touch-action:none; -webkit-tap-highlight-color:transparent;
}
.container {
  display:grid;
  grid-template-columns: var(--x, 50%) 1fr;
  grid-template-rows: var(--y, 50%) 1fr;
  height:100%; width:100%;
}
.editor-wrapper {
  position:relative; width:100%; height:100%; overflow:hidden;
  isolation:isolate; container-type:size; container-name:field;
}
.editor-wrapper::before {
  content:''; position:absolute; inset:0;
  background-image: var(--bg-tile, none);
  background-repeat:repeat; background-size:auto; background-position:top left;
  z-index:0; pointer-events:none;
}
.editor-wrapper::after {
  content:''; position:absolute; inset:0;
  background: var(--bg, #ff8700);
opacity: var(--bg-tint, 0.35);  z-index:1; pointer-events:none;
}
.editor-wrapper[data-tilemode="fit"]::before  { background-size:contain; background-repeat:no-repeat; background-position:center; }
.editor-wrapper[data-tilemode="fill"]::before { background-size:cover;   background-repeat:no-repeat; background-position:center; }

.editor {
  position:relative; z-index:2; width:100%; height:100%;
  background:transparent; color:var(--color);
  box-sizing:border-box; padding:34px 15px 15px 15px;
  font-size:var(--fs, 10cqmin); outline:none;
  touch-action:auto; -webkit-user-select:text; user-select:text; -webkit-touch-callout:none;
  overflow-y:auto; font-family:var(--fn, 'Inter', sans-serif);
  word-break:break-word; line-height:1.2;
}
.editor div, .editor p { margin:0.5em 0 !important; text-align:inherit; }
.editor:empty::before { content:none; }

.ph {
  position:absolute; top:34px; left:15px; right:15px; bottom:15px;
  pointer-events:auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
  touch-action:pan-y; overscroll-behavior:contain; scrollbar-width:none;
  color:var(--color); font-family:var(--fn, 'Inter', sans-serif);
  font-size:var(--fs, 10cqmin); opacity:0.7; line-height:1.2;
  word-break:break-word; z-index:3;
}
.ph::-webkit-scrollbar { display:none; }
.ph.hidden { display:none; }
.ph p { margin:0 !important; }
.ph p + p { margin-top:0.5em !important; }
.editor:not(:empty) ~ .ph { display:none; }

.img-preview {
  position:absolute; max-width:30%; max-height:30%; border-radius:4px;
  pointer-events:auto; cursor:pointer; display:none; opacity:0.7; z-index:10;
  touch-action:manipulation; -webkit-user-drag:none; user-select:none;
  -webkit-user-select:none; -webkit-touch-callout:none;
}

.handle {
  position:absolute; top:var(--y, 50%); left:var(--x, 50%);
  width:32px; height:32px;
  transform:translate(-50%, -50%) scale(1);
  z-index:100; touch-action:none; cursor:pointer;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  display:flex; align-items:center; justify-content:center;
  transition:transform 0.15s ease-out, filter 0.3s ease;
  will-change:transform;
}
.handle::before { content:''; position:absolute; inset:-12px; border-radius:50%; }
.handle:active { filter:brightness(0.85); }
.handle img {
  width:100%; height:100%; object-fit:contain; pointer-events:none;
  -webkit-user-drag:none;
  transition:transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

#settings-modal select {
  -webkit-appearance:none; -moz-appearance:none; appearance:none;
  background-color:#333 !important; color:#fff !important;
  border:1px solid #555 !important; padding:12px 16px !important;
  font-size:16px !important; border-radius:8px !important;
  width:100% !important; box-sizing:border-box !important; cursor:pointer;
}
#settings-modal select::-ms-expand { display:none; }

.img-preview.fullscreen {
  position:fixed !important; top:50% !important; left:50% !important;
  transform:translate(-50%, -50%) !important;
  max-width:90vw !important; max-height:90vh !important;
  width:auto !important; height:auto !important; object-fit:contain !important;
  z-index:99 !important; opacity:1 !important; cursor:pointer;
  box-shadow:0 0 50px rgba(0,0,0,0.8); border-radius:8px;
}
body.img-fullscreen-active .editor-wrapper { isolation:auto; z-index:auto; }

#align-toolbar { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:20px; }
.format-btn {
  padding:10px 6px; border:1px solid #555; border-radius:8px;
  background:#333; color:#fff; font-size:14px; font-weight:bold;
  cursor:pointer; min-width:0;
}
.format-btn:active { background:#555; }

#tile-mode-toolbar { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:20px; }
#tile-mode-toolbar .format-btn.active { background:#00f; border-color:#00f; color:#fff; }

#settings-modal {
  height:100dvh !important; overflow-y:auto !important;
  -webkit-overflow-scrolling:touch; touch-action:auto !important;
  box-sizing:border-box; padding:12px;
}
#settings-modal > div {
  max-height:calc(100dvh - 24px); overflow-y:auto;
  -webkit-overflow-scrolling:touch; touch-action:pan-y !important;
  box-sizing:border-box;
}
.editor:focus { -webkit-user-select:text; user-select:text; }

.font-picker { position:relative; background:#333; border:1px solid #555; border-radius:8px; padding:0; }
.font-picker-display { padding:12px 16px; color:#fff; font-size:16px; cursor:pointer; }
.font-picker-list {
  display:none; position:absolute; top:100%; left:0; right:0;
  background:#333; border:1px solid #555; border-radius:0 0 8px 8px;
  max-height:50vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain; z-index:1001; box-shadow:0 8px 20px rgba(0,0,0,0.5);
}
.font-picker.open .font-picker-list { display:block; }
.font-option { padding:8px 16px; border-radius:0; color:#fff; cursor:pointer; font-size:16px; }
.font-option:hover { background:#444; }
.font-option.selected { background:#00f; color:#fff; }

#setting-tint {
  -webkit-appearance:none; appearance:none; height:8px;
  border-radius:4px; background:#444; outline:none; cursor:pointer;
}
#setting-tint::-webkit-slider-thumb {
  -webkit-appearance:none; appearance:none; width:22px; height:22px;
  border-radius:50%; background:#ff8700; cursor:pointer;
  border:2px solid #fff; box-sizing:border-box;
}
#setting-tint::-moz-range-thumb {
  width:22px; height:22px; border-radius:50%; background:#ff8700;
  cursor:pointer; border:2px solid #fff; box-sizing:border-box;
}

.tile-row { display:flex; align-items:center; margin-bottom:12px; gap:10px; }
.tile-preview-thumb {
  width:48px; height:48px; border-radius:6px; border:2px solid #555;
  background:#111; object-fit:cover; flex-shrink:0;
}
.tile-input { display:none; }
.tile-btn {
  display:inline-flex; align-items:center; justify-content:center;
  padding:10px 16px; border-radius:8px; background:#ff8700; color:#000;
  font-weight:bold; font-size:14px; cursor:pointer; border:none;
  flex-shrink:0; -webkit-tap-highlight-color:transparent; user-select:none;
}
.tile-btn:active { background:#e07a00; }
.tile-name { font-size:13px; color:#aaa; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }

#settings-modal, #settings-modal * {
  -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none;
  user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; pointer-events:auto;
}
#handle-modal, #handle-modal * {
  -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none;
  user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; pointer-events:auto;
}

.ios-blur-fix {
  position:fixed; top:0; left:0; right:0; height:11px;
  z-index:2147483647; pointer-events:none;
  background-color:#000; -webkit-background-clip:text; color:transparent;
}

.help-box { padding:4px 0; margin:0 0 24px 0; font-size:16px; line-height:1.5; color:#ccc; }
.help-box p { margin:0 0 0.5em 0; }
.help-box p:last-child { margin-bottom:0; }
</style>
</head>

const dbRequest = indexedDB.open("QuadEditorDB", 5);
dbRequest.onupgradeneeded = e => {
  db = e.target.result;
  if (!db.objectStoreNames.contains("texts"))   db.createObjectStore("texts", { keyPath: "id" });
  if (!db.objectStoreNames.contains("handles")) db.createObjectStore("handles", { keyPath: "id", autoIncrement: true });
};
dbRequest.onsuccess = e => {
  db = e.target.result;
  loadHandlesFromDB().then(() => { loadData(); updateHandleScale(); });
};

async function saveToDB(id, content, img = null, clearImg = false, tile = null, clearTile = false) {
  return new Promise(resolve => {
    const tx = db.transaction("texts", "readwrite");
    const store = tx.objectStore("texts");
    const req = store.get(id);
    req.onsuccess = () => {
      const data = req.result || { id };
      data.content = DOMPurify.sanitize(content, {
        ALLOWED_TAGS:['p','div','br','b','i','u','strong','em','span'],
        ALLOWED_ATTR:['style']
      });
      if (clearImg) delete data.img; else if (img) data.img = img;
      if (clearTile) delete data.tile; else if (tile) data.tile = tile;
      store.put(data);
      tx.oncomplete = () => resolve();
    };
  });
}

function updateHandleImage(index) {
  const imgEl = handle.querySelector('img');
  const all = getActiveDesigns();
  if (all.length === 0) { imgEl.removeAttribute('src'); return; }
  const safe = ((index % all.length) + all.length) % all.length;
  imgEl.src = all[safe].src;
  imgEl.style.transform = 'rotate(0deg)';
}

function updateHandleScale() {
  const x = parseFloat(localStorage.getItem('q_x') || '50');
  const y = parseFloat(localStorage.getItem('q_y') || '50');
  const dx = (x - 50) / 50, dy = (y - 50) / 50;
  const d = Math.min(Math.sqrt(dx*dx + dy*dy), 1);
  const tl = 1 - d;
  const ts = tl * tl * (3 - 2 * tl);
  const scale = 1 + 0.62 * ts;
  handle.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

function loadHandlesFromDB() {
  return new Promise(resolve => {
    if (!db) return resolve();
    const tx = db.transaction("handles", "readonly");
    const req = tx.objectStore("handles").getAll();
    req.onsuccess = () => {
      loadedHandles = (req.result || []).map(r => ({ id:r.id, dataUrl:r.dataUrl, active:r.active !== false }));
      resolve();
    };
    req.onerror = () => resolve();
  });
}
function addHandleToDB(dataUrl) {
  return new Promise(resolve => {
    const tx = db.transaction("handles", "readwrite");
    const req = tx.objectStore("handles").add({ dataUrl, active:true, createdAt:Date.now() });
    req.onsuccess = () => resolve(req.result);
  });
}
function setHandleActiveInDB(id, active) {
  return new Promise(resolve => {
    const tx = db.transaction("handles", "readwrite");
    const store = tx.objectStore("handles");
    const getReq = store.get(id);
    getReq.onsuccess = () => {
      const rec = getReq.result;
      if (rec) { rec.active = active; store.put(rec); }
      resolve();
    };
  });
}
function deleteHandleFromDB(id) {
  return new Promise(resolve => {
    const tx = db.transaction("handles", "readwrite");
    const req = tx.objectStore("handles").delete(id);
    req.onsuccess = () => resolve();
  });
}

function renderHandleList() {
  const list = document.getElementById('handle-list');
  if (!list) return;
  list.innerHTML = '';

  const makeCell = (src, isActive, opts) => {
    const cell = document.createElement('div');
    cell.style.cssText = 'position:relative; aspect-ratio:1; border:2px solid #555; border-radius:8px; background:#111; overflow:hidden; display:flex; align-items:center; justify-content:center;';
    const img = document.createElement('img');
    img.src = src;
    img.style.cssText = 'max-width:70%; max-height:70%; object-fit:contain; pointer-events:none; transition:opacity .2s;';
    img.style.opacity = isActive ? '1' : '0.3';
    cell.appendChild(img);
    const eye = document.createElement('button');
    eye.type = 'button'; eye.innerHTML = isActive ? EYE_OPEN : EYE_OFF;
    eye.style.cssText = 'position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; border:none; background:rgba(0,0,0,0.65); color:#fff; cursor:pointer; line-height:1; padding:0; display:flex; align-items:center; justify-content:center;';
    eye.addEventListener('click', async e => {
      e.stopPropagation();
      if (opts.onToggle) await opts.onToggle();
      renderHandleList();
    });
    cell.appendChild(eye);
    if (opts.onDelete) {
      const del = document.createElement('button');
      del.type = 'button'; del.textContent = '×';
      del.style.cssText = 'position:absolute; top:2px; right:2px; width:24px; height:24px; border-radius:50%; border:none; background:rgba(255,0,0,0.85); color:#fff; font-size:16px; font-weight:bold; cursor:pointer; line-height:1; padding:0;';
      del.addEventListener('click', async e => {
        e.stopPropagation();
        await opts.onDelete();
        renderHandleList();
      });
      cell.appendChild(del);
    }
    list.appendChild(cell);
  };

  builtinDesigns.forEach(src => {
    makeCell(src, builtinActive[src], {
      onToggle: () => {
        builtinActive[src] = !builtinActive[src];
        saveBuiltinActive();
        currentDesign = 0;
        updateHandleImage(currentDesign);
      }
    });
  });
  loadedHandles.forEach(h => {
    makeCell(h.dataUrl, h.active, {
      onToggle: async () => {
        h.active = !h.active;
        await setHandleActiveInDB(h.id, h.active);
        currentDesign = 0;
        updateHandleImage(currentDesign);
      },
      onDelete: async () => {
        await deleteHandleFromDB(h.id);
        loadedHandles = loadedHandles.filter(x => x.id !== h.id);
        currentDesign = 0;
        updateHandleImage(currentDesign);
      }
    });
  });
}

function applyRandomLayout() {
  const all = getActiveDesigns();
  if (all.length > 0) {
    currentDesign = Math.floor(Math.random() * all.length);
    localStorage.setItem('q_handle_design', currentDesign);
    updateHandleImage(currentDesign);
  }
  const randomHue = Math.floor(Math.random() * 360);
  const randomDegrees = Math.floor(Math.random() * 4) * 90;
  const hi = handle.querySelector('img');
  hi.style.transform = `rotate(${randomDegrees}deg)`;
  handle.style.filter = `hue-rotate(${randomHue}deg) drop-shadow(0 6px 6px rgba(255,255,255,0.4))`;

  const palette = magicPalettes[Math.floor(Math.random() * magicPalettes.length)];
  const fontValues = Array.from(document.querySelectorAll('#setting-font .font-option')).map(o => o.dataset.value);

  textareas.forEach((ta, i) => {
    const wrap = ta.parentElement;
    const randomFont = fontValues[Math.floor(Math.random() * fontValues.length)];
    wrap.style.setProperty('--fn', randomFont);
    wrap.style.setProperty('--bg', palette.bg[i]);
    wrap.style.setProperty('--color', palette.co[i]);
    localStorage.setItem(`q_f_${i}`, randomFont);
    localStorage.setItem(`q_b_${i}`, palette.bg[i]);
    localStorage.setItem(`q_c_${i}`, palette.co[i]);
  });

  if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
}

function applyImagePosition(i, pos) {
  const img = images[i];

  img.style.top    = v === 'top'    ? '10px' : 'auto';
  img.style.bottom = v === 'bottom' ? '10px' : 'auto';
  img.style.left   = h === 'left'   ? '10px' : 'auto';
  img.style.right  = h === 'right'  ? '10px' : 'auto';
}

function loadData() {
  document.body.classList.remove('img-fullscreen-active');
  container.style.setProperty('--x', localStorage.getItem('q_x') || '50%');
  container.style.setProperty('--y', localStorage.getItem('q_y') || '50%');
  updateHandleImage(currentDesign);
  updateHandleScale();

  textareas.forEach((ta, i) => {
    const img = images[i];
    const wrap = ta.parentElement;

    applyImagePosition(i, localStorage.getItem(`q_pos_${i}`) || 'bottom right');

    const bg = localStorage.getItem(`q_b_${i}`) || defBgs[i];
    const co = localStorage.getItem(`q_c_${i}`) || defColors[i];
    const fn = localStorage.getItem(`q_f_${i}`) || 'Inter, Arial, sans-serif';
    let fs   = localStorage.getItem(`q_s_${i}`) || '10cqmin';
    if (fs.endsWith('px')) {
      const px = parseFloat(fs);
      fs = (px / 4.5).toFixed(2) + 'cqmin';
      localStorage.setItem(`q_s_${i}`, fs);
    }
    wrap.style.setProperty('--bg', bg);
    wrap.style.setProperty('--color', co);
    wrap.style.setProperty('--fn', fn);
    wrap.style.setProperty('--fs', fs);
    setTileModeUI(i, getTileMode(i));

    const savedTint = localStorage.getItem(`q_tint_${i}`);
    const hasUserBg = localStorage.getItem(`q_b_${i}`) || localStorage.getItem(`q_tilemode_${i}`);
    if (!hasUserBg) {
      const demo = demoBgs[i];
      wrap.style.setProperty('--bg-tile', `url(${getDemoFile(demo)})`);
      wrap.style.setProperty('--bg-tint', demo.tint);
      setTileModeUI(i, demo.mode);
    } else {
      wrap.style.setProperty('--bg-tint', savedTint !== null ? savedTint : '0.35');
    }

    if (i === 3 && !localStorage.getItem('q_demo_img_3')) {
      images[i].src = 'demo.png';
      images[i].style.display = 'block';
      localStorage.setItem('q_demo_img_3', '1');
      localStorage.setItem('q_pos_3', 'bottom left');
      applyImagePosition(3, 'bottom left');
    }

    const tx = db.transaction("texts", "readonly");
    const req = tx.objectStore("texts").get(i);
    req.onsuccess = () => {
      const saved = req.result && req.result.content;
      const hasSaved = saved && saved.replace(/<[^>]*>/g, '').trim() !== '';
      if (hasSaved) {
        ta.innerHTML = DOMPurify.sanitize(saved, {
          ALLOWED_TAGS:['p','div','br','b','i','u','strong','em','span'],
          ALLOWED_ATTR:['style']
        });
      } else if (i === 3 && !localStorage.getItem('q_demo_text_3')) {
        ta.innerHTML = demoText3[lang] || demoText3.en;
        localStorage.setItem('q_demo_text_3', '1');
      }
      if (req.result && req.result.img) {
        images[i].src = req.result.img;
        images[i].style.display = 'block';
      } else if (i !== 3) {
        images[i].removeAttribute('src');
        images[i].style.display = 'none';
      }
      if (req.result && req.result.tile) {
        wrap.style.setProperty('--bg-tile', `url(${req.result.tile})`);
        wrap.style.setProperty('--bg-tint', savedTint !== null ? savedTint : '0.35');
      }
      applyAlign(i, localStorage.getItem(`q_halign_${i}`) || 'left');
      // re-hide placeholder if content present
      const ph = ta.parentElement.querySelector('.ph');
      if (ph && ta.textContent.trim() !== '') ph.classList.add('hidden');
    };
  });
}

/* ==================== HANDLE GESTURES ==================== */
let handleLongPressTimer;
let handleLongPressFired = false;
let lastHandleTapTime = 0;
let startX = 0, startY = 0;
let totalAngle = 0;
let lastAngle = 0;
let startRadius = 0;
let circleFired = false;
const CIRCLE_THRESHOLD = 300;      // degrees
const CIRCLE_MIN_RADIUS = 40;      // px from handle center

function angleFromCenter(cx, cy) {
  const rect = handle.getBoundingClientRect();
  const hx = rect.left + rect.width / 2;
  const hy = rect.top + rect.height / 2;
  return { ang: Math.atan2(cy - hy, cx - hx), r: Math.hypot(cx - hx, cy - hy) };
}

handle.addEventListener('pointerdown', e => {
  e.stopPropagation();
  isDragging = true;
  handleLongPressFired = false;
  circleFired = false;
  totalAngle = 0;
  dragStartTime = Date.now();
  const pt = e.touches ? e.touches[0] : e;
  startX = pt.clientX; startY = pt.clientY;
  const info = angleFromCenter(pt.clientX, pt.clientY);
  lastAngle = info.ang;
  startRadius = info.r;

  clearTimeout(handleLongPressTimer);
  handleLongPressTimer = setTimeout(() => {
    if (!isDragging || circleFired) return;
    handleLongPressFired = true;
    isDragging = false;
    applyRandomLayout();        // ← long press теперь = случайный дизайн
    if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
  }, 600);
});

window.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const pt = e.touches ? e.touches[0] : e;

  const moveX = Math.abs(pt.clientX - startX);
  const moveY = Math.abs(pt.clientY - startY);

  // cancel long-press if moved
  if (moveX > 5 || moveY > 5) clearTimeout(handleLongPressTimer);

  // circle-swipe detection
  if (!circleFired) {
    const info = angleFromCenter(pt.clientX, pt.clientY);
    if (info.r >= CIRCLE_MIN_RADIUS) {
      let d = info.ang - lastAngle;
      if (d >  Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      totalAngle += Math.abs(d) * (180 / Math.PI);
      lastAngle = info.ang;

      // reached threshold - fire random layout, don't move handle
      if (totalAngle >= CIRCLE_THRESHOLD) {
        circleFired = true;
        handleLongPressFired = true;    // suppress tap and long-press
        isDragging = false;
        clearTimeout(handleLongPressTimer);
        applyRandomLayout();
        return;
      }
      // while circling, don't drag the handle position
      return;
    } else {
      lastAngle = info.ang;
    }
  }

  // normal drag = reposition handle
  const padding = 10;
  const rawX = (pt.clientX / window.innerWidth) * 100;
  const rawY = (pt.clientY / window.innerHeight) * 100;
  const clampedX = Math.max(padding, Math.min(100 - padding, rawX));
  const clampedY = Math.max(padding, Math.min(100 - padding, rawY));
  const x = `${clampedX}%`;
  const y = `${clampedY}%`;
  container.style.setProperty('--x', x);
  container.style.setProperty('--y', y);
  localStorage.setItem('q_x', x);
  localStorage.setItem('q_y', y);
  updateHandleScale();
});

window.addEventListener('pointerup', () => {
  clearTimeout(handleLongPressTimer);
  if (handleLongPressFired || circleFired) { handleLongPressFired = false; circleFired = false; return; }
  if (!isDragging) return;
  isDragging = false;
  const duration = Date.now() - dragStartTime;
  if (duration < 250) {
    // tap: detect double tap → open "How to use"; single tap → change logo
    const now = Date.now();
    if (lastHandleTapTime && now - lastHandleTapTime < 300) {
      // double tap
      lastHandleTapTime = 0;
      openHandleModal();        // ← двойной тап = "How to use"
      if (navigator.vibrate) navigator.vibrate(30);
    } else {
      lastHandleTapTime = now;
      // single tap: change logo
      const all = getActiveDesigns();
      if (all.length > 0) {
        currentDesign = (currentDesign + 1) % all.length;
        localStorage.setItem('q_handle_design', currentDesign);
        updateHandleImage(currentDesign);
      }
    }
  }
});

handle.addEventListener('pointercancel', () => {
  clearTimeout(handleLongPressTimer);
  isDragging = false;
  circleFired = false;
});
handle.addEventListener('touchstart', e => { if (e.cancelable) e.preventDefault(); }, { passive:false });
handle.addEventListener('click', e => e.preventDefault());
handle.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', updateHandleScale);

/* ==================== IMAGE FILE HELPER ==================== */
function handleImageFile(file, index, ta) {
  const reader = new FileReader();
  reader.onload = ev => {
    images[index].src = ev.target.result;
    images[index].style.display = 'block';
    saveToDB(index, ta.innerHTML, ev.target.result);
  };
  reader.readAsDataURL(file);
}

/* ==================== SETTINGS MODAL ==================== */
const modal = document.getElementById('settings-modal');
const selSize = document.getElementById('setting-size');
const selPos = document.getElementById('setting-pos');
const chkDelImg = document.getElementById('setting-del-img');
const imgActionContainer = document.getElementById('image-action-container');
const btnSave = document.getElementById('setting-save');
const btnCancel = document.getElementById('setting-cancel');
const fontPicker = document.getElementById('setting-font');
const fontDisplay = document.getElementById('font-display');

selSize.addEventListener('change', () => {
  if (activeIndex !== null) {
    const wrap = textareas[activeIndex].parentElement;
    wrap.style.setProperty('--fs', selSize.value);
  }
});

fontPicker.addEventListener('click', e => {
  if (e.target === fontDisplay) { fontPicker.classList.toggle('open'); return; }
  const opt = e.target.closest('.font-option');
  if (!opt) return;
  document.querySelectorAll('#setting-font .font-option').forEach(o => o.classList.remove('selected'));
  opt.classList.add('selected');
  fontDisplay.textContent = opt.textContent;
  fontDisplay.style.fontFamily = opt.style.fontFamily;
  fontPicker.classList.remove('open');
  if (activeIndex !== null) {
    const wrap = textareas[activeIndex].parentElement;
    wrap.style.setProperty('--fn', opt.dataset.value);
  }
});

let activeIndex = null;
let textareaLongPressTimer;

document.querySelectorAll('[data-align]').forEach(button => {
  button.addEventListener('click', () => {
    if (activeIndex === null) return;
    const ta = textareas[activeIndex];
    const align = button.dataset.align;
    applyAlign(activeIndex, align);
    localStorage.setItem(`q_halign_${activeIndex}`, align);
    saveToDB(activeIndex, ta.innerHTML);
  });
});

tileModeToolbar.addEventListener('click', e => {
  const btn = e.target.closest('[data-tilemode]');
  if (!btn || activeIndex === null) return;
  setTileModeUI(activeIndex, btn.dataset.tilemode);
});

inpTint.addEventListener('input', e => {
  tintVal.textContent = e.target.value;
  if (activeIndex !== null) {
    const wrap = textareas[activeIndex].parentElement;
    wrap.style.setProperty('--bg-tint', e.target.value / 100);
  }
});

inpTile.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file || activeIndex === null) return;
  tileName.textContent = file.name;
  const reader = new FileReader();
  reader.onload = ev => {
    const dataUrl = ev.target.result;
    const wrap = textareas[activeIndex].parentElement;
    wrap.style.setProperty('--bg-tile', `url(${dataUrl})`);
    wrap.style.setProperty('--bg-tint', '0.35');
    inpTint.value = 35; tintVal.textContent = '35';
    tileThumb.src = dataUrl;
    tileThumb.style.display = 'block';
    textareas[activeIndex]._pendingTile = dataUrl;
    chkDelTile.checked = false;
  };
  reader.readAsDataURL(file);
});

chkDelTile.addEventListener('change', e => {
  if (activeIndex === null) return;
  const wrap = textareas[activeIndex].parentElement;
  if (e.target.checked) {
    wrap.style.setProperty('--bg-tile', 'none');
    wrap.style.setProperty('--bg-tint', '1');
    inpTint.value = 100; tintVal.textContent = '100';
  } else {
    const pending = textareas[activeIndex]._pendingTile;
    const tx = db.transaction("texts", "readonly");
    const req = tx.objectStore("texts").get(activeIndex);
    req.onsuccess = () => {
      if (pending) wrap.style.setProperty('--bg-tile', `url(${pending})`);
      else if (req.result && req.result.tile) wrap.style.setProperty('--bg-tile', `url(${req.result.tile})`);
      wrap.style.setProperty('--bg-tint', '0.35');
      inpTint.value = 35; tintVal.textContent = '35';
    };
  }
});

/* ---------- per-editor input + gestures ---------- */
textareas.forEach((ta, i) => {
  // placeholder pointer - click to hide & focus
  const ph = ta.parentElement.querySelector('.ph');
  if (ph) {
    ph.addEventListener('pointerdown', e => { ph._x = e.clientX; ph._y = e.clientY; });
    ph.addEventListener('pointerup', e => {
      const dx = Math.abs(e.clientX - ph._x);
      const dy = Math.abs(e.clientY - ph._y);
      if (dx < 8 && dy < 8) { ph.classList.add('hidden'); ta.focus(); }
    });
  }

  ta.addEventListener('input', () => {
    if (ta.textContent.trim() === '' && !ta.querySelector('img')) {
      ta.innerHTML = '';
      if (ph) ph.classList.remove('hidden');
    }
    saveToDB(i, ta.innerHTML);
  });

  ta.addEventListener('paste', e => {
    e.preventDefault();
    const item = Array.from(e.clipboardData.items).find(x => x.type.indexOf('image') !== -1);
    if (item) {
      handleImageFile(item.getAsFile(), i, ta);
    } else {
      const text = e.clipboardData.getData('text/plain');
      const clean = DOMPurify.sanitize(text, { ALLOWED_TAGS:[], ALLOWED_ATTR:[] });
      document.execCommand('insertText', false, clean);
    }
  });

  ta.addEventListener('dragover', e => e.preventDefault());
  ta.addEventListener('drop', e => {
    e.preventDefault();
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      const file = Array.from(e.dataTransfer.files).find(x => x.type.indexOf('image') !== -1);
      if (file) handleImageFile(file, i, ta);
    } else {
      const item = Array.from(e.dataTransfer.items).find(x => x.type.indexOf('image') !== -1);
      if (item) handleImageFile(item.getAsFile(), i, ta);
    }
  });
  ta.addEventListener('contextmenu', e => e.preventDefault());

  // long press on field → open settings
  let lpX = 0, lpY = 0;
  const startLongPress = e => {
    const pt = e.touches ? e.touches[0] : e;
    lpX = pt.clientX; lpY = pt.clientY;
    activeIndex = i;
    clearTimeout(textareaLongPressTimer);
    textareaLongPressTimer = setTimeout(() => {
      // set UI
      const savedFont = localStorage.getItem(`q_f_${i}`) || '';
      const fontOpts = document.querySelectorAll('#setting-font .font-option');
      let matched = false;
      fontOpts.forEach(o => {
        const m = o.dataset.value === savedFont;
        o.classList.toggle('selected', m);
        if (m) matched = true;
      });
      if (!matched && fontOpts[0]) fontOpts[0].classList.add('selected');
      const selOpt = document.querySelector('#setting-font .font-option.selected');
      if (selOpt) {
        fontDisplay.textContent = selOpt.textContent;
        fontDisplay.style.fontFamily = selOpt.style.fontFamily;
      }

      const savedSize = localStorage.getItem(`q_s_${i}`) || '';
      const opts = Array.from(selSize.options).map(o => o.value);
      selSize.selectedIndex = opts.indexOf(savedSize) >= 0 ? opts.indexOf(savedSize) : 0;

      const currentBg = localStorage.getItem(`q_b_${i}`) ||
        getComputedStyle(ta.parentElement).getPropertyValue('--bg').trim() || defBgs[i];
      const currentColor = localStorage.getItem(`q_c_${i}`) ||
        getComputedStyle(ta.parentElement).getPropertyValue('--color').trim() || defColors[i];
      inpBg.value = currentBg; bgPickerBtn.style.background = currentBg;
      inpColor.value = currentColor; colorPickerBtn.style.background = currentColor;

      selPos.value = localStorage.getItem(`q_pos_${i}`) || 'bottom right';
      setTileModeUI(i, getTileMode(i));
      applyAlign(i, localStorage.getItem(`q_halign_${i}`) || 'left');

      if (images[i].style.display === 'block') {
        imgActionContainer.style.display = 'block';
        chkDelImg.checked = false;
      } else {
        imgActionContainer.style.display = 'none';
      }

      ta._pendingTile = null;
      inpTile.value = '';
      tileName.textContent = t.noFile;
      chkDelTile.checked = false;
      tileThumb.style.display = 'none';
      tileThumb.removeAttribute('src');

      const tileTx = db.transaction("texts", "readonly");
      const tileReq = tileTx.objectStore("texts").get(i);
      tileReq.onsuccess = () => {
        if (tileReq.result && tileReq.result.tile) {
          tileThumb.src = tileReq.result.tile;
          tileThumb.style.display = 'block';
        }
      };

      const savedTint = localStorage.getItem(`q_tint_${i}`);
      const num = savedTint !== null ? parseFloat(savedTint) : 0.35;
      inpTint.value = Math.round(num * 100);
      tintVal.textContent = inpTint.value;

      if (window.getSelection) window.getSelection().removeAllRanges();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      modal.style.display = 'flex';
    }, 600);
  };
  const stopLongPress = () => clearTimeout(textareaLongPressTimer);
  ta.addEventListener('mousedown', startLongPress);
  ta.addEventListener('mouseup', stopLongPress);
  ta.addEventListener('mouseleave', stopLongPress);
  ta.addEventListener('touchstart', startLongPress, { passive:true });
  ta.addEventListener('touchend', stopLongPress);
  ta.addEventListener('touchmove', stopLongPress);

  // image gestures
  const img = images[i];
  let imgLPTimer = null, imgSX = 0, imgSY = 0, imgDeleted = false;
  img.addEventListener('pointerdown', e => {
    e.stopPropagation();
    imgDeleted = false;
    imgSX = e.clientX; imgSY = e.clientY;
    clearTimeout(imgLPTimer);
    imgLPTimer = setTimeout(() => {
      imgDeleted = true;
      img.classList.remove('fullscreen');
      document.body.classList.remove('img-fullscreen-active');
      img.removeAttribute('src');
      img.style.display = 'none';
      localStorage.removeItem(`q_pos_${i}`);
      saveToDB(i, ta.innerHTML, null, true);
    }, 1000);
  });
  img.addEventListener('pointerup', () => clearTimeout(imgLPTimer));
  img.addEventListener('pointercancel', () => clearTimeout(imgLPTimer));
  img.addEventListener('pointerleave', () => clearTimeout(imgLPTimer));
  img.addEventListener('pointermove', e => {
    if (Math.abs(e.clientX - imgSX) > 8 || Math.abs(e.clientY - imgSY) > 8) clearTimeout(imgLPTimer);
  });
  img.addEventListener('click', e => {
    e.stopPropagation();
    if (imgDeleted) return;
    img.classList.toggle('fullscreen');
    document.body.classList.toggle('img-fullscreen-active', !!document.querySelector('.img-preview.fullscreen'));
  });
});

btnSave.onclick = () => {
  if (activeIndex === null) return;
  const targetTa = textareas[activeIndex];
  const wrap = targetTa.parentElement;

  const fontOption = document.querySelector('#setting-font .font-option.selected');
  const fontValue = fontOption ? fontOption.dataset.value : "'Inter', Arial, sans-serif";
  wrap.style.setProperty('--fn', fontValue);
  localStorage.setItem(`q_f_${activeIndex}`, fontValue);

  wrap.style.setProperty('--fs', selSize.value);
  localStorage.setItem(`q_s_${activeIndex}`, selSize.value);

  wrap.style.setProperty('--bg', inpBg.value);
  localStorage.setItem(`q_b_${activeIndex}`, inpBg.value);

  wrap.style.setProperty('--color', inpColor.value);
  localStorage.setItem(`q_c_${activeIndex}`, inpColor.value);

  const tintNum = parseInt(inpTint.value, 10) / 100;
  wrap.style.setProperty('--bg-tint', tintNum);
  localStorage.setItem(`q_tint_${activeIndex}`, tintNum);

  applyAlign(activeIndex, localStorage.getItem(`q_halign_${activeIndex}`) || 'left');

  if (chkDelTile.checked) {
    wrap.style.setProperty('--bg-tile', 'none');
    saveToDB(activeIndex, targetTa.innerHTML, null, false, null, true);
    setTileModeUI(activeIndex, 'repeat');
    localStorage.setItem(`q_tilemode_${activeIndex}`, 'repeat');
  } else if (targetTa._pendingTile) {
    wrap.style.setProperty('--bg-tile', `url(${targetTa._pendingTile})`);
    saveToDB(activeIndex, targetTa.innerHTML, null, false, targetTa._pendingTile);
  }
  delete targetTa._pendingTile;

  const mode = textareas[activeIndex].parentElement.dataset.tilemode || 'repeat';
  localStorage.setItem(`q_tilemode_${activeIndex}`, mode);
  setTileModeUI(activeIndex, mode);

  localStorage.setItem(`q_pos_${activeIndex}`, selPos.value);
  applyImagePosition(activeIndex, selPos.value);

  if (chkDelImg.checked) {
    images[activeIndex].removeAttribute('src');
    images[activeIndex].style.display = 'none';
    localStorage.removeItem(`q_pos_${activeIndex}`);
    saveToDB(activeIndex, targetTa.innerHTML, null, true);
  }

  modal.style.display = 'none';
  activeIndex = null;
};

btnCancel.onclick = () => {
  if (activeIndex !== null) {
    const wrap = textareas[activeIndex].parentElement;
    const savedTint = localStorage.getItem(`q_tint_${activeIndex}`);
    wrap.style.setProperty('--bg-tint', savedTint !== null ? savedTint : '0.35');
    const savedBg = localStorage.getItem(`q_b_${activeIndex}`);
    if (savedBg !== null) wrap.style.setProperty('--bg', savedBg);
    const savedColor = localStorage.getItem(`q_c_${activeIndex}`);
    if (savedColor !== null) wrap.style.setProperty('--color', savedColor);
    const savedFont = localStorage.getItem(`q_f_${activeIndex}`);
    if (savedFont !== null) wrap.style.setProperty('--fn', savedFont);
    const savedSize = localStorage.getItem(`q_s_${activeIndex}`);
    if (savedSize !== null) wrap.style.setProperty('--fs', savedSize);

    setTileModeUI(activeIndex, getTileMode(activeIndex));
    applyAlign(activeIndex, localStorage.getItem(`q_halign_${activeIndex}`) || 'left');

    const tx = db.transaction("texts", "readonly");
    const req = tx.objectStore("texts").get(activeIndex);
    req.onsuccess = () => {
      if (req.result && req.result.tile) {
        wrap.style.setProperty('--bg-tile', `url(${req.result.tile})`);
      } else if (!localStorage.getItem(`q_b_${activeIndex}`) && !localStorage.getItem(`q_tilemode_${activeIndex}`)) {
        const demo = demoBgs[activeIndex];
        wrap.style.setProperty('--bg-tile', `url(${getDemoFile(demo)})`);
        wrap.style.setProperty('--bg-tint', demo.tint);
        setTileModeUI(activeIndex, demo.mode);
      } else {
        wrap.style.setProperty('--bg-tile', 'none');
      }
    };
    delete textareas[activeIndex]._pendingTile;
  }
  modal.style.display = 'none';
  activeIndex = null;
};

document.addEventListener('contextmenu', e => {
  if (document.getElementById('settings-modal').style.display === 'flex') e.preventDefault();
}, { capture:true });
document.getElementById('settings-modal').addEventListener('contextmenu', e => e.preventDefault(), { capture:true });
</script>
