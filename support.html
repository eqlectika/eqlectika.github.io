<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <title>Trust Fibonacci</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(0deg, #000000 0%, #1a2954 100%);
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            padding: 0px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 100%;
            width: 100%;
            padding: 24px 20px;
            text-align: center;
        }

        .header-block {
            margin-bottom: 40px;
        }

        .header-block img {
            height: 64px;
            width: auto;
            display: block;
            margin: 0 auto;
        }

        .header-block h2 {
            font-family: 'Cinzel', serif;
            margin-top: 4px;
            font-weight: bold;
            font-size: 24px;
        }

        .header-block h2 a {
            color: inherit;
            letter-spacing: 1.5px;
            text-decoration: none;
        }

        .header-block p.subtitle {
            letter-spacing: 3px;
            font-size: 11px;
            margin-top: 4px;
            color: #fff;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
        }

        .content-text {
            font-size: 16px;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 24px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .address-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: monospace;
            font-size: 14px;
            color: #60a5fa;
            word-break: break-all;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 16px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .address-box:hover {
            background: rgba(59, 130, 246, 0.08);
            color: #93c5fd;
        }

        /* НОВЫЙ СТИЛЬ ДЛЯ ПОДСКАЗКИ */
        .hint {
            max-width: 600px;
            margin: 0 auto;
            font-size: 14px;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 8px 0;
            user-select: none;
            min-height: 32px; /* чтобы не прыгал контент */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hint:hover {
            color: #d1d5db;
        }

        .hint.copied {
            color: #10b981;
        }

        /* Убираем старый toast */
        .toast {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-block">
            <a href="research.html" style="display: inline-block; margin-bottom: 0px;"><img src="fleurdelis.png" alt="Fleur de lis" class="no-invert"></a>
            <h2>
                <a href="research.html">Trust Fibonacci</a>
            </h2>
            <p class="subtitle">Virtual tools for endlessly improving life</p>
        </div>

        <div class="content-text">
            If you appreciate the interface of the homepage that brought you here and you would like to support development using ETH (ERC20), please use the address below:
        </div>
        
        <div class="address-box" id="addressBox" title="Click to copy">
            0xF5367CF8187Ab1C405c495dC05fCa0434d76c1B8
        </div>

        <!-- НОВАЯ ПОДСКАЗКА ВМЕСТО КНОПКИ -->
        <div class="hint" id="hint">Click to copy address</div>
        
        <!-- Скрытый toast -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        const ethAddress = "0xF5367CF8187Ab1C405c495dC05fCa0434d76c1B8";
        const addressBox = document.getElementById("addressBox");
        const hint = document.getElementById("hint");
        let timeoutId = null;

        function copyAddress() {
            navigator.clipboard.writeText(ethAddress).then(() => {
                // Меняем текст на уведомление
                hint.textContent = "Address copied!";
                hint.classList.add("copied");
                
                // Убираем предыдущий таймер, если есть
                if (timeoutId) {
                    clearTimeout(timeoutId);
                }
                
                // Через 2 секунды возвращаем подсказку
                timeoutId = setTimeout(() => {
                    hint.textContent = "📋 Click to copy address";
                    hint.classList.remove("copied");
                    timeoutId = null;
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                hint.textContent = "❌ Failed to copy";
                hint.style.color = "#ef4444";
                
                if (timeoutId) {
                    clearTimeout(timeoutId);
                }
                
                timeoutId = setTimeout(() => {
                    hint.textContent = "📋 Click to copy address";
                    hint.style.color = "#9ca3af";
                    timeoutId = null;
                }, 2000);
            });
        }

        // Клик по адресу
        addressBox.addEventListener("click", copyAddress);
        
        // Клик по подсказке
        hint.addEventListener("click", copyAddress);
    </script>

</body>
</html>
