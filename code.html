<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Simple Code Editor" />
  <link rel="manifest" href="manifest.json">
  <title>Code Viewer</title>
  <style>

html {
  background-color: black;
  padding-top: env(safe-area-inset-top);
}

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: row;
  font-family: Arial, sans-serif;
  background-color: black;
  color: white;
  height: 100%;
  position: relative;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#editorContainer {
  flex: 38;
  display: flex;
  position: relative;
  background-color: black;
  min-width: 0;
  overscroll-behavior: contain;
}

#preview {
  flex: 62;
  border: none;
  background-color: #333333;
  overflow: auto;
  min-width: 0;
  overscroll-behavior: contain;
}

#controlPanel {
  flex: 1 0 auto;
  background-color: black;
}

#controlPanel > div {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-start; /* Блоки (строки) прижаты влево */
  justify-content: flex-start;
  padding: 15px 10px;
  box-sizing: border-box;
  height: 100%;
}

#editor {
  flex: 1;
  padding: 10px;
  border: none;
  resize: none;
  font-family: monospace;
  font-size: 14px;
  line-height: 1.2;
  background-color: black;
  color: white;
  outline: none;
  caret-color: white;
  position: relative;
  box-sizing: border-box;
  overflow: auto;
  white-space: pre;
  min-width: 0;
}

/* --- БАЗОВЫЕ СТИЛИ (столбиком) --- */
.searchRow {
  display: flex;
  flex-direction: column;
  align-items: center; /* Центрируем элементы по горизонтали внутри колонки (для поиска и стрелок) */
  justify-content: center;
  gap: 8px;
  width: 100%;
}

.actionsRow {
  display: flex;
  flex-direction: column;
  align-items: center; /* Центрируем элементы по горизонтали внутри колонки */
  justify-content: center;
  gap: 8px;
  width: 100%;
}

/* --- ЭЛЕМЕНТЫ --- */
#searchField {
  padding: 0 8px;
  font-size: 14px;
  border: 1px solid #555;
  background-color: #333333;
  color: white;
  height: 30px;
  min-height: 30px;
  max-height: 30px;
  box-sizing: border-box;
  border-radius: 5px;
  outline: none;
  line-height: 28px;
  appearance: none;
  -webkit-appearance: none;
  margin: 0;
}

#prevMatchButton, #nextMatchButton {
  width: 30px;
  height: 30px;
  min-height: 30px;
  max-height: 30px;
  background-color: #333333;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 18px;
  border-radius: 5px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  margin: 0;
}

.searchButtons {
  display: flex;
  flex-direction: row;
  gap: 8px;
}

#fileFormat {
  font-size: 14px;
  width: 70px;
  height: 30px;
  min-height: 30px;
  max-height: 30px;
  box-sizing: border-box;
  display: block;
  margin: 0;
  flex: 0 0 auto;
}

#saveButton {
  display: block;
  width: 60px;
  height: 30px;
  min-height: 30px;
  max-height: 30px;
  background-color: #007bff;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 14px;
  border-radius: 5px;
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  flex: 0 0 auto;
}

#strictNoCache {
  width: 20px;
  height: 20px;
  min-height: 20px;
  max-height: 20px;
  margin: 0;
  cursor: pointer;
  accent-color: #007bff;
  flex-shrink: 0;
  display: block;
}

.logoLink {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  height: 40px;
  margin: 0;
  padding: 0;
}

.logoLink img {
  height: 40px;
  width: auto;
  display: block;
}

/* --- ШИРИНА ПОЛЯ ПО ОРИЕНТАЦИИ --- */
@media (orientation: landscape) {
  #searchField {
    width: 70px;
    flex: 0 0 70px;
  }
}

@media (orientation: portrait) {
  #searchField {
    width: 200px;
    flex: 0 0 200px;
  }
}

/* --- В РЯД (ПОРТРЕТ И ШИРОКИЕ ЭКРАНЫ) --- */
@media (orientation: portrait) {
  .searchRow {
    flex-direction: row;
    align-items: center; /* Строго по центру по вертикали */
    justify-content: flex-start; /* Элементы прижаты влево */
  }

  .actionsRow {
    flex-direction: row;
    align-items: center; /* Строго по центру по вертикали */
    justify-content: flex-start; /* Элементы прижаты влево */
    flex-wrap: wrap;
  }
}

/* --- ПОРТРЕТ < 768px --- */
@media (orientation: portrait) and (max-width: 767px) {
  body {
    flex-direction: column;
  }
  #editorContainer {
    flex: 40;
    min-height: 0;
  }
  #preview {
    flex: 50;
    min-height: 0;
  }
  #controlPanel {
    border-left: none;
    border-top: 1px solid #222;
  }
  #controlPanel > div {
    padding: 10px;
    height: auto;
    width: 100%;
  }
}

/* --- ШИРОКИЙ ПОРТРЕТ --- */
@media (orientation: portrait) and (min-width: 768px) {
  #controlPanel > div {
    gap: 6px;
    height: auto;
    padding: 8px 10px;
    width: 100%;
    box-sizing: border-box;
  }

  .actionsRow {
    flex-wrap: nowrap;
  }

  #fileFormat {
    width: 80px;
  }

  #saveButton {
    width: 80px;
  }

  .logoLink img {
    height: 32px !important;
  }
}
.ios-blur-fix {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 11px;
    z-index: 2147483647;
    pointer-events: none;
    background-color: #000;  /* подставьте цвет фона вашего файла */
    -webkit-background-clip: text;
    color: transparent;
}
  </style>
</head>
<body>
  <div class="ios-blur-fix"></div>
  <div id="editorContainer">
    <textarea id="editor" placeholder="Type your code here..."></textarea>
  </div>

  <iframe id="preview" title="Preview"></iframe>

  <div id="controlPanel">
    <div>
      <!-- Строка 1 -->
      <div class="searchRow">
        <input type="text" id="searchField" placeholder="Search">
        <div class="searchButtons">
          <button id="prevMatchButton" title="Previous Match">▲</button>
          <button id="nextMatchButton" title="Next Match">▼</button>
        </div>
      </div>

      <!-- Строка 2 -->
      <div class="actionsRow">
        <select id="fileFormat">
          <option value="html">HTML</option>
          <option value="json">JSON</option>
          <option value="txt">TXT</option>
          <option value="js">JS</option>
          <option value="css">CSS</option>
        </select>

        <button id="saveButton">Save</button>

        <!-- Обернули логотип в ссылку с классом, чтобы зафиксировать его размеры -->
        <a href="research.html" class="logoLink">
          <img src="logo.png" alt="Feedback" style="height: 40px; opacity: 0.9; width: auto;">
        </a>

        <input
          type="checkbox"
          id="strictNoCache"
          title="Strict no-cache: adds cache-buster to XHR URLs. May affect code that validates URLs."
        >
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       1. Прелюдии для srcdoc
       ========================================================= */
    const NO_CACHE_PRELUDE_SAFE = `
<script>
(function () {
  try {
    var origFetch = window.fetch;
    if (origFetch) {
      window.fetch = function (input, init) {
        init = init || {};
        init.cache = 'no-store';
        return origFetch.call(this, input, init);
      };
    }
  } catch (e) {}
})();
<\/script>
`;

    const NO_CACHE_PRELUDE_STRICT = `
<script>
(function () {
  try {
    var origFetch = window.fetch;
    if (origFetch) {
      window.fetch = function (input, init) {
        init = init || {};
        init.cache = 'no-store';
        return origFetch.call(this, input, init);
      };
    }
    var OrigXHR = window.XMLHttpRequest;
    if (OrigXHR) {
      var origOpen = OrigXHR.prototype.open;
      OrigXHR.prototype.open = function (method, url) {
        try {
          var u = new URL(url, location.href);
          u.searchParams.set('_nocache', Date.now());
          url = u.toString();
        } catch (e) {}
        return origOpen.apply(this, [method, url].concat([].slice.call(arguments, 2)));
      };
    }
  } catch (e) {}
})();
<\/script>
`;

    const editor = document.getElementById("editor");
    const saveButton = document.getElementById("saveButton");
    const fileFormat = document.getElementById("fileFormat");
    const searchField = document.getElementById("searchField");
    const prevMatchButton = document.getElementById("prevMatchButton");
    const nextMatchButton = document.getElementById("nextMatchButton");
    const strictToggle = document.getElementById("strictNoCache");

    let searchMatches = [];
    let currentMatchIndex = -1;
    let currentSearchTerm = "";

    const mimeTypes = {
      html: "text/html",
      json: "application/json",
      txt: "text/plain",
      js: "application/javascript",
      css: "text/css",
    };

    function getPrelude() {
      return document.getElementById('strictNoCache').checked
        ? NO_CACHE_PRELUDE_STRICT
        : NO_CACHE_PRELUDE_SAFE;
    }

    function renderPreview(code) {
      const oldFrame = document.getElementById("preview");
      const newFrame = oldFrame.cloneNode(false);
      oldFrame.replaceWith(newFrame);

      let doc = code;
      if (fileFormat.value === "html") {
        doc = getPrelude() + doc;
      }
      newFrame.srcdoc = doc;
    }

    editor.addEventListener("input", () => {
      renderPreview(editor.value);
    });

    strictToggle.addEventListener("change", () => {
      renderPreview(editor.value);
    });

    saveButton.addEventListener("click", () => {
      const format = fileFormat.value;
      const blob = new Blob([editor.value], { type: mimeTypes[format] || "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `code.${format}`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    function highlightMatch(index) {
      if (index === -1 || searchMatches.length === 0) return;
      const start = searchMatches[index];
      const end = start + currentSearchTerm.length;
      editor.focus();
      editor.setSelectionRange(start, end);

      const linesBefore = editor.value.substring(0, start).split("\n").length - 1;
      editor.scrollTop = Math.max(0, (linesBefore - 2) * 16.8);
    }

    function startSearch(searchText) {
      const trimmed = searchText.trim();
      if (trimmed === "") {
        searchMatches = [];
        currentSearchTerm = "";
        return;
      }

      searchMatches = [];
      currentSearchTerm = trimmed;
      const content = editor.value.toLowerCase();
      const term = trimmed.toLowerCase();
      let index = content.indexOf(term, 0);

      while (index !== -1) {
        searchMatches.push(index);
        index = content.indexOf(term, index + term.length);
      }

      if (searchMatches.length > 0) {
        currentMatchIndex = 0;
        highlightMatch(currentMatchIndex);
      }
    }

    searchField.addEventListener("keydown", (e) => {
      if (e.key === "Enter") startSearch(searchField.value);
    });

    nextMatchButton.addEventListener("click", () => {
      if (searchField.value !== currentSearchTerm) {
        startSearch(searchField.value);
      } else if (searchMatches.length) {
        currentMatchIndex = (currentMatchIndex + 1) % searchMatches.length;
        highlightMatch(currentMatchIndex);
      }
    });

    prevMatchButton.addEventListener("click", () => {
      if (searchField.value !== currentSearchTerm) {
        startSearch(searchField.value);
      } else if (searchMatches.length) {
        currentMatchIndex = (currentMatchIndex - 1 + searchMatches.length) % searchMatches.length;
        highlightMatch(currentMatchIndex);
      }
    });

    function stopGlobalScroll(e) {
      e.preventDefault();
    }

    editor.addEventListener("touchmove", (e) => {
      const touchY = e.touches[0].clientY;
      const rect = editor.getBoundingClientRect();
      if (touchY > rect.top + 20 && touchY < rect.bottom - 20) {
        e.stopPropagation();
      }
    }, { passive: false });

    editor.addEventListener("pointerdown", () => {
      window.addEventListener("wheel", stopGlobalScroll, { passive: false });
      window.addEventListener("touchmove", stopGlobalScroll, { passive: false });
    });

    window.addEventListener("pointerup", () => {
      window.removeEventListener("wheel", stopGlobalScroll);
      window.removeEventListener("touchmove", stopGlobalScroll);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
