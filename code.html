<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta name="description" content="Simple Code Editor" />
  <link rel="manifest" href="manifest-code.json">
  <title>Code Viewer</title>
  <style>
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: row;
  font-family: Arial, sans-serif;
  background-color: black;
  color: white;
  height: 100%;
  position: relative;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#editorContainer {
  flex: 38;
  display: flex;
  position: relative;
  background-color: black;
  min-width: 0;
  overscroll-behavior: contain;
}

#preview {
  flex: 62;
  border: none;
  background-color: #333333;
  overflow: auto;
  min-width: 0;
  overscroll-behavior: contain;
}

#controlPanel {
  flex: 1 0 auto;
  background-color: black;
}

#controlPanel > div {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: left;
  justify-content: flex-start;
  padding: 15px 10px;
  box-sizing: border-box;
  height: 100%;
}

#editor {
  flex: 1;
  padding: 10px;
  border: none;
  resize: none;
  font-family: monospace;
  font-size: 14px;
  line-height: 1.2;
  background-color: black;
  color: white;
  outline: none;
  caret-color: white;
  position: relative;
  box-sizing: border-box;
  overflow: auto;
  white-space: pre;
  min-width: 0;
}

#searchField {
  padding: 5px;
  font-size: 14px;
  border: 1px solid #555;
  background-color: #333333;
  color: white;
  height: 35px;
  box-sizing: border-box;
  border-radius: 5px;
  width: 100px;
}

#prevMatchButton, #nextMatchButton {
  width: 40px;
  height: 40px;
  background-color: #333333;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 18px;
  border-radius: 5px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.searchButtons {
  display: flex;
  flex-direction: row;
  gap: 8px;
}

#fileFormat {
  font-size: 14px;
  width: 100px;
  height: 35px;
}

#saveButton, #reloadButton {
  height: 40px;
  background-color: #007bff;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 14px;
  border-radius: 5px;
  padding: 0 10px;
}

#reloadButton {
  background-color: #444;
}

@media (orientation: portrait) {
  body {
    flex-direction: column;
  }
  #editorContainer {
    flex: 40;
    min-height: 0;
  }
  #preview {
    flex: 50;
    min-height: 0;
  }
  #controlPanel {
    border-left: none;
    border-top: 1px solid #222;
  }
  #controlPanel > div {
    flex-direction: row;
    justify-content: space-evenly;
    padding: 10px;
    height: auto;
    width: 100%;
    flex-wrap: wrap;
  }
  #searchField {
    width: 100px;
    flex-grow: 1;
  }
}
  </style>
</head>
<body>
  <div id="editorContainer">
    <textarea id="editor" placeholder="Type your code here..."></textarea>
  </div>

  <iframe id="preview" title="Preview"></iframe>

  <div id="controlPanel">
    <div>
      <input type="text" id="searchField" placeholder="Search">
      <div class="searchButtons">
        <button id="prevMatchButton" title="Previous Match">▲</button>
        <button id="nextMatchButton" title="Next Match">▼</button>
      </div>

      <select id="fileFormat">
        <option value="html">HTML</option>
        <option value="json">JSON</option>
        <option value="txt">TXT</option>
        <option value="js">JS</option>
        <option value="css">CSS</option>
      </select>

      <button id="saveButton">Save</button>
      <button id="reloadButton" title="Reload preview without cache">⟳</button>

      <a href="research.html" style="display: flex; align-items: center;">
        <img src="logo.png" alt="Feedback" style="height: 40px; opacity: 0.9; width: auto;">
      </a>
    </div>
  </div>

  <script>
    /* =========================================================
       1. Анти-кэш прелюдия для srcdoc
       Вставляется в начало проверяемого документа.
       Патчит fetch/XHR так, чтобы любые загрузки шли мимо кэша.
       ========================================================= */
    const NO_CACHE_PRELUDE = `
<script>
(function () {
  try {
    var origFetch = window.fetch;
    if (origFetch) {
      window.fetch = function (input, init) {
        init = init || {};
        init.cache = 'no-store';
        return origFetch.call(this, input, init);
      };
    }
    var OrigXHR = window.XMLHttpRequest;
    if (OrigXHR) {
      var origOpen = OrigXHR.prototype.open;
      OrigXHR.prototype.open = function (method, url) {
        try {
          var u = new URL(url, location.href);
          u.searchParams.set('_nocache', Date.now());
          url = u.toString();
        } catch (e) {}
        return origOpen.apply(this, [method, url].concat([].slice.call(arguments, 2)));
      };
    }
  } catch (e) { /* noop */ }
})();
<\/script>
`;

    /* =========================================================
       2. Пересоздание iframe при каждом рендере
       Новый browsing context => нет унаследованного HTTP-кэша
       и состояния предыдущего запуска.
       ========================================================= */
    function renderPreview(code) {
      const oldFrame = document.getElementById("preview");
      const newFrame = oldFrame.cloneNode(false); // без srcdoc, без состояния
      oldFrame.replaceWith(newFrame);

      let doc = code;
      // Прелюдию вставляем только для HTML-режима, чтобы не ломать
      // JSON/TXT/CSS/JS, которые не являются документами.
      const fmt = fileFormat.value;
      if (fmt === "html") {
        doc = NO_CACHE_PRELUDE + doc;
      }
      newFrame.srcdoc = doc;
    }

    /* =========================================================
       3. Элементы и состояние
       ========================================================= */
    const editor = document.getElementById("editor");
    const saveButton = document.getElementById("saveButton");
    const reloadButton = document.getElementById("reloadButton");
    const fileFormat = document.getElementById("fileFormat");
    const searchField = document.getElementById("searchField");
    const prevMatchButton = document.getElementById("prevMatchButton");
    const nextMatchButton = document.getElementById("nextMatchButton");

    let searchMatches = [];
    let currentMatchIndex = -1;
    let currentSearchTerm = "";

    const mimeTypes = {
      html: "text/html",
      json: "application/json",
      txt: "text/plain",
      js: "application/javascript",
      css: "text/css",
    };

    /* =========================================================
       4. Рендер по вводу
       ========================================================= */
    editor.addEventListener("input", () => {
      renderPreview(editor.value);
    });

    /* =========================================================
       5. Сохранение файла
       ========================================================= */
    saveButton.addEventListener("click", () => {
      const format = fileFormat.value;
      const blob = new Blob([editor.value], { type: mimeTypes[format] || "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `code.${format}`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    /* =========================================================
       6. Hard reload preview:
       чистим Cache Storage + пересоздаём iframe.
       ========================================================= */
    reloadButton.addEventListener("click", async () => {
      try {
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } catch (e) { /* noop */ }
      renderPreview(editor.value);
    });

    /* =========================================================
       7. Поиск по редактору (без изменений в логике)
       ========================================================= */
    function highlightMatch(index) {
      if (index === -1 || searchMatches.length === 0) return;
      const start = searchMatches[index];
      const end = start + currentSearchTerm.length;
      editor.focus();
      editor.setSelectionRange(start, end);

      const linesBefore = editor.value.substring(0, start).split("\n").length - 1;
      editor.scrollTop = Math.max(0, (linesBefore - 2) * 16.8);
    }

    function startSearch(searchText) {
      const trimmed = searchText.trim();
      if (trimmed === "") {
        searchMatches = [];
        currentSearchTerm = "";
        return;
      }

      searchMatches = [];
      currentSearchTerm = trimmed;
      const content = editor.value.toLowerCase();
      const term = trimmed.toLowerCase();
      let index = content.indexOf(term, 0);

      while (index !== -1) {
        searchMatches.push(index);
        index = content.indexOf(term, index + term.length);
      }

      if (searchMatches.length > 0) {
        currentMatchIndex = 0;
        highlightMatch(currentMatchIndex);
      }
    }

    searchField.addEventListener("keydown", (e) => {
      if (e.key === "Enter") startSearch(searchField.value);
    });

    nextMatchButton.addEventListener("click", () => {
      if (searchField.value !== currentSearchTerm) {
        startSearch(searchField.value);
      } else if (searchMatches.length) {
        currentMatchIndex = (currentMatchIndex + 1) % searchMatches.length;
        highlightMatch(currentMatchIndex);
      }
    });

    prevMatchButton.addEventListener("click", () => {
      if (searchField.value !== currentSearchTerm) {
        startSearch(searchField.value);
      } else if (searchMatches.length) {
        currentMatchIndex = (currentMatchIndex - 1 + searchMatches.length) % searchMatches.length;
        highlightMatch(currentMatchIndex);
      }
    });

    /* =========================================================
       8. Защита от глобального скролла при работе с редактором
       ========================================================= */
    function stopGlobalScroll(e) {
      e.preventDefault();
    }

    editor.addEventListener("touchmove", (e) => {
      const touchY = e.touches[0].clientY;
      const rect = editor.getBoundingClientRect();
      if (touchY > rect.top + 20 && touchY < rect.bottom - 20) {
        e.stopPropagation();
      }
    }, { passive: false });

    editor.addEventListener("pointerdown", () => {
      window.addEventListener("wheel", stopGlobalScroll, { passive: false });
      window.addEventListener("touchmove", stopGlobalScroll, { passive: false });
    });

    window.addEventListener("pointerup", () => {
      window.removeEventListener("wheel", stopGlobalScroll);
      window.removeEventListener("touchmove", stopGlobalScroll);
    });

    /* =========================================================
       9. Регистрация Service Worker
       ========================================================= */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw-code.js").catch(() => { /* noop */ });
      });
    }

    /* =========================================================
       10. Автосохранение (оставлено закомментированным,
           как в оригинале)
       ========================================================= */
    //const savedContent = localStorage.getItem('editorContent');
    //if (savedContent) {
    //  editor.value = savedContent;
    //  renderPreview(savedContent);
    //}
    //editor.addEventListener('input', () => {
    //  localStorage.setItem('editorContent', editor.value);
    //});
  </script>
</body>
</html>
