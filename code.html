<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Simple Code Editor" />
  <link rel="manifest" href="manifest.json">
  <title>Code Viewer</title>
  <style>

html {
  background-color: black;
  padding-top: env(safe-area-inset-top);
}

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: row;
  font-family: Arial, sans-serif;
  background-color: black;
  color: white;
  height: 100%;
  position: relative;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#editorContainer {
  flex: 38;
  display: flex;
  position: relative;
  background-color: black;
  min-width: 0;
  overscroll-behavior: contain;
}

#preview {
  flex: 62;
  border: none;
  background-color: #333333;
  overflow: auto;
  min-width: 0;
  overscroll-behavior: contain;
}

#controlPanel {
  flex: 0 0 auto;
  background-color: black;
  max-width: 100%;
  box-sizing: border-box;
}

#controlPanel > div {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-start;
  justify-content: flex-start;
  padding: 15px 10px;
  box-sizing: border-box;
  height: 100%;
  max-width: 110px;
}

#editor {
  flex: 1;
  padding: 10px;
  border: none;
  resize: none;
  font-family: monospace;
  font-size: 14px;
  line-height: 1.2;
  background-color: black;
  color: white;
  outline: none;
  caret-color: white;
  position: relative;
  box-sizing: border-box;
  overflow: auto;
  white-space: pre;
  min-width: 0;
}

/* --- БАЗОВЫЕ СТИЛИ --- */
.searchRow {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;
  transition: transform 0.15s ease;
}

.actionsRow {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
}

/* --- ЭЛЕМЕНТЫ --- */
#searchField {
  padding: 0 8px;
  font-size: 14px;
  border: 1px solid #555;
  background-color: #333333;
  color: white;
  height: 30px;
  min-height: 30px;
  max-height: 30px;
  box-sizing: border-box;
  border-radius: 5px;
  outline: none;
  line-height: 28px;
  appearance: none;
  -webkit-appearance: none;
  margin: 0;
  width: 70px;
  flex: 0 0 70px;
  min-width: 0;
}

#prevMatchButton,
#nextMatchButton,
#undoButton,
#redoButton {
  width: 30px;
  height: 30px;
  min-height: 30px;
  max-height: 30px;
  background-color: #333333;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 18px;
  border-radius: 5px;
  flex: 0 0 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  margin: 0;
}

#fileFormat {
  font-size: 14px;
  width: 70px;
  height: 30px;
  min-height: 30px;
  max-height: 30px;
  box-sizing: border-box;
  display: block;
  margin: 0;
  flex: 0 0 auto;
}

#openButton {
  display: block;
  width: 60px;
  height: 30px;
  min-height: 30px;
  max-height: 30px;
  background-color: #28a745;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 14px;
  border-radius: 5px;
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  flex: 0 0 auto;
}

#saveButton {
  display: block;
  width: 60px;
  height: 30px;
  min-height: 30px;
  max-height: 30px;
  background-color: #007bff;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 14px;
  border-radius: 5px;
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  flex: 0 0 auto;
}

#strictNoCache {
  width: 20px;
  height: 20px;
  min-height: 20px;
  max-height: 20px;
  margin: 0;
  cursor: pointer;
  accent-color: #007bff;
  flex-shrink: 0;
  display: block;
}

.logoLink {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  height: 40px;
  margin: 0;
  padding: 0;
}

.logoLink img {
  height: 40px;
  width: auto;
  display: block;
}

/* --- ПОРТРЕТ --- */
@media (orientation: portrait) {
  body {
    flex-direction: column;
  }

  #editorContainer {
    flex: 1 1 40%;
    min-height: 0;
    width: 100%;
  }

  #preview {
    flex: 1 1 50%;
    min-height: 0;
    width: 100%;
  }

  #controlPanel {
    flex: 0 0 auto;
    width: 100%;
    border-left: none;
    border-top: 1px solid #222;
  }

  #controlPanel > div {
    padding: 10px;
    height: auto;
    width: 100%;
    max-width: none;
  }

  #searchField {
    width: auto;
    flex: 1 1 80px;
    min-width: 60px;
  }

  .actionsRow {
    flex-direction: row;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
    box-sizing: border-box;
  }
}

/* --- ШИРОКИЙ ПОРТРЕТ --- */
@media (orientation: portrait) and (min-width: 768px) {
  #controlPanel > div {
    gap: 6px;
    height: auto;
    padding: 8px 10px;
    width: 100%;
    box-sizing: border-box;
    max-width: none;
  }

  #searchField {
    width: 200px;
    flex: 0 0 200px;
  }

  .actionsRow {
    flex-wrap: nowrap;
  }

  #fileFormat {
    width: 80px;
  }

  #openButton,
  #saveButton {
    width: 80px;
  }

  .logoLink img {
    height: 32px !important;
  }
}

.ios-blur-fix {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 11px;
  z-index: 2147483647;
  pointer-events: none;
  background-color: #000;
  -webkit-background-clip: text;
  color: transparent;
}
  </style>
</head>
<body>
  <div class="ios-blur-fix"></div>
  <div id="editorContainer">
    <textarea id="editor" placeholder="Type your code here..."></textarea>
  </div>

  <iframe id="preview" title="Preview"></iframe>

  <div id="controlPanel">
    <div>
      <!-- Строка 1 -->
      <div class="searchRow">
        <input type="text" id="searchField" placeholder="Search">
        <button id="prevMatchButton" title="Previous Match">▲</button>
        <button id="nextMatchButton" title="Next Match">▼</button>
        <button id="undoButton" title="Undo">↶</button>
        <button id="redoButton" title="Redo">↷</button>
      </div>

      <!-- Строка 2 -->
      <div class="actionsRow">
        <select id="fileFormat">
          <option value="html">HTML</option>
          <option value="json">JSON</option>
          <option value="txt">TXT</option>
          <option value="js">JS</option>
          <option value="css">CSS</option>
        </select>

        <button id="openButton" type="button">Load</button>
        <input
          type="file"
          id="fileInput"
          accept=".html,.htm,.json,.txt,.js,.css,text/*,application/json"
          style="display: none;"
        >

        <button id="saveButton" type="button">Save</button>

        <a href="research.html" class="logoLink">
          <img src="logo.png" alt="Feedback" style="height: 40px; opacity: 0.9; width: auto;">
        </a>

        <input
          type="checkbox"
          id="strictNoCache"
          title="Strict no-cache: adds cache-buster to XHR URLs. May affect code that validates URLs."
        >
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       1. Прелюдии для srcdoc
       ========================================================= */
    const NO_CACHE_PRELUDE_SAFE = `
<script>
(function () {
  try {
    var origFetch = window.fetch;
    if (origFetch) {
      window.fetch = function (input, init) {
        init = init || {};
        init.cache = 'no-store';
        return origFetch.call(this, input, init);
      };
    }
  } catch (e) {}
})();
<\/script>
`;

    const NO_CACHE_PRELUDE_STRICT = `
<script>
(function () {
  try {
    var origFetch = window.fetch;
    if (origFetch) {
      window.fetch = function (input, init) {
        init = init || {};
        init.cache = 'no-store';
        return origFetch.call(this, input, init);
      };
    }
    var OrigXHR = window.XMLHttpRequest;
    if (OrigXHR) {
      var origOpen = OrigXHR.prototype.open;
      OrigXHR.prototype.open = function (method, url) {
        try {
          var u = new URL(url, location.href);
          u.searchParams.set('_nocache', Date.now());
          url = u.toString();
        } catch (e) {}
        return origOpen.apply(this, [method, url].concat([].slice.call(arguments, 2)));
      };
    }
  } catch (e) {}
})();
<\/script>
`;

    const editor = document.getElementById("editor");
    const openButton = document.getElementById("openButton");
    const fileInput = document.getElementById("fileInput");
    const saveButton = document.getElementById("saveButton");
    const fileFormat = document.getElementById("fileFormat");
    const searchField = document.getElementById("searchField");
    const prevMatchButton = document.getElementById("prevMatchButton");
    const nextMatchButton = document.getElementById("nextMatchButton");
    const strictToggle = document.getElementById("strictNoCache");

    // UNDO / REDO
    const undoStack = [];
    const redoStack = [];
    const MAX_HISTORY = 100;

    let lastEditorValue = editor.value;
    let historyTimer = null;

    function saveHistory() {
      const value = editor.value;

      if (value === lastEditorValue) return;

      undoStack.push(lastEditorValue);

      if (undoStack.length > MAX_HISTORY) {
        undoStack.shift();
      }

      redoStack.length = 0;
      lastEditorValue = value;
    }

    function undo() {
      clearTimeout(historyTimer);
      saveHistory();

      if (!undoStack.length) return;

      redoStack.push(editor.value);
      editor.value = undoStack.pop();
      lastEditorValue = editor.value;

      renderPreview(editor.value);
    }

    function redo() {
      clearTimeout(historyTimer);
      saveHistory();

      if (!redoStack.length) return;

      undoStack.push(editor.value);
      editor.value = redoStack.pop();
      lastEditorValue = editor.value;

      renderPreview(editor.value);
    }

    document.getElementById("undoButton").addEventListener("click", undo);
    document.getElementById("redoButton").addEventListener("click", redo);

    // Объединяем последовательные изменения
    editor.addEventListener("input", () => {
      clearTimeout(historyTimer);
      historyTimer = setTimeout(saveHistory, 400);
    });

    // Горячие клавиши
    document.addEventListener("keydown", (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;

      if (e.key.toLowerCase() === "z") {
        e.preventDefault();
        e.shiftKey ? redo() : undo();
      }

      if (e.key.toLowerCase() === "y") {
        e.preventDefault();
        redo();
      }
    });

    let currentFileBaseName = "code";
    let searchMatches = [];
    let currentMatchIndex = -1;
    let currentSearchTerm = "";

    const mimeTypes = {
      html: "text/html",
      json: "application/json",
      txt: "text/plain",
      js: "application/javascript",
      css: "text/css",
    };

    function splitFileName(fileName) {
      const lastDot = fileName.lastIndexOf(".");
      if (lastDot <= 0) {
        return {
          baseName: fileName || "code",
          ext: "",
        };
      }
      return {
        baseName: fileName.slice(0, lastDot),
        ext: fileName.slice(lastDot + 1).toLowerCase(),
      };
    }

    function getPrelude() {
      return document.getElementById('strictNoCache').checked
        ? NO_CACHE_PRELUDE_STRICT
        : NO_CACHE_PRELUDE_SAFE;
    }

    function renderPreview(code) {
      const oldFrame = document.getElementById("preview");
      const newFrame = oldFrame.cloneNode(false);
      oldFrame.replaceWith(newFrame);

      let doc = code;
      if (fileFormat.value === "html") {
        doc = getPrelude() + doc;
      }
      newFrame.srcdoc = doc;
    }

    editor.addEventListener("input", () => {
      renderPreview(editor.value);
    });

    strictToggle.addEventListener("change", () => {
      renderPreview(editor.value);
    });

    openButton.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const { baseName, ext } = splitFileName(file.name);
      currentFileBaseName = baseName;

      const reader = new FileReader();
      reader.onload = () => {
        editor.value = typeof reader.result === "string" ? reader.result : "";
        clearTimeout(historyTimer);
        undoStack.length = 0;
        redoStack.length = 0;
        lastEditorValue = editor.value;
        if (ext === "htm") {
          fileFormat.value = "html";
        } else if (mimeTypes[ext]) {
          fileFormat.value = ext;
        }

        renderPreview(editor.value);
        fileInput.value = "";
      };
      reader.readAsText(file, "UTF-8");
    });

    saveButton.addEventListener("click", () => {
      const format = fileFormat.value;
      const safeBaseName = (currentFileBaseName || "code").replace(/[\\/:*?"<>|]+/g, "_");
      const blob = new Blob([editor.value], { type: mimeTypes[format] || "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${safeBaseName}.${format}`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    function highlightMatch(index) {
      if (index === -1 || searchMatches.length === 0) return;
      const start = searchMatches[index];
      const end = start + currentSearchTerm.length;
      editor.focus();
      editor.setSelectionRange(start, end);

      const linesBefore = editor.value.substring(0, start).split("\n").length - 1;
      editor.scrollTop = Math.max(0, (linesBefore - 2) * 16.8);
    }

    function startSearch(searchText) {
      const trimmed = searchText.trim();
      if (trimmed === "") {
        searchMatches = [];
        currentSearchTerm = "";
        return;
      }

      searchMatches = [];
      currentSearchTerm = trimmed;
      const content = editor.value.toLowerCase();
      const term = trimmed.toLowerCase();
      let index = content.indexOf(term, 0);

      while (index !== -1) {
        searchMatches.push(index);
        index = content.indexOf(term, index + term.length);
      }

      if (searchMatches.length > 0) {
        currentMatchIndex = 0;
        highlightMatch(currentMatchIndex);
      }
    }

    searchField.addEventListener("keydown", (e) => {
      if (e.key === "Enter") startSearch(searchField.value);
    });

    nextMatchButton.addEventListener("click", () => {
      if (searchField.value !== currentSearchTerm) {
        startSearch(searchField.value);
      } else if (searchMatches.length) {
        currentMatchIndex = (currentMatchIndex + 1) % searchMatches.length;
        highlightMatch(currentMatchIndex);
      }
    });

    prevMatchButton.addEventListener("click", () => {
      if (searchField.value !== currentSearchTerm) {
        startSearch(searchField.value);
      } else if (searchMatches.length) {
        currentMatchIndex = (currentMatchIndex - 1 + searchMatches.length) % searchMatches.length;
        highlightMatch(currentMatchIndex);
      }
    });

    function stopGlobalScroll(e) {
      e.preventDefault();
    }

    editor.addEventListener("touchmove", (e) => {
      const touchY = e.touches[0].clientY;
      const rect = editor.getBoundingClientRect();
      if (touchY > rect.top + 20 && touchY < rect.bottom - 20) {
        e.stopPropagation();
      }
    }, { passive: false });

    editor.addEventListener("pointerdown", () => {
      window.addEventListener("wheel", stopGlobalScroll, { passive: false });
      window.addEventListener("touchmove", stopGlobalScroll, { passive: false });
    });

    window.addEventListener("pointerup", () => {
      window.removeEventListener("wheel", stopGlobalScroll);
      window.removeEventListener("touchmove", stopGlobalScroll);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }

    const viewport = window.visualViewport;
    const searchRow = document.querySelector(".searchRow");

    function moveSearchRow() {
      if (!viewport) return;

      const keyboardHeight = Math.max(
        0,
        window.innerHeight - viewport.height - viewport.offsetTop
      );

      const rect = searchRow.getBoundingClientRect();
      const availableBottom = viewport.offsetTop + viewport.height;

      const overflow = rect.bottom - availableBottom;

      searchRow.style.transform =
        keyboardHeight > 100 && overflow > 0
          ? `translateY(-${overflow + 8}px)`
          : "";
    }

    if (viewport) {
      viewport.addEventListener("resize", moveSearchRow);
      viewport.addEventListener("scroll", moveSearchRow);
    }
  </script>
</body>
</html>
